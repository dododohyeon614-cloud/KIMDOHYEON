<style>
  :root{
    --ground:#EBEFF2; --surface:#FFFFFF; --sunken:#E2E8EC;
    --ink:#16212B; --muted:#556775; --faint:#7C8D9A;
    --line:#C7D3DB; --hair:#DCE4E9;
    --a1:#0E6C8B; --a1bg:#DCEDF3;      /* 융합 */
    --a2:#8C3866; --a2bg:#F3E0EA;      /* 제어 */
    --a3:#925D00; --a3bg:#F6E9D2;      /* 정정 */
    --a4:#1F6B4A; --a4bg:#DDEBE3;      /* 시스템 */
    --shadow:rgba(22,33,43,.16);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0F151B; --surface:#18212A; --sunken:#131C24;
      --ink:#DFE7EC; --muted:#96A7B4; --faint:#748896;
      --line:#2E3D49; --hair:#253240;
      --a1:#4CB2D0; --a1bg:#10333F;
      --a2:#DE8AB3; --a2bg:#3A1F2E;
      --a3:#E0A63A; --a3bg:#352913;
      --a4:#56B98B; --a4bg:#12301F;
      --shadow:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0F151B; --surface:#18212A; --sunken:#131C24;
    --ink:#DFE7EC; --muted:#96A7B4; --faint:#748896;
    --line:#2E3D49; --hair:#253240;
    --a1:#4CB2D0; --a1bg:#10333F;
    --a2:#DE8AB3; --a2bg:#3A1F2E;
    --a3:#E0A63A; --a3bg:#352913;
    --a4:#56B98B; --a4bg:#12301F;
    --shadow:rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.72;
       -webkit-font-smoothing:antialiased}

  /* ---------- masthead ---------- */
  .top{border-bottom:1px solid var(--line);background:var(--surface)}
  .top-in{max-width:82rem;margin:0 auto;padding:1.5rem 1.3rem;
          display:flex;flex-wrap:wrap;align-items:baseline;gap:.7rem 1.2rem}
  .brand{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:1.4rem;
         letter-spacing:-.02em;margin:0}
  .sub{font-size:.86rem;color:var(--muted);margin:0}
  .hint{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.06em;
        color:var(--a1);border:1px dashed var(--a1);padding:.28rem .6rem;margin-left:auto}

  /* ---------- layout ---------- */
  .shell{max-width:82rem;margin:0 auto;padding:1.6rem 1.3rem 5rem;
         display:grid;grid-template-columns:15rem minmax(0,1fr);gap:2rem;align-items:start}
  @media(max-width:900px){.shell{grid-template-columns:1fr;gap:1.2rem}}

  /* ---------- nav ---------- */
  nav{position:sticky;top:1.2rem;display:flex;flex-direction:column;gap:1rem;
      max-height:calc(100vh - 2.4rem);overflow-y:auto}
  @media(max-width:900px){nav{position:static;max-height:none}}
  .search{width:100%;padding:.5rem .7rem;background:var(--surface);color:var(--ink);
          border:1px solid var(--line);font-family:"IBM Plex Sans KR",sans-serif;font-size:.87rem}
  .search:focus{outline:2px solid var(--a1);outline-offset:1px}
  .grp{display:flex;flex-direction:column;gap:.2rem}
  .grp-h{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.14em;
         text-transform:uppercase;color:var(--faint);padding:.35rem .2rem;
         border-bottom:1px solid var(--hair);margin-bottom:.25rem}
  .nl{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
      font-family:inherit;font-size:.88rem;color:var(--muted);padding:.34rem .55rem;
      border-left:2px solid transparent;line-height:1.4}
  .nl:hover{color:var(--ink);background:var(--surface)}
  .nl:focus-visible{outline:2px solid var(--a1);outline-offset:-2px}
  .nl.on{color:var(--ink);font-weight:600;border-left-color:var(--ink);background:var(--surface)}
  .nl.hide{display:none}

  /* ---------- content ---------- */
  main{background:var(--surface);border:1px solid var(--line);padding:2rem 2.1rem 2.4rem;
       display:flex;flex-direction:column;gap:1.15rem;min-height:60vh}
  @media(max-width:560px){main{padding:1.4rem 1.2rem 1.8rem}}
  .kick{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.14em;
        text-transform:uppercase;align-self:flex-start;padding:.2rem .55rem;border:1px solid currentColor}
  .k1{color:var(--a1)} .k2{color:var(--a2)} .k3{color:var(--a3)} .k4{color:var(--a4)}
  main h2{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:1.62rem;margin:0;
          line-height:1.22;letter-spacing:-.015em;text-wrap:balance}
  .lede{color:var(--muted);margin:0;font-size:1rem}
  main h3{font-family:"Gothic A1",sans-serif;font-weight:700;font-size:1.06rem;
          margin:1rem 0 -.15rem;padding-top:.55rem;border-top:1px solid var(--hair)}
  main h3:first-of-type{border-top:0;padding-top:0}
  main p{margin:0}
  main ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.32rem}

  .eq{font-family:"IBM Plex Mono",monospace;font-size:.83rem;background:var(--sunken);
      padding:.8rem .95rem;overflow-x:auto;white-space:pre;line-height:1.62;color:var(--ink)}
  code{font-family:"IBM Plex Mono",monospace;font-size:.85em;background:var(--sunken);
       padding:.08em .36em;color:var(--muted)}

  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.87rem}
  th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--hair);vertical-align:top}
  th{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.1em;
     text-transform:uppercase;color:var(--faint);font-weight:500;background:var(--sunken);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}

  .flag{border-left:3px solid var(--a3);background:var(--a3bg);padding:.8rem 1rem;font-size:.9rem}
  .flag b{color:var(--a3)}
  .good{border-left:3px solid var(--a4);background:var(--a4bg);padding:.8rem 1rem;font-size:.9rem}
  .good b{color:var(--a4)}
  .src{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--faint);
       border-top:1px solid var(--hair);padding-top:.7rem;margin-top:.3rem}

  /* ---------- glossary trigger ---------- */
  .g{border:0;background:none;padding:0;font:inherit;color:var(--a1);cursor:pointer;
     border-bottom:1px dotted var(--a1);line-height:inherit}
  .g:hover{background:var(--a1bg)}
  .g:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
  .g::after{content:"?";font-family:"IBM Plex Mono",monospace;font-size:.62em;
            vertical-align:super;margin-left:.12em;opacity:.75}

  /* ---------- nav footer ---------- */
  .navfoot{display:flex;flex-direction:column;gap:.4rem;padding-top:.6rem;
           border-top:1px solid var(--hair)}
  .navfoot a{font-size:.8rem;color:var(--muted);text-decoration:none;
             font-family:"IBM Plex Mono",monospace}
  .navfoot a:hover{color:var(--a1)}

  /* ---------- modal ---------- */
  .back{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;z-index:50;
        align-items:center;justify-content:center;padding:1.2rem}
  .back.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);max-width:34rem;width:100%;
         max-height:82vh;overflow-y:auto;padding:1.6rem 1.7rem;
         box-shadow:0 18px 48px var(--shadow);display:flex;flex-direction:column;gap:.85rem}
  .m-top{display:flex;align-items:flex-start;gap:1rem}
  .m-tag{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.13em;
         text-transform:uppercase;color:var(--faint);border:1px solid var(--line);
         padding:.16rem .45rem;align-self:flex-start}
  .m-title{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:1.25rem;margin:0;line-height:1.25}
  .m-x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);
       font-family:"IBM Plex Mono",monospace;font-size:.8rem;cursor:pointer;padding:.2rem .5rem;flex:none}
  .m-x:hover{color:var(--ink);border-color:var(--ink)}
  .m-x:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
  .modal p{margin:0;font-size:.94rem}
  .modal .eq{font-size:.8rem}
  .m-see{font-size:.82rem;color:var(--faint);display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">

    <div id="nav"></div>

      <a href="https://claude.ai/code/artifact/176ee49f-ec8c-47d8-a8a1-cb098e49e390">↗ 아키텍처 요약</a>

<script>
(function(){
"use strict";

/* ══════════════ 용어 사전 ══════════════ */
var G = {
  cte:{tag:"오차값",t:"CTE (횡방향 오차)",b:
    "<p>차가 경로에서 <b>옆으로 벗어난 거리</b>. 단위는 미터, 목표값은 항상 0이다.</p>"+
    "<div class='eq'>CTE = −P_x·sin(ψ) + P_y·cos(ψ)\n\n부호  + : 경로가 내 왼쪽\n      − : 경로가 내 오른쪽</div>"+
    "<p>앞뒤 거리는 보지 않는다. 지구 좌표를 차 기준 좌표로 <b>회전변환</b>한 뒤 옆 성분만 꺼낸 값이다. "+
    "웨이포인트 <em>점</em>이 아니라 점과 점을 이은 <em>선분</em>에 수선을 내려 잰다 — 점으로 재면 값이 톱니처럼 튀기 때문.</p>"},

  lfd:{tag:"길이",t:"LFD (전방주시거리)",b:
    "<p>“<b>얼마나 멀리 보고 핸들을 꺾을까</b>”를 정하는 거리. 2.3~4.0 m 사이에서 매 순간 바뀐다.</p>"+
    "<div class='eq'>LFD = min( 속도표 조회값 , √(1.5 × R) )\n                          └ 곡률 캡</div>"+
    "<p>빠를수록 멀리, 코너가 급할수록 가까이 본다. 고속도로에선 먼 곳을, 골목에선 코앞을 보는 것과 같은 원리다.</p>"},

  heading:{tag:"자세",t:"헤딩 ψ (프사이)",b:
    "<p>차가 <b>바라보는 절대 방향</b>. 북쪽을 기준으로 몇 도인지를 나타낸다.</p>"+
    "<p>GPS는 “어디 있는지”는 알아도 “어느 쪽을 보는지”는 모른다. 그래서 헤딩은 "+
    "<b>출발할 때 GPS 이동 방향으로 한 번 잡고</b>, 그 뒤로는 IMU가 실시간으로 추적한다.</p>"+
    "<p>수학 기호로는 ψ(프사이)를 쓴다.</p>"},

  omega:{tag:"센서값",t:"요레이트 ω (오메가)",b:
    "<p>차가 <b>지금 초당 몇 도 도는지</b>. IMU 자이로센서가 직접 재는 값이다.</p>"+
    "<p>중요한 점 — 자이로는 <b>“방향”이 아니라 “도는 속도”</b>만 안다. 방향을 알려면 이 값을 계속 더해야(적분) 하고, "+
    "더할 때마다 작은 오차도 같이 쌓인다. 그것이 드리프트다.</p>"+
    "<div class='eq'>heading += ω × dt      ← 매 주기 더함</div>"},

  L:{tag:"제원",t:"휠베이스 L = 0.73 m",b:
    "<p>앞바퀴 축과 뒷바퀴 축 사이의 거리. 이 차는 <b>0.73 m</b>다.</p>"+
    "<p>조향 관련 계산에 거의 다 등장한다.</p>"+
    "<div class='eq'>회전반경  R = L / tan(조향각)\n요레이트  ω = v · tan(δ) / L</div>"+
    "<p>조향 20°일 때 R = 0.73/tan20° = <b>2.01 m</b> — 이 차의 물리적 최소 회전반경이다.</p>"},

  drift:{tag:"오차값",t:"drift (헤딩 오차)",b:
    "<p><b>IMU가 믿는 방향</b>과 <b>GPS가 말하는 방향</b>의 차이. 단위는 도(°).</p>"+
    "<div class='eq'>drift = (기대 진행방향) − (GPS 진행방향)</div>"+
    "<p>즉 “IMU가 얼마나 틀어졌는가”를 나타내는 값이다. 눈 감고 걷다가 눈을 떴을 때 "+
    "“어? 15도나 틀어졌네” 하는 그 <b>15도</b>가 drift다.</p>"+
    "<p>크기에 따라 대응이 다르다 — 0.6~8°는 연속 미세보정, 6~60°는 drift 보정, 60° 초과는 강제 리셋.</p>"},

  yawoff:{tag:"변수",t:"yaw_offset",b:
    "<p>IMU 센서의 <b>원시 각도</b>와 <b>실제 방위</b> 사이의 차이를 담아두는 값.</p>"+
    "<div class='eq'>heading = raw_yaw + yaw_offset</div>"+
    "<p>IMU는 전원을 켠 순간을 0°로 잡으므로 실제 방위와 무관하다. 헤딩 고정 때 "+
    "<code>yaw_offset = GPS방향 − raw_yaw</code>로 한 번 맞추고, 이후 드리프트 보정은 "+
    "<b>이 offset을 조금씩 움직여서</b> 이루어진다.</p>"},

  dr:{tag:"모드",t:"DR (추측주행)",b:
    "<p>Dead Reckoning. GPS가 끊겼을 때 <b>센서만으로 위치를 이어 그리는</b> 방법.</p>"+
    "<div class='eq'>ψ += ω · dt\nx += v · cos(ψ) · dt\ny += v · sin(ψ) · dt</div>"+
    "<p>눈을 감고 걸으면서 “동쪽 세 걸음, 북쪽 두 걸음”을 계속 적어 나가는 것과 같다. "+
    "걸음 수는 엔코더가, 방향은 자이로가 댄다.</p>"+
    "<p>GPS가 <b>1.5초</b> 끊기면 전환된다. 적분이라 오차가 쌓이므로 속도도 함께 낮춘다.</p>"},

  rtk:{tag:"GPS",t:"RTK",b:
    "<p>기준국 보정을 받아 정밀도를 크게 높인 GPS 방식. 일반 GPS가 수 미터 오차라면 "+
    "RTK Fixed는 <b>수 센티미터</b> 수준이다.</p>"+
    "<p>이 코드는 GPS 품질을 5등급(없음/일반/SBAS/Float/Fixed)으로 나눠 기록한다. "+
    "다만 <b>등급별 주행 정책은 아직 없다</b> — 판별만 하고 속도·필터를 바꾸지는 않는다.</p>"},

  zoh:{tag:"신호",t:"ZOH (영차 홀드)",b:
    "<p>새 값이 올 때까지 <b>직전 값을 그대로 유지</b>하는 것. 그래프로 그리면 계단 모양이 된다.</p>"+
    "<div class='eq'>GPS 도착:  ●         ●\n제어 주기: │ │ │ │   │ │ │ │\n사용 위치: A A A A   B B B B\n           └같은 값 4번┘</div>"+
    "<p>GPS는 5 Hz, 제어는 20 Hz라 <b>같은 좌표를 4번 반복</b>해서 쓴다. 사이를 보간하지 않는다. "+
    "이 계단이 CTE 저역통과가 필요한 이유다.</p>"},

  lpf:{tag:"필터",t:"저역통과필터 (LPF) 와 α",b:
    "<p>신호를 부드럽게 만드는 장치. 이 코드는 가장 단순한 형태를 쓴다.</p>"+
    "<div class='eq'>새 값 = (이번 측정)×α + (지난 값)×(1−α)</div>"+
    "<p>α(알파)가 <b>새것을 얼마나 믿을지</b>를 정한다.</p>"+
    "<div class='tw'><table><tr><th>α</th><th>새것 반영</th><th>성격</th></tr>"+
    "<tr><td class='n'>0.1</td><td>10 %</td><td>아주 강한 필터</td></tr>"+
    "<tr><td class='n'>0.5</td><td>50 %</td><td>중간</td></tr>"+
    "<tr><td class='n'>0.9</td><td>90 %</td><td>거의 필터 아님</td></tr></table></div>"+
    "<p>시험 성적에 비유하면 α=0.1은 “이번 점수 10 % + 지금까지 평균 90 %”라 한 번 못 봐도 잘 안 떨어진다.</p>"},

  deadband:{tag:"장치",t:"데드밴드",b:
    "<p>“<b>이 정도 오차는 없는 셈 친다</b>”는 구간. 잡음에 반응하지 않게 만드는 가장 단순하고 확실한 방법이다.</p>"+
    "<div class='tw'><table><tr><th>구간</th><th>값</th></tr>"+
    "<tr><td>직선</td><td class='n'>0.06 m</td></tr>"+
    "<tr><td>코너</td><td class='n'>0.02 m</td></tr></table></div>"+
    "<p>이 안에 들어오면 적분을 쌓지 않고 오히려 <b>0.80배로 줄인다</b>.</p>"},

  slew:{tag:"장치",t:"슬루레이트 제한",b:
    "<p>값의 <b>크기</b>가 아니라 <b>변화 속도</b>를 제한하는 것.</p>"+
    "<div class='eq'>클램프 : “20°를 넘지 마라”          ← 값의 한계\n슬루   : “한 틱에 3° 넘게 바꾸지 마라” ← 변화율의 한계</div>"+
    "<p>수도꼭지를 <b>끝까지 열 수는 있지만 확 돌리지는 말라</b>는 것과 같다. "+
    "서보 모터가 0.05초에 20°를 못 움직이므로, 못 따라올 명령을 보내면 거동을 예측할 수 없게 된다.</p>"},

  clamp:{tag:"장치",t:"클램프",b:
    "<p>값이 정해진 범위를 벗어나면 <b>잘라내는</b> 것.</p>"+
    "<div class='eq'>clamp(x, −20, 20)\n   x = 25  →  20\n   x = −33 →  −20\n   x = 7   →  7</div>"+
    "<p>이 코드에는 조향 ±20°, PID ±9°, 적분 ±6.0 등 여러 클램프가 겹쳐 있다.</p>"},

  windup:{tag:"고장 모드",t:"적분 와인드업",b:
    "<p>적분이 <b>잘못 쌓인 채 스스로 못 빠져나오는</b> 현상.</p>"+
    "<div class='eq'>급코너 → 조향 20° 포화 → 더 못 꺾음\n→ 오차가 안 줄어듦 → 그래도 적분은 쌓임\n→ 코너 탈출 → 쌓인 적분이 밀어붙임\n→ 반대편으로 크게 넘어감</div>"+
    "<p>문이 잠긴 줄 모르고 계속 밀다가, 문이 열리는 순간 그 힘 그대로 넘어지는 것과 같다.</p>"+
    "<p>이 코드는 5중 장치로 막는다 — 부호반전 ×0.35, 데드밴드 ×0.80, 클램프 ±6.0, 주기 감쇠 ×0.85, 하드 리셋.</p>"},

  wn:{tag:"이론",t:"고유진동수 ω_n",b:
    "<p>제어 시스템이 <b>스스로 흔들리려는 주파수</b>. Pure Pursuit에서는 이렇게 정해진다.</p>"+
    "<div class='eq'>ω_n = √2 · v / LFD        [rad/s]</div>"+
    "<p>이 값이 커지면 반응은 빨라지지만 진동 위험도 커진다. 실측 기록에 따르면 "+
    "<b>1.2를 넘으면 발산</b>했다. 그래서 코드는 상한을 0.95로 묶는다.</p>"+
    "<p>속도 1.8 · LFD 2.8이면 ω_n = 0.91로 여유가 넉넉하다.</p>"},

  comp:{tag:"이론",t:"상보 필터",b:
    "<p>장단점이 <b>정반대인 두 센서</b>를 섞는 방법.</p>"+
    "<div class='tw'><table><tr><th></th><th>IMU</th><th>GPS</th></tr>"+
    "<tr><td>짧은 시간</td><td>정확 ✓</td><td>튐</td></tr>"+
    "<tr><td>긴 시간</td><td>쌓임</td><td>정확 ✓</td></tr></table></div>"+
    "<div class='eq'>새 헤딩 = 0.96 × IMU + 0.04 × GPS</div>"+
    "<p>IMU가 <b>부드러움</b>을, GPS가 <b>절대 기준</b>을 댄다. 서로의 약점을 정확히 메우므로 "+
    "“상보(서로 보완)”라 부른다.</p>"},

  menger:{tag:"수학",t:"Menger 곡률 (외접원)",b:
    "<p>세 점을 지나는 원의 반지름으로 <b>얼마나 굽었는지</b>를 재는 방법.</p>"+
    "<div class='eq'>R = (|AB| · |BC| · |AC|) / (4 × 삼각형 넓이)</div>"+
    "<p>삼각형 넓이 공식 <code>S = abc/4R</code>를 R에 대해 푼 것이다. 세 점을 지나는 원은 하나뿐이라, "+
    "그 반경이 곧 그 지점의 곡률 반경이 된다.</p>"+
    "<p>세 점이 <b>일직선에 가까우면</b> 넓이가 0 → R 무한대 → 곡률 0. "+
    "많이 꺾여 있으면 넓이가 커서 → R 작음 → 곡률 큼.</p>"+
    "<p>이 코드가 이 방법을 추가한 이유 — 3 m 창 평균 방식이 R≈2 m 급코너를 11°로 <b>과소평가</b>했기 때문.</p>"},

  atan2:{tag:"수학",t:"atan2",b:
    "<p>두 좌표 차이로부터 <b>방향(각도)</b>을 구하는 함수.</p>"+
    "<div class='eq'>방향 = atan2(Δy, Δx)      결과 −180° ~ 180°</div>"+
    "<p>왜 <code>atan(Δy/Δx)</code>를 안 쓰나 — 그 식은 −90°~90°만 내놓아 "+
    "<b>동서남북을 구분하지 못한다</b>. 북동쪽과 남서쪽이 같은 값으로 나온다.</p>"+
    "<p>atan2는 Δy와 Δx의 <b>부호를 따로 보고</b> 네 방향을 모두 가른다.</p>"},

  trim:{tag:"보정",t:"트림 (−1.5°)",b:
    "<p>차가 <b>가만히 둬도 한쪽으로 쏠리는</b> 정도. 이 차는 오른쪽으로 −1.5° 쏠린다.</p>"+
    "<p>어떻게 알아냈나 —</p>"+
    "<div class='eq'>주행 중 직진 명령 시 요레이트 : −3.64 °/s\n정지 상태의 자이로 값        : −0.004 °/s\n→ 센서 문제가 아니라 차체 문제</div>"+
    "<p>원인은 서보 중립 어긋남, 링키지 유격, 좌우 타이어 차이 같은 <b>하드웨어</b> 문제다.</p>"+
    "<p>보정 안 하면 직진에 +2.2° 상시 조향이 필요하고, 그걸 만들 CTE +0.14 m가 영원히 남는다.</p>"},

  plantgain:{tag:"보정",t:"플랜트 게인 (0.85 / 0.82)",b:
    "<p><b>명령한 것의 몇 %가 실제로 꺾이는지</b>. 실측 결과 약 85 %였다.</p>"+
    "<p>원인은 서보 스케일, 조향 링키지 유격, 타이어 슬립.</p>"+
    "<div class='eq'>δ_pub = (δ_ctrl + 1.5°) / 0.85    ← 좌회전\nδ_pub = (δ_ctrl + 1.5°) / 0.82    ← 우회전</div>"+
    "<p>차가 <code>y = 0.85x − 1.5</code>로 왜곡시키니, 미리 <b>역함수</b>를 통과시켜 상쇄한다. "+
    "수학의 <code>f⁻¹(f(x)) = x</code>와 같은 구조.</p>"+
    "<p>우회전만 0.82인 이유 — 강한 우조향에서 CTE가 평균 −0.105 m로 <b>바깥으로 밀렸기</b> 때문. "+
    "단 원인이 확정되지 않아 잠정 조치다.</p>"},

  tick:{tag:"단위",t:"엔코더 틱",b:
    "<p>바퀴가 얼마나 돌았는지 세는 단위. 이 차는 <b>1회전에 300틱</b>이다.</p>"+
    "<div class='eq'>tick = v × 0.01초 × 300 / 0.8482 m\n     = v × 3.537\n\n1 tick ≈ 0.283 m/s   ← 속도 분해능</div>"+
    "<p>속도를 0.283 m/s 단위로만 표현할 수 있다는 뜻이다. 이 <b>계단</b> 때문에 속도가 떨리고, "+
    "그것이 게인표·LFD표 조회를 흔들어서 코드가 별도 저역통과를 건다.</p>"},

  tau:{tag:"보정",t:"상태예측 τ = 0.50초",b:
    "<p>명령을 내려도 차는 <b>0.55초 뒤에</b> 반응한다(서보 0.45 + 센싱 0.10).</p>"+
    "<p>늦게 반응하는 것을 보이는 대로 조작하면 반드시 왕복한다 — 샤워기 온도 맞추기와 같다.</p>"+
    "<div class='eq'>ψ' = ψ + ω·τ\nx' = x + (v·τ)·cos(ψ + Δψ/2)\ny' = y + (v·τ)·sin(ψ + Δψ/2)</div>"+
    "<p><code>ψ + Δψ/2</code>는 출발 방향도 도착 방향도 아닌 <b>중간 방향</b> — 곡선을 갈 때 평균 방향이 중간값이기 때문.</p>"+
    "<p>효과: 최대 CTE 0.64 → <b>0.16 m</b>, 왕복 21.8회/분 → <b>0회</b>.</p><p>★ 남은 잔여 지연(0.55 − 0.50 = 0.05 s)은 <b>lead(L×1.2)</b>가 P항에서 기하로 메운다. 둘이 역할을 나눈다.</p>"},

  pp:{tag:"제어기",t:"Pure Pursuit",b:
    "<p>앞의 목표점을 <b>지나는 원을 그리려면 핸들을 몇 도 꺾어야 하나</b>를 계산하는 방법.</p>"+
    "<div class='eq'>δ = atan( 2·L·sin(α) / LFD )\n\nα = 목표점이 정면에서 틀어진 각도</div>"+
    "<p>오차를 지우려는 게 아니라 <b>길 모양을 그대로 따라 그리는</b> 역할이다. "+
    "순수 기하 계산이라 <b>발산하지 않는다</b> — 최대 32.4°가 수학적으로 보장된다.</p>"+
    "<p>단점: 길과 나란히 30 cm 옆으로 가면 각도가 0이라 더 고치지 않는다. 그건 PID의 몫.</p>"},

  pid:{tag:"제어기",t:"PID",b:
    "<p>오차를 세 가지 시제로 보는 제어 방식.</p>"+
    "<div class='tw'><table><tr><th>항</th><th>보는 것</th><th>사람 말로</th></tr>"+
    "<tr><td>P</td><td>지금 오차</td><td>“0.3 m 벗어났네, 그만큼 꺾자”</td></tr>"+
    "<tr><td>I</td><td>쌓인 오차</td><td>“아까부터 계속 오른쪽이네”</td></tr>"+
    "<tr><td>D</td><td>변화 속도</td><td>“빠르게 다가온다, 브레이크”</td></tr></table></div>"+
    "<div class='eq'>δ_pid = Kp·e + Ki·∫e·dt + Kd·(de/dt)</div>"+
    "<p>이 코드에서 PID는 <b>보조</b>다. 출력이 ±9°로 묶여 있고 실측 기여는 6 % 수준.</p>"},

  dterm:{tag:"변수",t:"d_term_lpf",b:
    "<p>CTE가 <b>초당 몇 미터씩 변하는지</b>를, 잡음을 걸러낸 뒤 기억해두는 변수. 단위는 m/s.</p>"+
    "<div class='eq'>d_cte     = cte − prev_cte\nper_sec   = d_cte / 0.05      ← 20배 증폭\nd_term_lpf += 0.16 × (per_sec − d_term_lpf)</div>"+
    "<p>0.05초로 나누므로 <b>GPS 잡음 1 cm가 0.2 m/s로 20배 뻥튀기</b>된다. "+
    "그래서 α=0.16의 강한 필터로 되누르고, 마지막에 ×0.20으로 한 번 더 줄인다.</p>"+
    "<p>부호의 뜻 — 양수면 멀어지는 중(조향 더함), 음수면 돌아오는 중(조향 덜어냄).</p>"},

  cornercut:{tag:"현상",t:"코너컷",b:
    "<p>목표점을 너무 멀리 잡아서 커브 <b>안쪽으로 질러가는</b> 현상.</p>"+
    "<div class='eq'>코너컷 오차 ≈ LFD² / (8R)</div>"+
    "<p>LFD가 길수록, 코너 반경 R이 작을수록 심해진다. 이 오차를 0.18 m 이하로 묶으려고 "+
    "<code>LFD ≤ √(1.5 × R)</code>이라는 곡률 캡을 건다.</p>"},

  under:{tag:"현상",t:"언더스티어 (바깥밀림)",b:
    "<p>핸들을 꺾은 만큼 <b>안 돌아서 커브 바깥으로 밀려나는</b> 현상.</p>"+
    "<p>이 차는 우회전에서 CTE 평균 −0.105 m로 밀렸다(좌회전은 −0.016으로 양호). "+
    "그래서 우회전 게인만 0.85 → 0.82로 낮춰 3.7 % 더 꺾게 했다.</p>"+
    "<p>다만 이것이 <b>진짜 언더스티어</b>인지, 회전 중 안테나 투영 계산의 <b>측정 편향</b>인지 "+
    "아직 확정되지 않았다.</p>"},

  sse:{tag:"현상",t:"정상상태 오차",b:
    "<p>시간이 아무리 지나도 <b>사라지지 않고 남는 오차</b>.</p>"+
    "<p>이 차의 사례 —</p>"+
    "<div class='eq'>차가 −1.5° 쏠려 있음\n→ 직진하려면 +2.2° 조향이 상시 필요\n→ P항이 그걸 만들려면 CTE가 있어야 함 (P = Kp × CTE)\n→ CTE +0.14 m 가 영원히 남음</div>"+
    "<p>P항만으로는 못 지운다. <b>I항(적분)</b>이 시간에 따라 값을 키워서 지운다.</p>"},

  ff:{tag:"이론",t:"피드백 vs 피드포워드",b:
    "<div class='tw'><table><tr><th></th><th>피드백</th><th>피드포워드</th></tr>"+
    "<tr><td>방식</td><td>벌어진 만큼 되돌림</td><td>앞을 보고 미리 정함</td></tr>"+
    "<tr><td>타이밍</td><td>일이 생긴 <b>후</b></td><td>일이 생기기 <b>전</b></td></tr>"+
    "<tr><td>이 차에서</td><td>횡방향(CTE→조향)</td><td>종방향(곡률→속도)</td></tr></table></div>"+
    "<p>이 시스템의 <b>속도는 오차로 정하지 않는다</b>. 앞 도로가 얼마나 굽었는지를 미리 스캔해서 "+
    "필요한 속도를 계획한다 — 그것이 피드포워드다.</p>"},

  bike:{tag:"모델",t:"자전거 모델",b:
    "<p>네 바퀴 자동차를 <b>앞바퀴 하나 + 뒷바퀴 하나</b>로 단순화한 모델. 자전거처럼 보여서 이 이름이다.</p>"+
    "<div class='eq'>ψ̇ = (v / L) · tan(δ)\n\nψ̇ : 도는 속도    v : 전진 속도\nL  : 휠베이스    δ : 조향각</div>"+
    "<p>좌우 바퀴의 미세한 차이를 무시해도 실제 거동과 잘 맞아서, 자율주행 제어에서 널리 쓰인다.</p>"+
    "<p>이 코드는 여기에 실측 계수 0.85를 곱해서 쓴다.</p>"},

  wp:{tag:"데이터",t:"웨이포인트 (WP)",b:
    "<p>매핑할 때 저장해 둔 <b>길 위의 점</b>들. CSV 파일 한 줄이 점 하나다.</p>"+
    "<div class='eq'>latitude, longitude, direction\n  위도      경도    1=전진 / −1=후진</div>"+
    "<p>실제 주행 기록으로는 <b>480~490개</b> 규모. 출발점과 끝점이 겹치는 루프 경로면 "+
    "자동으로 뒷부분을 잘라낸다(안 자르면 한 바퀴 돌고 시작점으로 빨려 들어감).</p>"},

  ego:{tag:"토픽",t:"/ego_state",b:
    "<p>융합 노드가 <b>20 Hz로 발행</b>하는 “내 상태” 묶음. 제어의 모든 계산이 여기서 출발한다.</p>"+
    "<div class='tw'><table><tr><th>칸</th><th>내용</th></tr>"+
    "<tr><td class='n'>0, 1</td><td>위도, 경도 (뒷차축 투영)</td></tr>"+
    "<tr><td class='n'>4</td><td>헤딩 ψ</td></tr>"+
    "<tr><td class='n'>5</td><td>속도 v</td></tr>"+
    "<tr><td class='n'>6</td><td><b>0.0 고정</b> — 조향각 자리이나 미사용</td></tr></table></div>"+
    "<p>6번 칸이 늘 0이라는 것은 <b>조향각 센서가 없다</b>는 뜻이다.</p>"},

  rear:{tag:"기하",t:"뒷차축 투영 (0.865 m)",b:
    "<p>GPS 안테나는 뒷차축보다 <b>0.865 m 앞</b>에 달려 있다. 그 좌표를 뒷차축 위치로 옮기는 계산.</p>"+
    "<div class='eq'>rear_x = x − 0.865 · cos(ψ)\nrear_y = y − 0.865 · sin(ψ)</div>"+
    "<p><b>헤딩을 알아야만</b> “뒤”가 어느 쪽인지 정해지므로, IMU가 위치 계산에 관여하는 지점이다.</p>"+
    "<p>왜 뒷차축인가 — 자동차 바퀴는 옆으로 미끄러지지 않아 뒷바퀴 중심은 항상 차가 향한 방향으로만 움직인다"+
    "(<b>횡속도 0</b>). 그래서 DR 적분과 Pure Pursuit 기하가 정확해진다.</p>"},

  swing:{tag:"기하",t:"안테나 선회 보상 (ω·d)",b:
    "<p>회전 중 안테나는 뒷차축보다 <b>바깥으로 휘어</b> 지나간다. 그래서 안테나의 이동 방향은 "+
    "차의 헤딩과 다르다.</p>"+

 "<h3>2단계 · 두 점으로 방향 만들기</h3>"+

 "<h3>3단계 · 그런데 그냥 빼면 안 된다</h3>"+

 "차는 멀쩡한데 방향이 다르게 측정됨.</td><td>“헤딩이 맞다면 안테나는 어디로 갈까”를 먼저 계산</td></tr></table></div>"+

 "<h3>4단계 · 최종 오차값</h3>"+

 src:"gps_imu.py:855-880"},

ratio:{grp:"센서 융합", k:1, nav:"0.96 : 0.04", t:"왜 하필 4 %인가",

"drift-levels":{grp:"센서 융합", k:1, nav:"보정 4단계", t:"오차 크기별로 다르게 고친다",
 lede:"틀어진 각도가 얼마냐에 따라 세기가 달라진다.",
 h:
 "<h3>여기서 말하는 각도는?</h3>"+
 "<p>"+g('drift','drift')+" — <b>IMU가 믿는 방향과 GPS가 말하는 방향의 차이</b>다. "+
 "눈 감고 걷다 눈을 떴을 때 “15도나 틀어졌네” 하는 그 15도.</p>"+

 "<h3>4단계</h3>"+
 "<div class='eq'>0 ~ 0.6°   →  무시 (잡음일 가능성)\n0.6 ~ 8°   →  연속 미세보정  gain 0.040 · 5 Hz\n"+
 "6 ~ 60°    →  drift 보정     gain 0.04~0.10 · 최대 1 Hz\n60° 초과   →  강제 리셋     100 % + 이동 1.5 m 조건</div>"+
 "<p><b>6~8°는 두 보정이 겹친다.</b> 빈 구간은 없다.</p>"+

 "<h3>두 보정기의 차이</h3>"+
 "<div class='tw'><table><tr><th></th><th>연속 미세보정</th><th>drift 보정</th></tr>"+
 "<tr><td>담당</td><td class='n'>0.6 ~ 8°</td><td class='n'>6 ~ 60°</td></tr>"+
 "<tr><td>주기</td><td>GPS마다 (5 Hz)</td><td>최대 1 Hz</td></tr>"+
 "<tr><td>조건</td><td><b>직선만</b> (자이로 ≤10°/s, 산포 ≤4°)</td><td>코너도 가능 (≤45°/s)</td></tr>"+
 "<tr><td>비교 대상</td><td>최근 7점 전체 변위</td><td>직전 1구간 + "+g('swing','선회보상')+"</td></tr></table></div>"+

 "<h3>왜 60°가 경계인가</h3>"+
 "<p>60° 이상은 “조금 틀어진” 수준이 아니다 — 거의 대각선 방향으로 잘못 알고 있는 것이다. "+
 "살살 고칠 게 아니라 <b>통째로 다시 맞춰야</b> 한다.</p>"+
 "<p>단, <b>이동 1.5 m 이상</b> 조건이 붙는다. 잠깐 튄 값으로 헤딩을 갈아치우면 위험하기 때문.</p>"+

 "<div class='flag'><b>보고서 정정.</b> “8°~60° 복원력 부재”는 사실이 아니다. "+
 "<code>DRIFT_CORRECT_THRESH_DEG = 6.0</code>이므로 <b>6~60°를 drift 보정이 담당</b>한다. "+
 "실제 한계는 각도가 아니라 <b>상황</b> — 정지 중이거나 급회전 중에는 게이트에 막혀 보정이 멈춘다.</div>",
 src:"gps_imu.py:168-176 · :227-236"},

dr:{grp:"센서 융합", k:1, nav:"DR 추측주행", t:"GPS가 끊기면 눈 감고 걷는다",
 lede:"1.5초 미수신이면 센서만으로 위치를 이어 그린다.",
 h:
 "<h3>전환 조건</h3>"+
 "<div class='eq'>if (지금 − 마지막 GPS) > 1.5초  →  DR 전환</div>"+
 "<p><b>1.5초</b>인 이유 — GPS가 5 Hz(0.2초 간격)이므로 <b>7~8번 연속 결측</b>이다. "+
 "한두 번 빠진 건 정상이라 기다린다.</p>"+

 "<h3>위치를 만드는 식</h3>"+
 "<div class='eq'>ψ += ω · dt                  ← 자이로로 방향을 이어감\nx += v · cos(ψ) · dt         ← 속도를 방향으로 쪼개 더함\ny += v · sin(ψ) · dt</div>"+
 "<p>삼각함수로 방향을 쪼개는 것이 전부다.</p>"+
 "<div class='eq'>        북(y)\n         │    ╱ 이동거리 = v × dt\n         │   ╱\n         │  ╱ ψ\n         └──────── 동(x)</div>"+

 "<h3>왜 뒷차축이어야 성립하나</h3>"+
 "<p>자동차 바퀴는 구르기만 하고 옆으로 미끄러지지 않는다. 그래서 뒷바퀴 중심은 "+
 "<b>항상 차가 향한 방향으로만</b> 움직인다 — <b>횡속도 0</b>.</p>"+
 "<div class='eq'>뒷차축 : 속도 = v·û                 ← 성분 하나로 완전\n안테나 : 속도 = v·û + ω·d·n̂        ← 옆 성분이 남는다</div>"+
 "<p>"+g('rear','뒷차축 투영')+"이 단순한 위치 보정이 아니라 <b>DR을 성립시키는 전제조건</b>인 이유다.</p>"+

 "<h3>한계</h3>"+
 "<p>DR도 적분이라 오차가 쌓인다. 그것도 <b>두 겹으로</b> — 자이로 오차는 방향을, 엔코더 오차는 거리를 틀어놓는다.</p>"+
 "<div class='eq'>방향이 5° 틀어진 채 10 m 주행\n→ 옆으로 벗어난 거리 = 10 × sin(5°) = 0.87 m</div>"+
 "<p>그래서 DR 중에는 <b>속도를 낮춘다.</b> 천천히 가면 같은 시간에 덜 벗어나고 복구할 여유가 생긴다.</p>"+

 "<h3>복구 — 순간이동하면 안 된다</h3>"+
 "<div class='eq'>alpha  = 경과시간 / 3.0                 (0 → 1)\nsmooth = 0.5 × (1 − cos(π × alpha))\n위치   = 시작 + (목표 − 시작) × smooth</div>"+
 "<p>위치가 갑자기 0.5 m 점프하면 "+g('cte','CTE')+"가 그만큼 튀고 조향이 확 꺾인다. "+
 "코사인 곡선은 시작과 끝에서 <b>미분값이 0</b>이라 부드럽게 출발하고 부드럽게 멈춘다.</p>",
 src:"gps_imu.py:485-504 · :1025-1041"},

predict:{grp:"조향 제어", k:2, nav:"상태예측", t:"0.50초 뒤로 시계를 돌린다",
 lede:"오차를 만들기 전에, 기준이 되는 “내 자세”를 미래로 옮긴다. 이 루프에서 가장 중요한 장치.",
 h:
 "<h3>무엇이 오차인가</h3>"+
 "<p><b>여기서는 오차를 만들지 않는다.</b> 오차를 잴 <b>기준점</b>을 옮길 뿐이다.</p>"+

 "<h3>왜 필요한가</h3>"+
 "<div class='tw'><table><tr><th>지연 요소</th><th>시간</th></tr>"+
 "<tr><td>서보가 실제로 움직이는 시간</td><td class='n'>0.45 s</td></tr>"+
 "<tr><td>GPS·파이프라인 통과</td><td class='n'>0.10 s</td></tr>"+
 "<tr><td><b>합계</b></td><td class='n'><b>0.55 s</b></td></tr></table></div>"+
 "<p>늦게 반응하는 것을 보이는 대로 조작하면 <b>반드시 왕복</b>한다 — 샤워기 온도 맞추기와 같다.</p>"+
 "<div class='flag'><b>결정적 실측.</b> 차의 진동 주파수 0.156 Hz = 제어기 설계 "+g('wn','고유진동수')+"와 <b>정확히 일치</b>. "+
 "지연이 그 주파수의 감쇠를 완전히 지워버린 것이다.</div>"+

 "<h3>어떻게</h3>"+
 "<div class='eq'>ω  = IMU 요레이트\nΔψ = ω × 0.50초\nx' = x + (v × 0.50) · cos(ψ + Δψ/2)\ny' = y + (v × 0.50) · sin(ψ + Δψ/2)</div>"+
 "<p>"+g('tau','τ=0.50초')+"의 세부는 용어를 눌러 확인. 이 예측 좌표가 "+
 "<b>CTE·WP탐색·Pure Pursuit 전부</b>에 쓰인다 — 일부만 적용하면 채널마다 시차가 생긴다.</p>"+

 "<h3>안전장치</h3>"+
 "<ul><li>예측 각도 <b>±34°</b> 상한 — 스핀 시 폭주 방지</li>"+
 "<li>IMU가 <b>0.4초</b> 이상 끊기면 예측 불신 → 직전 조향으로 대체</li>"+
 "<li>IMU 없으면 ω_n 상한 0.95 → <b>0.80</b>으로 낮춰 속도까지 보수화</li></ul>"+

 "<h3>효과</h3>"+
 "<div class='tw'><table><tr><th></th><th>최대 CTE</th><th>왕복/분</th><th>속도</th></tr>"+
 "<tr><td>OFF</td><td class='n'>0.64 m</td><td class='n'>21.8</td><td class='n'>1.97</td></tr>"+
 "<tr><td>ON</td><td class='n'>0.16 m</td><td class='n'>0</td><td class='n'>1.75</td></tr></table></div>"+
 "<div class='flag'><b>주의.</b> τ를 0.65로 키웠더니 <b>역효과</b>가 확인됐다. 너무 멀리 보면 없는 미래를 보고 미리 꺾는다. "+
 "코드 주석이 <b>0.30~0.50 유지</b>를 명시한다.</div>",
 src:"driving.py:1088-1106 · 상수 :392-394"},

cte:{grp:"조향 제어", k:2, nav:"CTE 계산", t:"옆으로 얼마나 벗어났나",
 lede:"이 루프의 주된 오차값. 목표는 언제나 0 m.",
 h:
 "<h3>무엇이 오차인가</h3>"+
 "<p>"+g('cte','CTE')+" — 경로에서 <b>수직으로 벗어난 거리</b>. 앞뒤 거리는 보지 않는다.</p>"+
 "<div class='eq'>CTE = −P_x·sin(ψ) + P_y·cos(ψ)   [m]</div>"+

 "<h3>왜 점이 아니라 선분인가</h3>"+
 "<div class='eq'>t = clamp( −(x₀·vx + y₀·vy) / (vx²+vy²), 0, 1 )\nP = (x₀ + t·vx , y₀ + t·vy)</div>"+
 "<p>중학교 기하의 <b>“점에서 직선에 내린 수선의 발”</b>이다. <code>t</code>를 0~1로 자르는 것은 "+
 "선분 밖으로 나가지 않게 하려는 것.</p>"+
 "<p>점까지 거리를 재면 웨이포인트 사이에서 값이 <b>톱니처럼</b> 튄다. 선분에 내린 수선은 매끄럽다.</p>"+

 "<h3>종방향은 어디로?</h3>"+
 "<p>앞뒤 오차는 <b>조향에 쓰지 않는다.</b> 대신 속도 쪽에서 다루는데, 그것도 “거리 오차”가 아니라 "+
 "<b>앞 도로 곡률로 미리 계획</b>하는 방식이다 — "+g('ff','피드포워드')+".</p>"+
 "<div class='tw'><table><tr><td>횡방향</td><td>피드백 (벗어난 만큼 되돌림)</td></tr>"+
 "<tr><td>종방향</td><td>피드포워드 (앞을 보고 미리 정함)</td></tr></table></div>"+

 "<h3>탐색 범위</h3>"+
 "<p>전체 480여 개를 매번 다 뒤지지 않는다. 현재 기준점 주변 약 28개 구간만 본다.</p>"+
 "<ul><li><b>속도</b> — 20 Hz로 도는데 매번 전부 계산할 수 없다</li>"+
 "<li><b>오인 방지</b> — 8자 코스처럼 경로가 자기 자신과 가까워지는 곳에서 엉뚱한 먼 구간을 고르는 것을 막는다</li></ul>",
 src:"driving.py:929-957"},

ctelpf:{grp:"조향 제어", k:2, nav:"CTE 저역통과", t:"잡음 필터가 아니라 계단 완충",
 lede:"흔히 “잡음 제거”라 하지만 실제 역할은 다르다.",
 h:
 "<h3>얼마나 강한 필터인가</h3>"+
 "<div class='eq'>cte_lpf += 0.80 × (cte_raw − cte_lpf)\n\nα = 0.80  →  τ ≈ 0.013초\n차단주파수 ≈ 12.7 Hz</div>"+
 "<p>"+g('lpf','α')+"가 0.80이면 새 값을 <b>80 %나 반영</b>한다. 차단이 12.7 Hz면 GPS(5 Hz)보다 훨씬 높아 "+
 "<b>잡음 필터로는 사실상 무의미</b>하다.</p>"+

 "<h3>비교하면 확실하다</h3>"+

pid:{grp:"조향 제어", k:2, nav:"PID 3항", t:"세 항이 서로 다른 시제를 본다",

integ:{grp:"조향 제어", k:2, nav:"적분 안정화 5중", t:"쌓되, 폭주하지 않게",

clamp9:{grp:"조향 제어", k:2, nav:"PID 상한 ±9°", t:"망가질 수 있는 쪽에 친 울타리",

 "<h3>9°는 물리적으로 무엇인가</h3>"+

 "<h3>왜 그때 잘라야 하나</h3>"+

curve:{grp:"조향 제어", k:2, nav:"곡률 스캔", t:"앞의 길이 얼마나 급한가",

 "<h3>무엇을 재나</h3>"+

 "<h3>방법 A · 헤딩 변화율 (창 3 m)</h3>"+
 "<div class='eq'>Δθ = (뒤 3m 방향) − (앞 3m 방향)\nκ  = |Δθ| / 3m         ← 곡률\nδ  = atan("+g('L','L')+" × κ)       ← 요구 조향</div>"+
 "<p>원의 곡률은 <code>κ = 1/R</code>이고 호를 Δs 갈 때 방향이 <code>Δs/R</code>만큼 바뀐다. "+
 "뒤집으면 <code>κ = Δθ/Δs</code>.</p>"+
 "<p><b>장점</b> 3 m 평균이라 GPS 잡음에 강함. <b>단점</b> 짧고 급한 코너를 놓침.</p>"+

 "<h3>두 값의 용도가 다르다</h3>"+

 "<tr><td>"+g('lfd','LFD')+" 곡률캡</td><td><b>100 %</b></td><td>급코너서 확실히 단축 → "+g('cornercut','코너컷')+" 차단</td></tr>"+

output:{grp:"조향 제어", k:2, nav:"출력 다듬기", t:"41°가 나와도 20°로 나간다",

gain:{grp:"조향 제어", k:2, nav:"게인·트림 보정", t:"차의 왜곡을 미리 상쇄",

ctecap:{grp:"속도 제어", k:2, nav:"CTE 회복 감속", t:"많이 벗어나면 속도를 줄인다",
 lede:"조향만으로 안 되면 시간을 벌어야 한다.",
 h:
 "<h3>왜 필요한가</h3>"+
 "<p>조향은 <b>±20°가 물리적 한계</b>다. 빠르게 달리는 상태로는 크게 벌어진 오차를 지우지 못한다. "+
 "속도를 낮추면 단위 시간당 진행거리가 줄어 경로에 붙기 쉽고, 더 커지기 전에 따라잡을 시간이 생긴다.</p>"+

 "<h3>코드의 값</h3>"+
 "<div class='eq'>CTE_RECOVER_START = 0.38         ← 캡 시작\nCTE_RECOVER_CAPS = [(0.48, 2.2),\n                    (0.62, 1.7),\n                    (0.80, 1.2)]</div>"+
 "<p>이것은 계산식이 아니라 <b>표를 그대로 적어둔 것</b>이다 — 최고속도와 아무 관계가 없다.</p>"+

 "<div class='flag'><b>보고서 정정 ①.</b> “최고속도 대비 비율(79/61/43 %)로 정의되어 최고속도를 변경해도 "+
 "동일한 정책이 유지된다”는 서술은 코드와 <b>반대</b>다. 절대값이므로 최고속도를 바꾸면 정책의 상대 강도가 달라진다.</div>"+

 "<h3>1.8 운용에서 무슨 일이 생기나</h3>"+
 "<p>코드 로직은 <code>if 캡 &lt; 현재목표속도</code>일 때만 적용된다. <b>캡이 현재 속도보다 낮아야</b> 의미가 있다.</p>"+
 "<div class='tw'><table><tr><th>벗어남</th><th>캡</th><th>상한 2.8일 때</th><th>상한 1.8일 때</th></tr>"+
 "<tr><td class='n'>0.48 m</td><td class='n'>2.2</td><td>2.8→2.2 (−21 %) ✓</td><td><b>무효</b> ✗</td></tr>"+
 "<tr><td class='n'>0.62 m</td><td class='n'>1.7</td><td>2.2→1.7 (−23 %) ✓</td><td>1.8→1.7 (−6 %) △</td></tr>"+
 "<tr><td class='n'>0.80 m</td><td class='n'>1.2</td><td>1.7→1.2 (−29 %) ✓</td><td>1.8→1.2 (−33 %) ✓</td></tr></table></div>"+
 "<div class='eq'>설계 의도:  21 % → 23 % → 29 %   (고르게 내려감)\n1.8 현실 :   0 % →  6 % → 33 %   (앞 두 단계 사실상 없음)</div>"+
 "<div class='flag'><b>보고서 정정 ②.</b> “단계식으로 만든 이유는 급브레이크를 피하기 위해서다”라는 설계 의도가 "+
 "1.8 운용에서는 <b>깨진다.</b> 3단계 점진 감속이 사실상 1단계 급감속이 된다.</div>"+

 "<h3>권장 조정안</h3>"+
 "<p><b>방법 A · 캡을 1.8 기준으로 재산출</b> (원래 비율 유지)</p>"+
 "<div class='eq'>CTE_RECOVER_CAPS = [(0.48, 1.42),   ← 79 %\n                    (0.62, 1.10),   ← 61 %\n                    (0.80, 1.00)]   ← 하한 제약</div>"+
 "<p>마지막 줄 주의 — 43 %면 0.77인데 <code>min_speed_ms = 1.0</code>이 하한이라 그 아래로 못 간다. "+

/* ══════════════ 렌더링 ══════════════ */
var GROUPS = ["시스템","센서 융합","조향 제어","속도 제어","정정 · 검토"];
var ORDER = Object.keys(T);
var navEl = document.getElementById("nav");
var mainEl = document.getElementById("main");
var backEl = document.getElementById("back");
var modalEl = document.getElementById("modal");
var qEl = document.getElementById("q");
var cur = null, lastFocus = null;

function buildNav(){
  var h = "";
  GROUPS.forEach(function(gr){
    var ids = ORDER.filter(function(id){return T[id].grp === gr;});
    if(!ids.length) return;
    h += '<div class="grp"><div class="grp-h">'+gr+'</div>';
    ids.forEach(function(id){
      h += '<button class="nl" type="button" data-t="'+id+'">'+T[id].nav+'</button>';
    });
    h += '</div>';
  });
  navEl.innerHTML = h;
  navEl.querySelectorAll("[data-t]").forEach(function(b){
    b.addEventListener("click", function(){ show(b.getAttribute("data-t"), true); });
  });
}

function show(id, scroll){
  var d = T[id]; if(!d) return;
  cur = id;
  var i = ORDER.indexOf(id);
  var h = '<span class="kick k'+d.k+'">'+d.grp+'</span>';
  h += '<h2>'+d.t+'</h2>';
  if(d.lede) h += '<p class="lede">'+d.lede+'</p>';
  h += d.h;
  if(d.src) h += '<div class="src">'+d.src+'</div>';
  h += '<div class="src" style="border:0;padding-top:.2rem;display:flex;gap:.5rem">';
  if(i>0) h += '<button class="g" type="button" data-jump="'+ORDER[i-1]+'" style="border-bottom-style:solid">← '+T[ORDER[i-1]].nav+'</button>';
  if(i<ORDER.length-1) h += '<button class="g" type="button" data-jump="'+ORDER[i+1]+'" style="border-bottom-style:solid">'+T[ORDER[i+1]].nav+' →</button>';
  h += '</div>';
  mainEl.innerHTML = h;

  navEl.querySelectorAll(".nl").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-t")===id);
  });
  mainEl.querySelectorAll("[data-g]").forEach(function(b){
    b.addEventListener("click", function(){ openG(b.getAttribute("data-g"), b); });
  });
  mainEl.querySelectorAll("[data-jump]").forEach(function(b){
    b.addEventListener("click", function(){ show(b.getAttribute("data-jump"), true); });
  });
  if(scroll){ mainEl.focus({preventScroll:true}); window.scrollTo({top:0,behavior:"smooth"}); }
}

function openG(k, src){
  var d = G[k]; if(!d) return;
  lastFocus = src || null;
  var h = '<div class="m-top"><span class="m-tag">'+d.tag+'</span>'+
          '<button class="m-x" type="button" id="mx" aria-label="닫기">닫기 ✕</button></div>'+
          '<h3 class="m-title" id="mtitle">'+d.t+'</h3>'+ d.b +
          '<div class="m-see">Esc 키로도 닫힙니다</div>';
  modalEl.innerHTML = h;
  backEl.classList.add("open");
  var x = document.getElementById("mx");
  x.addEventListener("click", closeG);
  x.focus();
  modalEl.querySelectorAll("[data-g]").forEach(function(b){
    b.addEventListener("click", function(){ openG(b.getAttribute("data-g"), b); });
  });
}
function closeG(){
  backEl.classList.remove("open");
  modalEl.innerHTML = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
backEl.addEventListener("click", function(e){ if(e.target===backEl) closeG(); });
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && backEl.classList.contains("open")) closeG();
});

qEl.addEventListener("input", function(){
  var v = qEl.value.trim().toLowerCase();
  navEl.querySelectorAll(".nl").forEach(function(b){
    var id = b.getAttribute("data-t");
    var hay = (T[id].nav + " " + T[id].t + " " + (T[id].lede||"")).toLowerCase();
    b.classList.toggle("hide", v.length>0 && hay.indexOf(v)<0);
  });
  navEl.querySelectorAll(".grp").forEach(function(gp){
    var any = Array.prototype.some.call(gp.querySelectorAll(".nl"), function(b){
      return !b.classList.contains("hide");
    });
    gp.style.display = any ? "" : "none";
  });
});

buildNav();
show("overview", false);
})();
</script>
