odel_route_segmented", "k": "def", "a": 602, "b": 738, "i": 0}, {"n": "_is_num", "k": "def", "a": 739, "b": 749, "i": 0}, {"n": "main", "k": "def", "a": 750, "b": 771, "i": 0}], "prompt.py": [{"n": "PromptNode", "k": "class", "a": 21, "b": 109, "i": 0}, {"n": "__init__", "k": "def", "a": 22, "b": 31, "i": 4}, {"n": "get_input", "k": "def", "a": 32, "b": 40, "i": 4}, {"n": "list_routes", "k": "def", "a": 41, "b": 56, "i": 4}, {"n": "_drive_flow", "k": "def", "a": 57, "b": 82, "i": 4}, {"n": "run", "k": "def", "a": 83, "b": 109, "i": 4}, {"n": "main", "k": "def", "a": 110, "b": 130, "i": 0}], "sensor_monitor.py": [{"n": "SensorMonitorNode", "k": "class", "a": 16, "b": 196, "i": 0}, {"n": "__init__", "k": "def", "a": 17, "b": 59, "i": 4}, {"n": "cb_fix", "k": "def", "a": 60, "b": 68, "i": 4}, {"n": "cb_imu", "k": "def", "a": 69, "b": 89, "i": 4}, {"n": "cb_encoder", "k": "def", "a": 90, "b": 100, "i": 4}, {"n": "cb_ego", "k": "def", "a": 101, "b": 108, "i": 4}, {"n": "cb_gps_status", "k": "def", "a": 109, "b": 112, "i": 4}, {"n": "calc_hz", "k": "def", "a": 113, "b": 117, "i": 4}, {"n": "age_str", "k": "def", "a": 118, "b": 127, "i": 4}, {"n": "gps_status_label", "k": "def", "a": 128, "b": 137, "i": 4}, {"n": "print_status", "k": "def", "a": 138, "b": 196, "i": 4}, {"n": "main", "k": "def", "a": 197, "b": 210, "i": 0}]}, "regions": {"driving.py": [{"a": 239, "b": 249, "t": "속도 비율 정의 — 상한이 바뀌어도 모양 유지", "w": "모든 속도 캡을 최고속도 대비 비율로 정의한다.", "y": "캡을 절대값으로 두면 상한을 낮출 때 상한보다 높은 캡이 조용히 무효가 된다. 비율이면 상한만 바꿔도 감속 프로파일 모양이 그대로 유지된다.", "h": "SPEED_TUNED_REF=2.8 기준으로 2.2/1.7/1.2 → 0.786/0.607/0.429. 실제 캡 = max_speed_ms × 비율.", "c": "★ 상한 1.8 적용 시 1.414 / 1.093 / 0.771 이 된다. 하한도 같은 방식이되 바닥값 0.8이 걸린다.", "n": ""}, {"a": 261, "b": 293, "t": "PID 게인 테이블", "w": "속도별 Kp/Ki/Kd 표. 구간 사이는 선형보간.", "y": "빠를수록 조금만 늦어도 크게 벌어지므로 게인이 커야 한다.", "h": "1.0→(1.7,0.12,0.11) 부터 2.8→(2.6,0.25,0.30) 까지 6구간.", "c": "★ 상한 1.8 운용에서는 하위 3구간(1.0/1.4/1.8)만 사용된다.", "n": ""}, {"a": 305, "b": 377, "t": "LFD 테이블", "w": "속도별 전방주시거리 표.", "y": "ω_n = √2·v/LFD 를 전 속도에서 1.0 근처로 유지하려면 LFD가 속도에 비례해야 한다.", "h": "1.0→2.3 m 부터 2.8→4.0 m 까지. 각 행 주석에 그때의 ω_n이 적혀 있다.", "c": "★ 실측 발산 임계는 ω_n≈1.2. 상한 1.8·LFD 2.8이면 0.91로 여유가 넉넉하다.", "n": ""}, {"a": 833, "b": 847, "t": "속도 수신", "w": "아두이노가 보낸 엔코더 틱을 속도(m/s)로 바꿔 저장한다.", "y": "이 시스템의 유일한 실제 되먹임이다. 게인표·LFD표 조회와 상태예측에 쓰인다.", "h": "v = (틱 / 300) × 0.8482 / 0.01. 그 뒤 LPF(τ=0.05초)로 평활.", "c": "1틱 = 0.283 m/s라 값이 계단처럼 뛴다. 그래서 필터를 거치고, 표 조회에는 더 느린 LPF(τ=0.3초)를 따로 쓴다.", "n": "cb_encoder"}, {"a": 883, "b": 891, "t": "요레이트 수신 (예측용)", "w": "IMU 자이로의 z축 회전속도를 받는다. 상태예측에 쓴다.", "y": "0.45초 뒤 헤딩을 계산하려면 '지금 얼마나 빠르게 돌고 있는지'를 알아야 한다.", "h": "가벼운 LPF로 잡음만 억제하고, 정지 중(속도<0.05)에는 자이로 바이어스를 천천히 학습한다.", "c": "바이어스 자가학습 — 정지했는데도 0이 아닌 값이 나오면 그게 센서 편향이므로, 그만큼 빼서 쓴다.", "n": "cb_imu"}, {"a": 892, "b": 923, "t": "자세 수신 — 위치·헤딩·속도", "w": "gps_imu가 20 Hz로 보내는 /ego_state를 받아 내부 변수에 담는다.", "y": "제어의 모든 계산이 이 값에서 출발한다.", "h": "0,1번 칸 = 위경도, 4번 = 헤딩, 5번 = 속도. 위치가 1 m 이상 점프하면 WP 재동기화 윈도우를 넓힌다.", "c": "★ 6번 칸(조향각)은 gps_imu가 0.0으로 하드코딩해 보내므로 실제로 쓰이지 않는다 — 조향각 센서가 없다는 뜻.", "n": "cb_ego"}, {"a": 955, "b": 1062, "t": "경로 로드 + 시작 WP 정렬", "w": "CSV에서 웨이포인트를 읽고, 지금 위치에서 어느 점부터 출발할지 정한다.", "y": "경로의 1번 점부터 무작정 가면 차가 뒤로 가려 한다. 지금 내 앞쪽에서 시작해야 한다.", "h": "① CSV 읽기 ② 루프 경로면 자동 절단 ③ 모든 제어 상태 초기화 ④ 헤딩 기준 앞쪽(lx>−0.5) 중 가장 가까운 WP 선택", "c": "★ 루프 절단 — 출발점과 끝점이 겹치면 뒷부분을 잘라낸다. 안 자르면 한 바퀴 돌고 시작점으로 빨려 들어간다.", "n": "load_waypoints"}, {"a": 1067, "b": 1082, "t": "명령 발행 — 게인·트림 보정이 걸리는 곳", "w": "계산된 속도와 조향을 /cmd_vel_raw로 내보낸다. 그 직전에 물리 보정을 건다.", "y": "명령한 각도와 실제 꺾인 각도가 다르다. 트림 −1.5°(쏠림)와 게인 0.85(부족조향)를 미리 상쇄해야 한다.", "h": "δ_pub = (δ_ctrl − TRIM) / GAIN. 좌우 게인이 다르다(L 0.85 / R 0.82). 그 뒤 ±20° 클램프.", "c": "★ 역함수 구조다. 차가 y=0.85x−1.5로 왜곡시키니 미리 반대로 왜곡시킨다. ★ 한계 — 보정 후 클램프에 막혀 δ_ctrl 15.5°(좌)/17.9°(우) 이상에서는 보정분이 잘린다.", "n": "publish_cmd"}, {"a": 1098, "b": 1182, "t": "곡률 스캔 — 앞 길이 얼마나 급한가", "w": "앞으로 0.4 m 간격으로 훑으며 '이 코너를 돌려면 몇 도 꺾어야 하나'를 계산한다.", "y": "조향 명령이 아니라 경로 기하에서 직접 읽으므로 순간 조향 잡음과 무관하다. 이 값으로 속도와 LFD를 미리 정한다(피드포워드).", "h": "두 방법을 동시에 쓴다. ① 3 m 창의 헤딩 변화율 κ=Δθ/Δs → 부드럽지만 급코너를 놓침 ② Menger 외접원(±1.2 m) → 짧은 급코너 포착", "c": "★ 왜 둘인가 — 3 m 창이 R≈2 m 급코너를 11.4°로 과소평가했다(실측). 용도도 분리한다: LFD 캡은 피크 100%, 감속은 35%, ω_n 결속은 피크 제외.", "n": "scan_curve_demand"}, {"a": 1183, "b": 1215, "t": "CTE 계산 — 경로에서 옆으로 벗어난 거리", "w": "가장 가까운 경로 선분에 수선을 내려 횡방향 오차를 구한다.", "y": "이 루프의 주된 오차값. 목표는 항상 0 m다.", "h": "① wp_idx 주변 약 28개 구간만 검색 ② 각 선분에 수선의 발 t를 0~1로 잘라 구함 ③ 가장 가까운 것 선택 ④ 차 기준 좌표로 회전변환해 좌우 성분만 추출", "c": "★ 점이 아니라 선분에 재는 이유 — 점까지 거리를 재면 WP 사이에서 값이 톱니처럼 튄다. ★ 전체를 안 뒤지는 이유 — 속도(20 Hz)와 8자 코스 오인 방지.", "n": "compute_segment_cte"}, {"a": 1258, "b": 1273, "t": "속도별 PID 게인 조회", "w": "현재 속도에 맞는 Kp, Ki, Kd를 표에서 뽑아 선형보간한다.", "y": "빠를수록 조금만 늦어도 크게 벌어지므로 게인이 커야 한다.", "h": "GAIN_TABLE의 6구간(1.0~2.8)을 속도로 보간.", "c": "★ 조회에는 저역통과된 속도(v_sched)를 쓴다 — 엔코더 계단이 게인을 흔드는 것을 막기 위해. 1.8 운용에서는 하위 3구간만 사용된다.", "n": "lookup_gains"}, {"a": 1274, "b": 1291, "t": "속도별 전방주시거리 조회", "w": "현재 속도에 맞는 LFD를 표에서 뽑는다.", "y": "ω_n = √2·v/LFD 를 전 속도에서 1.0 근처로 유지하려면 LFD가 속도에 대략 비례해야 한다.", "h": "LFD_TABLE(1.0→2.3 m ~ 2.8→4.0 m)을 보간. 이후 곡률 캡과 min을 취한다.", "c": "★ v6.6의 과단축(고속 3.1 m)이 ω_n을 1.26까지 밀어올려 발산의 원인이었다. 그래서 고속행을 4.0으로 늘렸다.", "n": "lookup_lfd"}, {"a": 1317, "b": 1923, "t": "메인 제어 루프 (20 Hz)", "w": "0.05초마다 한 번 도는 이 시스템의 심장. 인지 → 판단 → 제어를 한 번에 수행한다.", "y": "경로를 따라가려면 계속 '지금 어디 있고, 얼마나 틀렸고, 얼마나 꺾어야 하나'를 다시 계산해야 한다.", "h": "① 0.45초 뒤 자세 예측 → ② WP 탐색 → ③ 도착 판정 → ④ 곡률 스캔 → ⑤ CTE 계산 → ⑥ LFD 결정 → ⑦ 목표속도 계획 → ⑧ Pure Pursuit + PID → ⑨ 출력 다듬기 → ⑩ 발행", "c": "약 550줄로 이 패키지에서 가장 긴 함수. 순서가 중요하다 — 앞 단계의 결과를 뒤가 받아 쓴다.", "n": "control_loop"}, {"a": 1352, "b": 1385, "t": "① 상태예측 — τ초 뒤 자세로 이동", "w": "위치와 헤딩을 0.50초 뒤로 옮긴다. 오차를 만들기 전 기준점을 미래로 보내는 단계.", "y": "명령→반응 지연 0.55초. 늦게 반응하는 것을 보이는 대로 조작하면 반드시 왕복한다. 실측 진동 0.156 Hz가 설계 ω_n과 정확히 일치했다.", "h": "ω = IMU 요레이트(바이어스 차감) → Δψ = ω·τ → 중간 방향(ψ+Δψ/2)으로 v·τ 만큼 전진.", "c": "★ IMU가 0.4초 이상 끊기면 예측을 불신하고 직전 조향으로 대체한다. 효과: 왕복 21.8회/분 → 0회. 남은 잔여 지연은 lead(×1.2)가 P항에서 메운다.", "n": ""}, {"a": 1386, "b": 1415, "t": "② WP 탐색 — 기준점 갱신", "w": "경로의 어느 점을 기준으로 삼을지 정한다.", "y": "480여 개를 매번 다 뒤질 수 없고(20 Hz), 8자 코스에서 엉뚱한 먼 구간을 고르면 안 된다.", "h": "현재 wp_idx 주변 창만 검색. 앞쪽 우선, 뒤로는 절대 가지 않음, 한 번에 건너뛸 칸 수 제한.", "c": "★ 출발 직후와 GPS 점프 시에는 검색창을 넓힌다.", "n": ""}, {"a": 1416, "b": 1474, "t": "③ 도착 판정", "w": "종점까지 거리를 재고, 도착했으면 즉시 정지한다.", "y": "너무 일찍 서면 미완주고 지나치면 되돌아온다.", "h": "WP 진행률·종점 거리·속도·최종 헤딩 오차·통과 감지를 OR로 묶는다.", "c": "★ 예측 좌표가 아니라 원시 좌표를 쓴다. 예측으로 판정하면 일찍 서기 때문.", "n": ""}, {"a": 1475, "b": 1499, "t": "④ 곡률 스캔 — 근거리 + 원거리", "w": "앞 도로가 얼마나 굽었는지를 두 거리에서 읽는다.", "y": "속도와 LFD를 미리 정하기 위해. 경로 기하에서 직접 읽으므로 조향 잡음에 면역이다.", "h": "근거리 = LFD×1.6 (현재 코너), 원거리 = 최대 14 m (다가올 코너 제동).", "c": "★ 각각 3 m 창 값과 Menger 피크 값을 함께 얻는다. 용도가 다르다.", "n": ""}, {"a": 1500, "b": 1515, "t": "⑤ CTE 계산 + 저역통과", "w": "횡방향 오차를 구하고 필터를 거친다.", "y": "이 루프의 주된 오차값. 목표 0 m.", "h": "compute_segment_cte() → 점프 감지 시 필터 우회 + 적분/D항 리셋 → 아니면 α=0.80 LPF → ±4.0 클램프.", "c": "★ 6 m 점프나 세그먼트 20칸 점프는 잡음이 아니라 사건이므로 필터로 뭉개지 않고 즉시 따라간다.", "n": ""}, {"a": 1516, "b": 1544, "t": "⑥ 지연보상 lead — P항 전용", "w": "P항에 들어갈 CTE에 “곧 벗어날 양”을 미리 더한다.", "y": "지금 길 위에 있어도 비스듬하면 곧 벗어난다. 상태예측(0.50s)이 못 덮는 잔여 지연을 여기서 메운다.", "h": "lead = L × 1.2 × sin(θe), θe = 경로 접선 − 헤딩. ±0.45 m로 제한.", "c": "★ 시간이 아닌 거리 기준이라 preview 시간 = L/v 로 속도에 자동 적응하고, 식에서 v가 상쇄돼 속도 측정 오차에 강하다. I항·D항에는 넣지 않는다 — 적분이 자세 정보를 쌓으면 폭주한다.", "n": ""}, {"a": 1545, "b": 1574, "t": "⑦ LFD 결정 — 얼마나 멀리 볼까", "w": "전방주시거리를 속도와 곡률로 정한다.", "y": "빠를수록 멀리(안정), 코너가 급할수록 가까이(코너컷 차단).", "h": "LFD = min(속도표, √(1.5×R_ahead)) → LPF(α=0.40) → 비대칭 슬루(증가 0.9 / 감소 2.0).", "c": "★ Pure Pursuit 게인이 1/LFD²에 비례해서 LFD가 떨리면 게인이 떨린다. 그래서 이중으로 붙잡는다.", "n": ""}, {"a": 1575, "b": 1642, "t": "⑧ 목표속도 계획 (피드포워드)", "w": "앞 도로의 굽은 정도로 속도를 미리 정한다.", "y": "★ 속도는 오차로 정하지 않는다. 종방향이 피드백이 아닌 피드포워드인 이유다.", "h": "(a) 현재 코너 곡률 비례 감속 (b) 다가올 코너까지 제동거리 역산 v=√(v₀²+2as) (c) ω_n 정합 속도로 미리 도달.", "c": "★ 조절 폭 = v_max − v_min. 상한 1.8·하한 0.8이면 1.0 m/s 폭이다.", "n": ""}, {"a": 1643, "b": 1672, "t": "⑨ CTE 회복 + 조향 기반 감속", "w": "많이 벗어났거나 크게 꺾는 중이면 속도 상한을 걸어 복귀할 여유를 만든다.", "y": "조향은 ±20°가 한계라 빠른 상태로는 크게 벌어진 오차를 못 지운다.", "h": "CTE 0.38 m 초과 시 비율 캡(79/61/43 %) 적용. 조향 7° 초과 시 STEER_SPEED_CAPS 별도 적용.", "c": "★ 두 캡은 별개 채널이다. 상한이 바뀌어도 비율이라 감속 프로파일 모양이 유지된다.", "n": ""}, {"a": 1673, "b": 1686, "t": "⑩ 속도 PI 미세보정", "w": "계획한 속도와 실제 속도의 차이를 조금 메운다.", "y": "피드포워드만으로는 부하·경사에 따른 오차가 남는다.", "h": "게인이 매우 작다(Kp 0.08, Ki 0.0005). 가속 방향은 22 %, 감속 방향은 6 %만 반영.", "c": "★ 비대칭인 이유 — 잘못된 가속은 위험하고 잘못된 감속은 안전하다.", "n": ""}, {"a": 1705, "b": 1747, "t": "⑪ 속도 슬루 + 전환점·후진 캡", "w": "속도 변화율을 제한하고, 전후진 전환점과 후진 구간에 별도 상한을 건다.", "y": "급가속은 미끄러지고 급감속은 자세를 해친다. 전환점에서 속도가 남아 있으면 방향을 못 바꾼다.", "h": "가속 1.7 m/s², 감속 3.5~4.5 m/s². 전환점 앞에서는 near-stop 까지 선형 감속, 후진은 REV_MAX_SPEED 이하.", "c": "★ 전환점(cusp) 처리와 후진 전용 캡은 v6.0에서 추가된 기능이다.", "n": ""}, {"a": 1748, "b": 1805, "t": "⑫ Pure Pursuit — 기하 계통", "w": "LFD만큼 앞의 목표점을 찾아, 그 점을 지나는 원을 그릴 조향각을 구한다.", "y": "오차를 지우려는 게 아니라 길 모양을 그대로 따라 그리는 역할.", "h": "① 거리 ≥ LFD 이면서 앞쪽인 첫 WP 선택 ② α = atan2(ly, lx) ③ δ = atan(2L·sinα / LFD)", "c": "★ 순수 기하라 발산하지 않는다 — 최대 32.4°가 수학적으로 보장된다. 이것이 PID와의 결정적 차이.", "n": ""}, {"a": 1806, "b": 1843, "t": "⑬ PID + 합산", "w": "CTE를 오차로 삼아 보조 조향을 만들고, Pure Pursuit와 더한다.", "y": "Pure Pursuit는 정상상태 오차(길과 나란히 옆으로 가는 것)를 못 지운다. 그것이 PID의 몫.", "h": "P는 lead가 더해진 cte_ctrl, I는 적분(5중 안정화), D는 변화율(LPF+스케일). 합계를 ±9°로 자른 뒤 PP와 더한다.", "c": "★ ±9° 클램프가 PID 가지에만 걸리고 합산은 그 다음이다. 순서가 중요하다.", "n": ""}, {"a": 1844, "b": 1869, "t": "⑭ 직선 잔떨림 억제", "w": "직선에서 미세 조향을 죽인다.", "y": "직선에서 계속 미세 조향이 들어가면 차가 떨고 타이어·승차감이 상한다.", "h": "직선 판정 + |CTE|<0.08 + |δ|<3° 를 모두 만족할 때만. 0.7° 미만은 0, 그 이상은 수축.", "c": "★ 직선 판정은 Menger 피크 기준이다. 평균 곡률로 하면 14 m 내 급피크가 있어도 직선으로 오판해 턴인이 늦어진다.", "n": ""}, {"a": 1870, "b": 1899, "t": "⑮ 평활 + 슬루 + 클램프 + 저속 권한", "w": "조향 출력을 실제로 낼 수 있는 형태로 다듬는다.", "y": "합계가 이론상 41°까지 나올 수 있고, 서보는 0.05초에 20°를 못 움직인다.", "h": "평활(0.5:0.5) → 슬루(직선 1.3 / 코너 2.5~3.5 °/틱) → ±20° 클램프 → 저속 권한(×0.15~1.0).", "c": "★ 실질적으로 슬루가 가장 강력한 방어다. 직선 1.3°/틱은 v6.0에서 분리된 전용 값.", "n": ""}], "gps_imu.py": [{"a": 104, "b": 124, "t": "각도 정규화", "w": "각도를 −180° ~ 180° 범위로 접는다.", "y": "359°와 −1°는 같은 방향인데 그냥 빼면 358° 차이로 계산된다.", "h": "180을 넘으면 360을 빼고, −180 아래면 360을 더한다.", "c": "각도를 다루는 모든 코드에 반드시 필요한 함수. 이게 없으면 북쪽 근처에서 제어가 폭주한다.", "n": "normalize_angle"}, {"a": 376, "b": 438, "t": "속도 수신 + DR 위치 적분", "w": "엔코더로 속도를 계산하고, DR 모드일 때만 위치를 적분한다.", "y": "GPS가 끊겨도 위치를 이어가야 한다.", "h": "★ 핵심 한 줄 — DR이 아니면 여기서 return 한다. 즉 정상 주행에서는 위치를 적분하지 않는다.", "c": "그래서 정상 주행 위치는 GPS 갱신 때만 바뀌는 계단(영차 홀드)이 된다. 많이 오해하는 부분.", "n": "cb_encoder"}, {"a": 376, "b": 438, "t": "속도 수신 + DR 위치 적분", "w": "엔코더로 속도를 계산하고, DR 모드일 때만 위치를 적분한다.", "y": "GPS가 끊겨도 위치를 이어가야 한다.", "h": "★ 핵심 한 줄 — DR이 아니면 여기서 return 한다. 즉 정상 주행에서는 위치를 적분하지 않는다.", "c": "그래서 정상 주행 위치는 GPS 갱신 때만 바뀌는 계단(영차 홀드)이 된다. 많이 오해하는 부분이다.", "n": ""}, {"a": 532, "b": 834, "t": "GPS 수신 — 융합의 중심", "w": "GPS가 올 때마다(5 Hz) 좌표 변환, 뒷차축 투영, 헤딩 고정, 드리프트 보정을 한다.", "y": "이 함수 하나에 융합의 거의 전부가 들어 있다. GPS와 IMU가 서로를 참조하는 지점이다.", "h": "① 품질 등급 판별 ② 위경도→평면 변환 ③ 헤딩으로 뒷차축 투영 ④ (미고정이면) 헤딩 고정 시도 ⑤ DR이었으면 블렌딩 시작 ⑥ 드리프트 보정", "c": "★ 순서가 중요하다 — 뒷차축 투영에 헤딩이 필요하고, 헤딩 보정에는 안테나 원시 좌표가 필요하다. 그래서 투영좌표와 원시좌표를 분리해 쓴다(자기참조 방지).", "n": "cb_fix"}, {"a": 613, "b": 622, "t": "뒷차축 투영", "w": "GPS 안테나 좌표를 뒷차축 위치로 옮긴다.", "y": "① 회전 시 안테나는 바깥으로 휘어 위치가 부풀어 보인다 ② 뒷차축은 횡속도 0이라 이후 계산이 정확해진다.", "h": "rear = curr − 0.865 × (cosψ, sinψ). 헤딩 고정 전에는 투영하지 않는다.", "c": "★ 헤딩을 알아야 “뒤”가 정해진다 — IMU가 위치에 관여하는 지점. 이 투영이 DR을 성립시키는 전제조건이다.", "n": ""}, {"a": 623, "b": 737, "t": "헤딩 최초 고정 + 위치 확정", "w": "차를 조금 굴려 이동 방향으로 처음 방향을 확정하고, 융합 위치를 갱신한다.", "y": "GPS는 “어디 있는지”는 알아도 “어느 쪽을 보는지”는 모른다. 정지 상태에서는 헤딩을 만들 수 없다.", "h": "0.25 m 이상 이동할 때마다 방향을 버퍼에 쌓고, 산포 ≤15°에 거리·속도 조건을 충족하면 yaw_offset 확정. DR이었으면 3초 코사인 블렌딩 시작.", "c": "★ 두 경로가 있다 — ENC+GPS(1.0 m)와 GPS 단독(2.0 m). 처음 방향을 잘못 박으면 이후 전부 틀어진다.", "n": ""}, {"a": 738, "b": 826, "t": "드리프트 보정 — 융합의 핵심", "w": "GPS 이동 방향과 IMU 헤딩을 비교해 오차를 4 %씩 지운다.", "y": "자이로 적분은 시간이 지날수록 틀어진다(1분에 약 3°). GPS로 실세계 방위에 계속 정렬시켜야 한다.", "h": "① 게이트 확인(자이로·이동·속도) ② 안테나 원시좌표로 변위 방향 ③ 시간 정렬(−0.13초) ④ 선회 보상으로 기대 방향 ⑤ drift × gain 만큼 yaw_offset 이동.", "c": "★ 0.96 : 0.04 가 실제로 적용되는 곳. 투영좌표가 아닌 원시좌표를 쓰는 이유는 자기참조를 피하기 위함(투영은 헤딩으로 만든 값이므로).", "n": ""}, {"a": 835, "b": 853, "t": "과거 시점의 자세 꺼내기", "w": "지정한 시각의 헤딩과 요레이트를 이력에서 선형보간해 돌려준다.", "y": "GPS 변위는 A~B 구간의 평균 방향인데 heading은 '지금' 값이라, 그냥 비교하면 시간이 어긋난다.", "h": "(시각, 헤딩, 요레이트) 이력을 2.4초치 저장해두고 보간. 각도는 랩(±180°) 안전하게 처리.", "c": "★ 이 정렬이 없으면 코너에서 유령 드리프트 ±7~10°가 나타난다(실측).", "n": "_att_at"}, {"a": 854, "b": 925, "t": "연속 미세보정 (0.6~8°)", "w": "최근 7개 GPS 점이 직선을 이룰 때만, 그 방향으로 헤딩을 4%씩 당긴다.", "y": "큰 오차가 되기 전에 미리 조금씩 지운다.", "h": "속도 ≥0.5, 전진만, 자이로 ≤10°/s, 이동 ≥0.80 m, 방향 산포 ≤4° — 모두 만족해야 작동.", "c": "★ 조건이 매우 까다롭다. '정말 직선일 때만'이라는 뜻. 코너에서는 drift 보정이 담당한다.", "n": "_continuous_heading_correction"}, {"a": 947, "b": 1063, "t": "융합 루프 (20 Hz)", "w": "DR 전환 판정, 블렌딩 진행, /ego_state 발행을 한다.", "y": "GPS는 5 Hz지만 제어는 20 Hz를 원하므로, 이 루프가 20 Hz로 상태를 계속 내보낸다.", "h": "① GPS 1.5초 미수신 → DR 전환 ② 블렌딩 중이면 코사인 곡선으로 위치 이동 ③ /heading, /ego_state 발행", "c": "★ 여기서 위치를 새로 계산하지는 않는다. cb_fix나 cb_encoder(DR)가 갱신한 값을 그대로 내보낸다.", "n": "main_loop"}, {"a": 947, "b": 979, "t": "DR 전환 · 블렌딩 진행", "w": "GPS 단절을 감지해 DR로 넘어가고, 복구 시 위치를 부드럽게 옮긴다.", "y": "위치 점프는 CTE 점프이고 곧 조향 충격이다.", "h": "GPS 1.5초 미수신 → DR 전환. 블렌딩 중이면 smooth = 0.5(1−cos(πα))로 3초에 걸쳐 이동.", "c": "★ 코사인 곡선은 시작·끝에서 미분값이 0이라 이음매가 매끄럽다.", "n": ""}], "motor.py": [{"a": 30, "b": 59, "t": "하드웨어 상수", "w": "포트, 보드레이트, 바퀴 제원, 상한값.", "y": "이 값들이 틀리면 속도 환산이 통째로 어긋난다.", "h": "바퀴 둘레 0.8482 m, 300 tick/rev, PID 주기 10 ms → 1 tick ≈ 0.283 m/s.", "c": "★ RESET_ON_RX_TIMEOUT=False 가 중요하다 — True면 주행 중 아두이노가 재부팅되어 차량이 순간 정지한다.", "n": ""}, {"a": 147, "b": 226, "t": "시리얼 연결 (두 가지 방식)", "w": "아두이노와 시리얼 포트를 연다. 최초 연결과 복구 연결이 다르다.", "y": "최초에는 깨끗한 상태에서 시작해야 하지만, 주행 중 복구에서는 아두이노를 리셋하면 안 된다.", "h": "reset_board=True → DTR/RTS 펄스로 리셋 후 3초 대기(IDE 시리얼 모니터 방식). False → 펄스 없이 soft open.", "c": "이 구분이 '매핑 중 9초마다 차량이 멈추는' 문제를 해결한 핵심이었다.", "n": "_connect_serial"}, {"a": 247, "b": 345, "t": "엔코더 수신 (별도 스레드)", "w": "아두이노가 보내는 \"E,틱수\" 줄을 읽어 /encoder로 발행한다.", "y": "이 시스템의 유일한 실제 되먹임 경로다.", "h": "줄 단위로 버퍼링해 파싱. 포트가 죽은 하드 에러면 self.ser를 None으로 만들어 재연결 경로를 연다.", "c": "단순 무응답과 포트 단절을 구분한다 — 무응답은 기다리고, 단절만 재연결한다.", "n": "read_serial"}, {"a": 381, "b": 417, "t": "명령 송신 (20 Hz)", "w": "속도를 엔코더 틱으로 바꿔 아두이노로 보낸다.", "y": "아두이노는 m/s를 모른다. 자기가 세는 단위(틱/10 ms)로 받아야 PID를 돌릴 수 있다.", "h": "tick = v × 0.01 × 300 / 0.8482. \"C,{tick},{steer}\\n\" 전송.", "c": "★ 미세한 배려 — 0보다 크지만 1틱에 못 미치는 속도는 1틱으로 올린다. 안 그러면 아주 느린 명령이 완전 정지가 된다.", "n": "tx_loop"}, {"a": 381, "b": 417, "t": "속도 → 틱 변환 후 송신", "w": "m/s를 아두이노가 아는 단위로 바꿔 보낸다.", "y": "아두이노는 m/s를 모른다. 자기가 세는 틱/10 ms로 받아야 PID를 돌릴 수 있다.", "h": "tick = v × 0.01 × 300 / 0.8482 = v × 3.537", "c": "★ 0보다 크지만 1틱에 못 미치는 속도는 1틱으로 올린다. 안 그러면 아주 느린 명령이 완전 정지가 된다.", "n": ""}, {"a": 435, "b": 498, "t": "통신 감시 (리셋하지 않는 워치독)", "w": "아두이노 응답이 끊겼는지 확인한다. 단 포트를 리셋하지는 않는다.", "y": "★ 예전에는 3초 무응답이면 포트를 리셋했는데, 부팅 유예 8초 뒤 첫 검사에서 항상 걸려 아두이노가 재부팅되고 차량이 순간 정지하는 일이 반복됐다.", "h": "경고 로그와 상태 재전송만 한다. 포트 객체 자체가 없을 때만 soft 재연결.", "c": "Arduino Mega는 포트 open/close나 DTR 변화만으로도 리셋된다. 주행 중에는 절대 건드리면 안 된다.", "n": "watchdog_check"}], "iahrs.py": [], "mapping.py": [{"a": 179, "b": 198, "t": "경로 기록 루프", "w": "수동 주행하는 동안 일정 간격으로 위치를 CSV에 적는다.", "y": "자율주행하려면 따라갈 경로가 먼저 있어야 한다.", "h": "/ego_state의 위치와 /cmd_vel_raw의 방향(전진/후진)을 함께 기록한다.", "c": "기록된 원본은 GPS 지그재그가 그대로 남아 있어, route_remodeler로 다듬은 뒤 주행에 쓴다.", "n": "record_loop"}], "route_remodeler.py": [{"a": 241, "b": 268, "t": "RDP — 경로 단순화", "w": "Ramer–Douglas–Peucker 알고리즘. 많은 점 중 모양을 결정하는 핵심 점만 남긴다.", "y": "GPS 점 수백 개 중 대부분은 잡음이다. 골격만 뽑아야 직선과 코너를 구분할 수 있다.", "h": "양 끝을 잇는 선에서 가장 먼 점을 찾아, 그 거리가 임계값보다 크면 남기고 재귀 분할.", "c": "지도 앱에서 경로를 단순하게 그릴 때 쓰는 것과 같은 알고리즘이다.", "n": "rdp_indices"}, {"a": 317, "b": 477, "t": "경로 재구성 — 직선 + 베지어 코너", "w": "지그재그 GPS 경로를 직선 구간과 둥근 코너로 다시 그린다.", "y": "원본을 그대로 등간격화하면 지그재그가 남아 조향이 계속 떨린다.", "h": "① RDP로 큰 골격 추출 ② 직선 구간은 회귀선에 정렬 ③ 코너는 3차 베지어 필렛으로 연결", "c": "★ 코너 반경을 보수적으로 제한한다 — 좁은 코스에서 과하게 깎으면 실제 경로를 벗어나기 때문.", "n": "build_smart_path"}], "prompt.py": [{"a": 83, "b": 109, "t": "사용자 메뉴 루프", "w": "터미널에서 매핑/주행/목록/종료를 선택받는다.", "y": "사람이 시스템을 조작하는 유일한 창구.", "h": "주행 선택 시 /control_state(True)로 모터 권한을 주고 /drive_cmd로 파일명을 보낸다. Enter를 누르면 즉시 권한 박탈 + STOP.", "c": "★ 긴급 정지가 두 겹이다 — 모터 권한 차단(하드웨어)과 STOP 명령(소프트웨어)을 동시에 보낸다.", "n": "run"}], "sensor_monitor.py": []}, "sym": {"vehicle_length": {"k": "제원", "t": "vehicle_length = 0.73 m", "v": "0.73 m", "w": "앞바퀴 축과 뒷바퀴 축 사이 거리(휠베이스).", "y": "조향 계산의 거의 모든 식에 등장한다. 이 값이 틀리면 회전반경·요구조향·Pure Pursuit이 전부 어긋난다.", "h": "회전반경 R = L/tan(δ), 요레이트 ω = v·tan(δ)/L, Pure Pursuit δ = atan(2L·sinα/LFD).", "c": "자전거의 앞바퀴~뒷바퀴 거리라고 보면 된다. 길수록 같은 조향각에서 더 크게 돈다.", "hand": 1}, "STEER_MAX_DEG": {"k": "제원", "t": "STEER_MAX_DEG = 20°", "v": "20.0", "w": "ROS 쪽에서 허용하는 조향각 한계. 아두이노는 21°까지 받는다.", "y": "서보가 물리적으로 못 가는 각도를 명령하면 실제 거동을 예측할 수 없게 된다.", "h": "최종 발행 직전과 게인 보정 후 두 번 클램프된다.", "c": "핸들을 끝까지 꺾은 상태. 이 차는 20도가 끝이고, 그때 회전반경이 2.01 m다.", "hand": 1}, "max_speed_ms": {"k": "속도", "t": "max_speed_ms — ROS 파라미터", "v": "기본 1.8 m/s", "w": "주행 최고 속도 [m/s]. 런치나 명령줄에서 바꿀 수 있는 ROS 파라미터다.", "y": "모든 속도 계획(하한·곡률 감속·제동 게이팅·CTE 회복·조향 캡)의 기준점이다.", "h": "declare_parameter(\"max_speed_ms\", 1.8). 값이 바뀌면 _apply_speed_scaling()이 하한과 모든 캡을 비례 재산출한다. 실행 중 변경도 반영된다.", "c": "★ 캡을 절대값으로 두면 상한을 낮출 때 상한보다 높은 캡이 조용히 무효가 된다. 그래서 전부 비율로 두었다 — 코드 주석에 그 이유가 적혀 있다.", "hand": 1}, "min_speed_ms": {"k": "속도", "t": "min_speed_ms — 비례 산출", "v": "상한 1.8 → 0.8", "w": "주행 중 내려갈 수 있는 최저 속도. 상한에 비례해 자동 계산된다.", "y": "너무 느리면 조향이 물리적 효과를 잃고(권한 램프 0.5 m/s), 출력이 부족한 차라 오르막에서 기어간다.", "h": "min_speed_ms = min(상한, max(0.8, 상한 × 1.0/2.8)). 상한 1.8이면 1.8×0.357=0.643 인데 바닥값 0.8에 걸려 0.8이 된다.", "c": "MIN_SPEED_FLOOR=0.8 의 근거가 주석에 있다 — 조향 실효권한(0.5 m/s)보다 충분히 위여야 한다.", "hand": 1}, "WHEEL_CIRCUMFERENCE": {"k": "제원", "t": "바퀴 둘레 = 0.8482 m", "v": "0.27 × π", "w": "바퀴 한 바퀴가 굴러가는 거리. 지름 27 cm.", "y": "엔코더 틱을 실제 속도(m/s)로 바꾸는 데 필요하다.", "h": "v = (틱수 / 300) × 0.8482 / 0.01초", "c": "바퀴가 한 바퀴 돌면 84.82 cm 간다는 뜻.", "hand": 1}, "TICKS_PER_REV": {"k": "제원", "t": "TICKS_PER_REV = 300", "v": "300", "w": "바퀴 1회전당 엔코더가 세는 신호 수.", "y": "속도 분해능을 결정한다 — 1틱 ≈ 0.283 m/s.", "h": "tick = v × 0.01 × 300 / 0.8482 = v × 3.537", "c": "속도를 0.283 m/s 단위로만 표현할 수 있다는 뜻. 이 계단 때문에 속도가 떨린다.", "hand": 1}, "PREDICT_HORIZON_S": {"k": "지연보상", "t": "PREDICT_HORIZON_S = 0.50초", "v": "0.50", "w": "몇 초 뒤의 자세로 제어할지. 이 루프에서 가장 중요한 값.", "y": "명령→반응 지연이 0.55초(서보 0.45 + 센싱 0.10). 늦게 반응하는 것을 보이는 대로 조작하면 반드시 좌우로 왕복한다.", "h": "IMU 요레이트와 엔코더 속도로 τ초 뒤 위치·헤딩을 계산하고, 그 자세로 CTE·WP탐색·Pure Pursuit를 전부 수행한다. 남은 잔여 지연은 lead(×1.2)가 P항에서 추가로 메운다.", "c": "샤워기 온도 조절과 같다. 반응이 늦으면 뜨거웠다 차가웠다 왕복한다. 실측: OFF일 때 왕복 21.8회/분 → ON 0회. 단 0.65로 키우면 역효과(0.30~0.50 유지).", "hand": 1, "e": "오차를 만들지 않는다. 오차를 잴 기준점을 미래로 옮긴다."}, "PREDICT_MAX_YAW_RAD": {"k": "지연보상", "t": "PREDICT_MAX_YAW_RAD = 0.60", "v": "0.60 rad (±34°)", "w": "예측으로 미리 돌릴 수 있는 최대 각도.", "y": "차가 스핀하면 요레이트가 폭주해 예측이 엉뚱한 곳을 가리킨다.", "h": "Δψ = clamp(ω × τ, ±0.60)", "c": "안전벨트 같은 것. 평소엔 안 걸리고 사고 때만 작동한다.", "hand": 1}, "OMEGA_N_MAX": {"k": "진동", "t": "OMEGA_N_MAX = 0.95", "v": "0.95 rad/s", "w": "Pure Pursuit 고유진동수 ω_n의 상한.", "y": "ω_n = √2·v/LFD 가 1.2를 넘으면 실측으로 발산했다. 지연 0.55초가 그 주파수의 감쇠를 지워버리기 때문.", "h": "속도를 v ≤ Ω·LFD/√2 로 묶는다. IMU가 없으면 0.80으로 자동 하향.", "c": "시스템이 스스로 흔들리려는 주파수. 이 값이 크면 반응은 빠르지만 진동 위험도 커진다.", "hand": 1}, "cte": {"k": "오차값", "t": "cte — 횡방향 오차", "v": "목표 0 m", "w": "차가 경로에서 옆으로 벗어난 거리 [m]. 이 루프의 주된 오차값.", "y": "경로를 따라가려면 '얼마나 벗어났는지'를 알아야 한다. 앞뒤 거리는 조향과 무관하므로 보지 않는다.", "h": "가장 가까운 경로 선분에 수선을 내리고, 그 벡터를 차 기준 좌표로 회전변환해 좌우 성분만 꺼낸다.", "c": "부호: + = 경로가 내 왼쪽(내가 오른쪽으로 벗어남), − = 반대. 정상 주행에서는 0.1~0.35 m 범위.", "hand": 1}, "cte_raw": {"k": "오차값", "t": "cte_raw", "v": "필터 전", "w": "필터를 거치지 않은 원본 CTE.", "y": "필터 전후를 비교해 갑작스러운 점프(6 m 이상)를 감지하는 데 쓴다.", "h": "compute_segment_cte()가 돌려주는 값. 이후 LPF를 거쳐 cte가 된다.", "c": "가공 전 날것. 디버그 토픽에도 따로 실려 나간다.", "hand": 1}, "cte_lpf": {"k": "오차값", "t": "cte_lpf", "v": "α = 0.80", "w": "저역통과를 거친 CTE. 실제 제어에 쓰이는 값.", "y": "GPS가 5 Hz인데 제어는 20 Hz라 같은 값이 4번 반복되고, 5번째에 계단처럼 튄다. 그 모서리를 깎는다.", "h": "cte_lpf += 0.80 × (cte_raw − cte_lpf)", "c": "α=0.8은 새 값을 80% 반영 — 매우 약한 필터다. 잡음 제거용이 아니라 계단 완충용.", "hand": 1}, "cte_ctrl": {"k": "오차값", "t": "cte_ctrl — P항 입력", "v": "현재 = cte", "w": "P항에 들어가는 CTE. 원래는 지연보상 lead가 더해진 값이었다.", "y": "비스듬히 서 있으면 지금 길 위에 있어도 곧 벗어난다. 그 양을 미리 더하려던 것.", "h": "cte_ctrl = cte + LEAD_WHEELBASE × sin(θe)", "c": "★ 현재 LEAD_WHEELBASE_MULT = 0.0 이라 lead가 0. 즉 cte_ctrl = cte 다. 상태예측이 그 역할을 대신하며, 둘 다 켜면 P항만 이중 보상된다.", "hand": 1}, "cte_integral": {"k": "오차값", "t": "cte_integral — 적분 누적", "v": "±6.0 클램프", "w": "CTE를 시간에 대해 계속 더한 값. I항의 재료.", "y": "차가 물리적으로 오른쪽으로 쏠려(트림 −1.5°) P항만으로는 CTE +0.14 m가 영원히 남는다. 그걸 지우려면 적분이 필요하다.", "h": "평소엔 cte×dt 만큼 더하고, 데드밴드 안이면 0.80배, 경로를 가로지르면 0.35배, 항상 ±6.0으로 클램프.", "c": "한 번 잘못 쌓이면 스스로 못 빠져나온다(와인드업). 그래서 5중 방어가 붙어 있다. 실측 기여는 0.29° 이내.", "hand": 1}, "prev_cte": {"k": "변수", "t": "prev_cte", "v": "직전 값", "w": "직전 루프의 CTE. 딱 한 개만 기억한다.", "y": "D항의 재료(변화량)를 만들려면 이전 값이 필요하고, 부호반전 판정에도 쓴다.", "h": "d_cte = cte − prev_cte. 그리고 (cte × prev_cte) < 0 이면 경로를 가로지른 것.", "c": "곱이 음수 = 부호가 다름 = 차가 경로선을 넘어갔다는 뜻.", "hand": 1}, "d_term_lpf": {"k": "변수", "t": "d_term_lpf", "v": "α = 0.16 · m/s", "w": "CTE가 초당 몇 미터씩 변하는지를, 잡음을 걸러낸 뒤 기억하는 값.", "y": "0.05초로 나누므로 GPS 잡음 1 cm가 0.2 m/s로 20배 증폭된다. 그대로 쓰면 조향이 떤다.", "h": "d_cte_per_sec = (cte − prev_cte) / 0.05 → LPF(α=0.16) → ×0.20 → d_term", "c": "차단 0.61 Hz는 잡아야 할 진동(0.156 Hz)보다 4배 높고 버려야 할 잡음(5 Hz)보다 8배 낮은 자리. 부호가 음수면 '돌아오는 중'이라 조향을 덜어낸다.", "hand": 1}, "CTE_LPF_ALPHA": {"k": "필터", "t": "CTE_LPF_ALPHA = 0.80", "v": "0.80 (τ≈13 ms)", "w": "CTE 저역통과 계수.", "y": "흔히 '잡음 제거'라고 하지만 α=0.8은 새 값을 80% 반영해 거의 필터가 아니다. 실제 역할은 GPS 계단 완충.", "h": "다음 GPS가 오기 직전(0.1~0.15초)에 정착하도록 맞춰져 있다.", "c": "★ 진짜 잡음 필터는 D항 LPF(α=0.16)로 20배 강하다.", "hand": 1, "e": "CTE 자체를 다듬는다."}, "D_TERM_LPF_ALPHA": {"k": "필터", "t": "D_TERM_LPF_ALPHA = 0.16", "v": "0.16 (τ≈0.26 s)", "w": "D항 입력의 저역통과 계수.", "y": "미분이 잡음을 20배 증폭하므로 그만큼 강하게 되눌러야 한다.", "h": "새 값을 16%만 반영하고 84%는 이전 값 유지. 차단 0.61 Hz.", "c": "시험 성적에 비유하면 '이번 점수 16% + 지금까지 평균 84%'.", "hand": 1, "e": "CTE의 변화율을 다듬는다."}, "CTE_DEADBAND": {"k": "장치", "t": "CTE_DEADBAND = 0.02 m", "v": "코너 0.02 / 직선 0.06", "w": "'이 정도 오차는 없는 셈 친다'는 구간.", "y": "잡음에 반응하지 않게 만드는 가장 단순하고 확실한 방법.", "h": "이 안에 들어오면 적분을 쌓지 않고 오히려 0.80배로 줄인다.", "c": "직선에서는 더 관대하게(0.06), 코너에서는 더 예민하게(0.02).", "hand": 1, "e": "이 안에 들어오면 적분을 쌓지 않는다."}, "Ki_CLAMP": {"k": "장치", "t": "Ki_CLAMP = 6.0", "v": "±6.0", "w": "적분 누적값의 절대 상한.", "y": "적분 와인드업을 막는 최종 방어선.", "h": "i_term 최대 = 6.0 × Ki 최대 0.25 = 1.5°. 실측은 0.29° 이내.", "c": "★ 이 값이 사실상 안티와인드업을 겸한다. 크게 올리면 별도의 안티와인드업 로직이 필요해진다.", "hand": 1, "e": "적분이 쌓이는 양을 제한한다."}, "PID_STEER_LIMIT": {"k": "장치", "t": "PID_STEER_LIMIT = 9°", "v": "±9.0", "w": "PID가 단독으로 만들 수 있는 조향각의 상한.", "y": "PID는 발산할 수 있는 부품(와인드업·과게인·잡음)이고 Pure Pursuit는 기하 계산이라 발산하지 않는다. 망가질 수 있는 쪽에만 울타리를 친다.", "h": "p+i+d 를 더한 뒤 ±9°로 자르고, 그 다음 Pure Pursuit와 더한다.", "c": "9° = 회전반경 4.61 m — 차량 최소 회전반경(2.01 m)의 2.3배. 즉 급회전 권한은 경로 기하만 갖는다. 평소 실측 출력은 1° 수준(기여 94:6).", "hand": 1}, "LEAD_WHEELBASE_MULT": {"k": "지연보상", "t": "LEAD_WHEELBASE_MULT = 1.2", "v": "1.2 — 활성", "w": "지연보상 lead의 배수. 휠베이스의 몇 배를 미리 볼지.", "y": "상태예측(τ=0.50s)만으로는 실측 지연 0.55s를 다 못 덮는다. 남은 잔여 지연을 P항에서 기하로 메운다.", "h": "LEAD_WHEELBASE = 1.2 × 0.73 = 0.876 m → lead = 0.876 × sin(θe) → cte_ctrl = cte + lead (±0.45 m 제한)", "c": "★ 조정 이력이 주석에 남아 있다 — 0.0 → 1.2 → 1.4. 직선 주행 로스백에서 잔여지연이 확인되어 다시 켰다. 시간이 아닌 거리 기준이라 속도 v가 식에서 상쇄된다.", "hand": 1, "e": "P항에 들어갈 오차에 “곧 벗어날 양”을 더한다."}, "STEER_TRIM_DEG": {"k": "보정", "t": "STEER_TRIM_DEG = −1.5°", "v": "−1.5", "w": "차가 가만히 둬도 한쪽으로 쏠리는 정도. 이 차는 오른쪽으로 −1.5°.", "y": "보정하지 않으면 직진에 +2.2° 상시 조향이 필요하고, 그걸 만들 CTE +0.14 m가 영원히 남는다(정상상태 오차).", "h": "발행 직전에 δ_pub = (δ_ctrl − TRIM) / GAIN 으로 미리 빼준다.", "c": "어떻게 알아냈나 — 주행 중 직진 명령 시 요레이트가 −3.64°/s인데 정지 시 자이로는 −0.004°/s. 센서가 아니라 차체 문제라는 뜻. 원인은 서보 중립 어긋남·링키지 유격 등 하드웨어.", "hand": 1}, "STEER_PLANT_GAIN_L": {"k": "보정", "t": "STEER_PLANT_GAIN_L = 0.85", "v": "0.85 (좌회전)", "w": "명령한 조향각 중 실제로 몇 %가 꺾이는지. 좌회전은 85%.", "y": "서보 스케일·링키지 유격·타이어 슬립 때문에 명령대로 안 꺾인다. 조향각 센서가 없어 개루프로 보정할 수밖에 없다.", "h": "역함수를 취한다. 차가 y = 0.85x − 1.5 로 왜곡시키니  "c": "목표점을 너무 멀리 잡으면 커브 안쪽으로 질러간다. LFD를 짧게 하면 기하학적으로 차단된다.", "hand": 1}, "LFD_RATE_UP": {"k": "장치", "t": "LFD 슬루 (비대칭)", "v": "증가 0.9 / 감소 2.0 m/s", "w": "LFD가 변할 수 있는 속도. 늘어날 때와 줄어들 때가 다르다.", "y": "Pure Pursuit 게인이 1/LFD²에 비례해서, LFD가 갑자기 늘면 게인이 확 튄다.", "h": "코너 진입(감소)은 즉시 보호해야 하니 빠르게(2.0), 코너 탈출(증가)은 게인 점프를 막으려 천천히(0.9).", "c": "이 코드의 슬루는 전부 '안전한 쪽으로' 비대칭이다 — 가속은 느리게, 감속은 빠르게.", "hand": 1}, "CURVE_WINDOW_M": {"k": "기하", "t": "CURVE_WINDOW_M = 3.0 m", "v": "3.0", "w": "곡률을 재는 창의 길이. 3 m 구간의 헤딩 변화로 곡률을 구한다.", "y": "짧게 재면 GPS 잡음에 흔들리고, 길게 재면 부드럽지만 급코너를 놓친다.", "h": "Δθ = (뒤 3 m 방향) − (앞 3 m 방향), κ = |Δθ|/3, 요구조향 δ = atan(L·κ)", "c": "★ 단점이 있다 — R≈2 m 급코너(호 길이 2~3 m)를 3 m로 평균 내면 직선 접근부까지 섞여 11.4°로 과소평가한다. 그래서 Menger 곡률을 병행한다.", "hand": 1}, "CURVE_WINDOW_PEAK_M": {"k": "기하", "t": "CURVE_WINDOW_PEAK_M = 1.2 m", "v": "1.2", "w": "Menger 곡률(3점 외접원)을 재는 짧은 창.", "y": "3 m 창이 놓치는 짧고 급한 코너를 잡기 위해.", "h": "세 점 A(d−1.2), B(d), C(d+1.2)의 외접원 반경 R = (|AB|·|BC|·|AC|)/(4×넓이)", "c": "삼각형 넓이 공식 S = abc/4R 를 R에 대해 푼 것. 검증: 같은 코너를 3 m창 11.9° vs 피크 16.2°.", "hand": 1}, "PEAK_SPEED_BLEND": {"k": "기하", "t": "PEAK_SPEED_BLEND = 0.35", "v": "0.35", "w": "급코너 피크를 감속에 얼마나 반영할지.", "y": "피크를 100% 반영하면 완만한 코너까지 과잉 감속한다. 곡률 캡이 이미 코너컷을 막으므로 속도는 부분만 낮춘다.", "h": "near_for_speed = near_demand + 0.35 × max(0, near_peak − near_demand)", "c": "용도 분리가 핵심 — LFD 캡은 피크 100%, 감속은 35%, ω_n 결속은 피크 제외.", "hand": 1}, "CTE_RECOVER_START": {"k": "속도", "t": "CTE_RECOVER_START = 0.38 m", "v": "0.38", "w": "이만큼 벗어나면 속도 상한을 걸기 시작한다.", "y": "조향은 ±20°가 한계라 빠른 상태로는 크게 벌어진 오차를 못 지운다. 속도를 낮춰 복귀할 시간을 번다.", "h": "0.38 m를 넘으면 아래 CTE_RECOVER_CAPS 표를 적용.", "c": "정상 주행 CTE가 0.1~0.35 m이므로, 그 바로 위에 문턱을 뒀다.", "hand": 1, "e": "CTE(옆으로 벗어난 거리)가 이 값을 넘으면 발동."}, "CTE_RECOVER_CAPS": {"k": "속도", "t": "CTE_RECOVER_CAPS — 비율 산출", "v": "79 % / 61 % / 43 %", "w": "벗어난 거리별 속도 상한. 절대값이 아니라 상한 대비 비율로 정의된다.", "y": "단계식으로 만든 이유는 급브레이크를 피하기 위해서다. 비율로 두면 상한을 바꿔도 감속 프로파일 모양이 유지된다.", "h": "SPEED_TUNED_REF=2.8 기준으로 2.2/1.7/1.2 를 비율화(0.786/0.607/0.429). 이노가 부팅하는 동안 오작동으로 판단하지 않게.", "hand": 1, "f": "motor.py", "ln": 55}, "WATCHDOG_WARN_PERIOD": {"k": "하드웨어", "t": "WATCHDOG_WARN_PERIOD", "v": "5.0", "w": "같은 경고를 반복하지 않는 최소 간격(5초).", "e": "", "y": "", "h": "", "c": "", "hand": 1, "f": "motor.py", "ln": 56}, "HARD_RECONNECT_TIMEOUT": {"k": "하드웨어", "t": "HARD_RECONNECT_TIMEOUT", "v": "60.0", "w": "장시간 무응답 시 재연결을 시도하는 기준(60초).", "e": "", "y": "", "h": "", "c": "", "hand": 1, "f": "motor.py", "ln": 57}, "ARDUINO_PID_PERIOD_US": {"k": "하드웨어", "t": "ARDUINO_PID_PERIOD_US", "v": "10000", "w": "아두이노 자체 PID의 기준 주기(10000 µs = 10 ms).", "e": "", "y": "", "h": "", "c": "", "hand": 1, "f": "motor.py", "ln": 60}, "ARDUINO_PID_TOLERANCE_US": {"k": "하드웨어", "t": "ARDUINO_PID_TOLERANCE_US", "v": "1000", "w": "허용 편차(±1000 µs). 벗어나면 경고를 낸다.", "e": "", "y": "", "h": "", "c": "", "hand": 1, "f": "motor.py", "ln": 61}, "SPD_REASON_CODE": {"k": "기타 · 진단", "t": "SPD_REASON_CODE", "v": "{", "w": "'왜 이 속도가 나왔는지'를 숫자 코드로 바꾸는 표.", "e": "", "y": "", "h": "매 주기 속도를 결정한 '최종 승자' 이유(곡률/CTE/조향각/도착접근 등)를 골라 숫자로 바꿔 디버그 토픽에 실어 보낸다. 사람이 로그를 볼 때 '아, 이때는 곡률 때문에 줄였구나'를 바로 알 수 있게 하는 장치.", "c": "주행 자체에는 전혀 영향이 없다. 순수 기록용.", "hand": 1, "f": "driving.py", "ln": 208}, "GAIN_TABLE": {"k": "오차와 PID", "t": "GAIN_TABLE", "v": "[", "w": "속도별 PID 게인(P·I·D) 표. (속도, Kp, Ki, Kd) 7줄.", "e": "CTE(횡방향 오차)를 조향각으로 바꿀 때 '얼마나 세게 되돌릴지'를 정하는 계수.", "y": "", "h": "현재 속도를 표에서 찾아 위아래 두 줄 사이를 선형보간한다. 예: 1.5 m/s면 1.4줄과 1.6줄의 중간값. 느릴수록 게인이 작고(1.60/0.110/0.095), 빠를수록 크다(2.3/0.20/0.21).", "c": "표 마지막 줄 2.2 m/s는 차량 제원 최고속(2.222)과 운용 상한(1.8)을 모두 넘어 실제로는 절대 실행되지 않는 줄이다. → 모순 리포트 3번.", "hand": 1, "f": "driving.py", "ln": 261}, "LFD_TABLE": {"k": "기하 · 경로추종", "t": "LFD_TABLE", "v": "[", "w": "속도별 전방주시거리(LFD) 표. (속도, LFD[m]) 7줄.", "e": "", "y": "", "h": "빠를수록 더 멀리 본다(0.8 m/s→2.3 m, 1.8 m/s→2.8 m). 속도 사이는 선형보간. 여기서 나온 LFD가 Pure Pursuit의 목표점 거리이자, 시스템의 응답 속도 ω_n=√2·v/LFD 를 결정한다.", "c": "LFD를 늘리면 부드럽지만 굼뜨고, 줄이면 민첩하지만 흔들린다. 이 표가 사실상 '주행 성격'을 정한다. 2.2줄은 도달 불가.", "hand": 1, "f": "driving.py", "ln": 305}, "DT_ENC": {"k": "하드웨어", "t": "DT_ENC", "v": "0.01", "w": "아두이노가 속도 PID를 도는 주기. 0.01초 = 100 Hz.", "e": "", "y": "", "h": "엔코더 틱 수를 실제 속도로 바꿀 때 나눗셈의 분모로 쓴다. 속도 = 틱 × 바퀴둘레 ÷ 한바퀴틱수 ÷ 0.01. 반대로 원하는 속도를 틱 명령으로 바꿀 때는 곱한다.", "c": "이 값이 아두이노 펌웨어 실제 주기와 다르면 속도가 통째로 어긋난다. ROS(20 Hz)와 아두이노(100 Hz)는 5배 차이 나는 별개 루프다.", "hand": 1, "f": "driving.py", "ln": 386}, "ENCODER_SPEED_LPF_TAU": {"k": "안전장치", "t": "ENCODER_SPEED_LPF_TAU", "v": "0.05", "w": "엔코더로 잰 속도를 매끈하게 다듬는 필터의 시간상수. 0.05초.", "e": "", "y": "", "h": "alpha = dt/(0.05+dt) 로 계산해 새 값을 조금씩만 섞는다. 20 Hz(dt=0.05)면 alpha=0.5, 즉 새 값 절반·옛 값 절반.", "c": "엔코더는 틱 단위라 저속에서 값이 뚝뚝 끊긴다. 그걸 이어붙이는 역할.", "hand": 1, "f": "driving.py", "ln": 387}, "LOOP_DETECT_THRESHOLD": {"k": "도착 · 정지", "t": "LOOP_DETECT_THRESHOLD", "v": "3.0", "w": "경로의 출발점과 끝점이 이만큼(3 m) 가까우면 '순환 코스'로 판단한다.", "e": "", "y": "", "h": "경로를 불러온 직후 한 번 검사한다. 순환이면 종점 도착 처리를 다르게 해야 하므로(출발점 근처를 그냥 지나가면 안 되니까) 구분한다.", "c": "웨이포인트가 20개 넘을 때만 검사한다 — 짧은 경로가 우연히 순환으로 오인되는 걸 막으려고.", "hand": 1, "f": "driving.py", "ln": 390}, "LOOP_FAR_DIST": {"k": "도착 · 정지", "t": "LOOP_FAR_DIST", "v": "5.0", "w": "순환 코스에서 '출발점을 확실히 떠났다'고 인정하는 거리. 5 m.", "e": "", "y": "", "h": "출발 직후에는 출발점 바로 옆에 있으니 '도착'으로 착각할 수 있다. 그래서 일단 5 m 이상 멀어져야 '떠남' 플래그를 켠다.", "c": "LOOP_RETURN_DIST와 짝. 5 m 떠난 뒤 1.5 m 안으로 돌아와야 한 바퀴 완주로 인정.", "hand": 1, "f": "driving.py", "ln": 391}, "LOOP_RETURN_DIST": {"k": "도착 · 정지", "t": "LOOP_RETURN_DIST", "v": "1.5", "w": "순환 코스에서 '출발점으로 돌아왔다'고 인정하는 거리. 1.5 m.", "e": "", "y": "", "h": "LOOP_FAR_DIST(5 m)를 먼저 벗어난 뒤에만 검사한다. 이 두 조건이 순서대로 만족돼야 완주 판정.", "c": "", "hand": 1, "f": "driving.py", "ln": 392}, "LEAD_WHEELBASE": {"k": "오차와 PID", "t": "LEAD_WHEELBASE", "v": "self.LEAD_WHEELBASE_MULT * self.vehicle_length", "w": "lead(선행) 보정에서 쓰는 '가상의 팔 길이'. 휠베이스 0.73 m × 배수 1.2 = 0.876 m.", "e": "CTE에 더해지는 보정량 = LEAD_WHEELBASE × sin(방향오차). 차가 옆으로 벌어진 거리뿐 아니라 '지금 비뚤어진 방향으로 계속 가면 앞으로 더 벌어질 양'을 미리 오차에 얹는다.", "y": "", "h": "방향오차 10°면 0.876×sin10°=0.152 m 를 CTE에 더한다. 위치는 맞는데 방향이 틀어져 있을 때, 실제로 벌어지기 전에 미리 핸들을 꺾게 만든다(=미분 효과, 감쇠).", "c": "이전 버전에서는 배수가 0.0이라 꺼져 있었으나 현재 GitHub 코드는 1.2로 켜져 있다.", "hand": 1, "f": "driving.py", "ln": 639}, "STATUS_PUBLISH_INTERVAL": {"k": "기타 · 진단", "t": "STATUS_PUBLISH_INTERVAL", "v": "1.0", "w": "상태 문자열을 화면/토픽으로 내보내는 간격. 1초.", "e": "", "y": "", "h": "제어는 20 Hz로 돌지만 로그까지 20 Hz로 쏟으면 읽을 수 없다. 1초에 한 번만 요약을 낸다.", "c": "", "hand": 1, "f": "driving.py", "ln": 771}, "STEER_SPEED_CAPS": {"k": "속도 계획", "t": "STEER_SPEED_CAPS", "v": "[(thr, round(mx * r, 3)) for thr, r in STEER_SPEED_CAP_RATIOS]", "w": "조향각이 클 때 속도를 잡아두는 상한 목록.", "e": "입력은 조향각 크기(도), 출력은 허용 속도 상한.", "y": "", "h": "7°→2.3/2.8, 10°→1.8/2.8, 13°→1.3/2.8 비율에 상한 1.8을 곱한다. 결과: 7° 이상 1.479 m/s, 10° 이상 1.157, 13° 이상 0.836 이하로 제한.", "c": "핸들을 많이 꺾은 채 빠르면 원심력으로 미끄러진다. 그걸 막는 장치.", "hand": 1, "f": "driving.py", "ln": 827}, "FINAL_APPROACH_ENTRY_SPEED": {"k": "도착 · 정지", "t": "FINAL_APPROACH_ENTRY_SPEED", "v": "round(mx * APPROACH_ENTRY_RATIO, 3)", "w": "종점 접근 구간에 들어갈 때 허용하는 최고 속도.", "e": "", "y": "", "h": "기준 2.8 대비 2.6/2.8 비율 × 상한 1.8 = 1.671 m/s.", "c": "상한이 1.8인 상황에서 1.671은 거의 제한이 없는 값이다. 사실상 '접근 구간 진입'만 표시하고 감속은 뒤쪽 거리기반 로직이 담당한다.", "hand": 1, "f": "driving.py", "ln": 828}, "GPS_STATUS_NO_FIX": {"k": "센서 융합", "t": "GPS_STATUS_NO_FIX", "v": "-1", "w": "GPS 상태 코드 -1. 위성을 못 잡아 위치를 전혀 모르는 상태.", "e": "", "y": "", "h": "이 상태면 GPS 값을 믿지 않고 DR(추측항법)로 넘어간다.", "c": "", "hand": 1, "f": "gps_imu.py", "ln": 109}, "GPS_STATUS_FIX": {"k": "센서 융합", "t": "GPS_STATUS_FIX", "v": "0", "w": "GPS 상태 코드 0. 일반 GPS 측위. 오차 수 m 급.", "e": "", "y": "", "h": "위치는 나오지만 정밀하지 않다.", "c": "", "hand": 1, "f": "gps_imu.py", "ln": 110}, "GPS_STATUS_SBAS_FIX": {"k": "센서 융합", "t": "GPS_STATUS_SBAS_FIX", "v": "1", "w": "GPS 상태 코드 1. 위성 보정신호를 받은 상태. 일반보다 조금 정확.", "e": "", "y": "", "h": "상태 표시에만 쓰인다.", "c": "", "hand": 1, "f": "gps_imu.py", "ln": 111}, "GPS_STATUS_GBAS_FIX": {"k": "센서 융합", "t": "GPS_STATUS_GBAS_FIX", "v": "2", "w": "GPS 상태 코드 2. 지상 기준국 보정(RTK 계열). 오차 cm 급.", "e": "", "y": "", "h": "가장 정확한 등급.", "c": "★ 이 등급 정보가 driving.py로 전달 안 닿는다.", "locs": [["gps_imu.py", 109], ["driving.py", 774]]}, {"sev": "warn", "t": "조향 되먹임 자리(/ego_state 6번 칸)가 0.0 으로 비어 있다", "where": "gps_imu.py (/ego_state 발행) ↔ driving.py:774 (cb_ego)", "what": "위치·방향·속도 등을 한 배열에 담아 주고받는데, 그중 조향각 자리에 실제 값 대신 0.0 이 들어간다. 아두이노가 실제 바퀴 각도를 되돌려 주지 않기 때문이다.", "ev": ["self.create_subscription(Float64MultiArray, \"/ego_state\", self.cb_ego, 10)", "#     A,angle 같은 조향각 실측 피드백을 아두이노에 추가해 τ 를 추정이 아니라", "#     직접 측정부터 하고 시작할 것"], "why": "1번 모순(지연 τ)을 풀 수 있는 유일한 실측 경로가 이 칸이다. 지금은 '명령한 각도'만 알고 '실제로 꺾인 각도'는 모른다. 그래서 τ 를 로그 상관관계로 간접 추정할 수밖에 없었고, 그 추정이 갈렸다(0.70 / 0.93 / 1.20 / 1.25초).", "fix": "아두이노 펌웨어에 조향각 회신을 추가하고 그 값을 6번 칸에 채우는 것. 코드 주석이 직접 권고하고 있는 항목이다.", "locs": [["driving.py", 774], ["driving.py", 356]]}, {"sev": "note", "t": "헤더 주석의 PEAK_SPEED_BLEND 값(0.35)과 실제 코드값(0.50)이 다르다", "where": "driving.py:21,30~31 (주석) ↔ driving.py:499 (코드)", "what": "급코너에서 감속을 얼마나 반영할지 정하는 값. 파일 맨 위 설명에는 0.35 로 적혀 있고 튜닝 안내도 '0.35→0.5로 올려보라'고 되어 있는데, 실제 코드는 이미 0.50 이다.", "ev": ["- 감속: PEAK_SPEED_BLEND(0.35)만 부분 반영 → 완만·보통 코너 순항속도 보존", "· [튜닝] 급코너서 아직 밀리면: PEAK_SPEED_BLEND 0.35→0.5, GATE_HOLD_SPEED 1.6→1.4.", "self.PEAK_SPEED_BLEND        = 0.50"], "why": "동작에는 문제가 없다(코드가 이긴다). 다만 문서를 믿고 '0.5로 올려야지' 하면 이미 올라간 값을 또 올리게 된다. 튜닝 안내가 이미 실행된 상태라는 표시가 없다.", "fix": "헤더 주석을 0.50 으로 갱신하고 튜닝 안내에서 그 항목을 지우는 것.", "locs": [["driving.py", 21], ["driving.py", 499]]}, {"sev": "note", "t": "STEER_PLANT_GAIN 은 정의만 되어 있고 아무도 쓰지 않는다", "where": "driving.py:570 (정의) ↔ driving.py:1074 (실제 사용은 L/R 분리판)", "what": "조향 명령이 실제로 몇 퍼센트나 먹히는지 나타내는 보정 계수. 좌회전용(0.85)과 우회전용(0.82)으로 나뉜 뒤, 원래의 통합 상수는 남아 있지만 참조되지 않는다.", "ev": ["self.STEER_PLANT_GAIN = 0.85       # (하위호환/기본값) 좌우 분리는 아래 L/R 사용", "plant_gain = self.STEER_PLANT_GAIN_R if float(steer_deg) < 0.0 else self.STEER_PLANT_GAIN_L"], "why": "죽은 값이다. 나중에 이걸 고치면 뭔가 바뀔 거라 착각하기 쉽다. 실제로 바꿔야 하는 건 L/R 두 개다.", "fix": "지우거나 주석에 '사용 안 함'을 더 크게 표시하는 것. 지금 주석에도 '하위호환'이라고는 적혀 있다.", "locs": [["driving.py", 570], ["driving.py", 1074]]}, {"sev": "note", "t": <script>
(function(){
"use strict";
var DB = JSON.parse(document.getElementById("D").textContent);
var sideEl=document.getElementById("side"), codeEl=document.getElementById("code"),
    wrapEl=document.getElementById("codewrap"), panEl=document.getElementById("panel");
var curFile=null, curLines=[];

var KW={};
"False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield self".split(" ")
  .forEach(function(k){KW[k]=1;});

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ── 이름 찾기: 수기 전역 → 파일별(함수·자동) → 파이썬/ROS 기본 ── */
function look(w, fn){
  var f=fn||curFile;
  if(DB.sym[w]) return {t:"hand", d:DB.sym[w]};
  var m=DB.symf[f];
  if(m && m[w]) return {t:(m[w].hand?"hand":"auto"), d:m[w]};
  if(DB.bi[w]) return {t:"bi", d:DB.bi[w]};
  return null;
}
function cls(kind){ return kind==="hand"?"id":(kind==="auto"?"ida":"idb"); }

/* ── 파이썬 토크나이저 ── */
function tokenize(lines, fn){
  var out=[], triple=null;
  var Q3D='"'+'"'+'"', Q3S="'"+"'"+"'";
  for(var li=0; li<lines.length; li++){
    var s=lines[li], i=0, h="";
    while(i<s.length){
      if(triple){
        var e=s.indexOf(triple,i);
        if(e<0){h+='<span class="st">'+esc(s.slice(i))+'</span>'; i=s.length;}
        else{h+='<span class="st">'+esc(s.slice(i,e+3))+'</span>'; i=e+3; triple=null;}
        continue;
      }
      var c=s[i];
      if(c==="#"){h+='<span class="cm">'+esc(s.slice(i))+'</span>'; i=s.length; continue;}
      var t3=s.substr(i,3);
      if(t3===Q3D||t3===Q3S){
        var e2=s.indexOf(t3,i+3);
        if(e2<0){h+='<span class="st">'+esc(s.slice(i))+'</span>'; triple=t3; i=s.length;}
        else{h+='<span class="st">'+esc(s.slice(i,e2+3))+'</span>'; i=e2+3;}
        continue;
      }
      if(c==='"'||c==="'"){
        var j=i+1;
        while(j<s.length){ if(s[j]==="\\"){j+=2;continue;} if(s[j]===c){j++;break;} j++; }
        h+='<span class="st">'+esc(s.slice(i,j))+'</span>'; i=j; continue;
      }
      if(/[0-9]/.test(c)){
        var k=i; while(k<s.length && /[0-9._eExXaAbBcCdDfF]/.test(s[k])) k++;
        h+='<span class="nm">'+esc(s.slice(i,k))+'</span>'; i=k; continue;
      }
      if(/[A-Za-z_]/.test(c)){
        var k2=i; while(k2<s.length && /[A-Za-z0-9_]/.test(s[k2])) k2++;
        var w=s.slice(i,k2), r=look(w,fn);
        if(r) h+='<span class="'+cls(r.t)+'" data-s="'+w+'">'+esc(w)+'</span>';
        else if(KW[w]) h+='<span class="kw">'+esc(w)+'</span>';
        else if(s[k2]==="(") h+='<span class="fnc">'+esc(w)+'</span>';
        else h+=esc(w);
        i=k2; continue;
      }
      h+=esc(c); i++;
    }
    out.push(h);
  }
  return out;
}

/* ── 사이드바 ── */
var SEVC={crit:"s3", warn:"s2", note:"s1"}, SEVT={crit:"★★★", warn:"★★", note:"★"};
function buildSide(){
  var h='<div class="gh">이름 찾기</div>'+
        '<input id="q" type="search" placeholder="예: CTE, 지연, lfd, 조향" autocomplete="off">'+
        '<div id="qres"></div>';
  h+='<div class="gh">모순 리포트 '+DB.cons.length+'건</div><div id="conlist">';
  DB.cons.forEach(function(c,i){
    h+='<button class="cb '+SEVC[c.sev]+'" type="button" data-c="'+i+'"><b>'+
       ("0"+(i+1)).slice(-2)+'</b>'+esc(c.t.length>44?c.t.slice(0,44)+"…":c.t)+'</button>';
  });
  h+='</div><div class="gh">패키지 파일</div>';
  DB.files.forEach(function(f){
    h+='<button class="fb" type="button" data-f="'+f.f+'">'+f.f+'<small>'+f.d+'</small></button>';
  });
  h+='<div class="gh" style="margin-top:.9rem">함수 · 클래스</div><div id="outline"></div>';
  sideEl.innerHTML=h;
  sideEl.querySelectorAll("[data-f]").forEach(function(b){
    b.addEventListener("click",function(){ openFile(b.getAttribute("data-f")); });
  });
  sideEl.querySelectorAll("[data-c]").forEach(function(b){
    b.addEventListener("click",function(){ showCon(+b.getAttribute("data-c")); });
  });
  document.getElementById("q").addEventListener("input", search);
}

function search(){
  var t=(this.value||"").trim().toLowerCase(), box=document.getElementById("qres");
  if(t.length<1){ box.innerHTML=""; return; }
  var res=[], seen={};
  function add(name, d, kind, file){
    var id=name+"|"+(file||"");
    if(seen[id]) return; seen[id]=1;
    var nm=name.toLowerCase();
    var head=((d.t||"")+" "+(d.w||"")+" "+(d.e||"")).toLowerCase();
    var rest=((d.h||"")+" "+(d.y||"")+" "+(d.c||"")+" "+(d.cm||"")+" "+(d.nt||"")+" "+(d.src||"")).toLowerCase();
    var s;
    if(nm.indexOf(t)===0) s=0;
    else if(nm.indexOf(t)>=0) s=1;
    else if(head.indexOf(t)>=0) s=2;
    else if(rest.indexOf(t)>=0) s=3;
    else return;
    if(kind!=="hand") s+=0.5;
    res.push({n:name, k:kind, f:file||"", s:s});
  }
  for(var k in DB.sym) add(k, DB.sym[k], "hand", "");
  DB.files.forEach(function(fo){
    var m=DB.symf[fo.f]||{};
    for(var k2 in m) add(k2, m[k2], m[k2].hand?"hand":"auto", fo.f);
  });
  for(var k3 in DB.bi) add(k3, DB.bi[k3], "bi", "");
  res.sort(function(a,b){
    if(a.s!==b.s) return a.s-b.s;
    if((a.f===curFile)!==(b.f===curFile)) return a.f===curFile?-1:1;
    return a.n.length-b.n.length;
  });
  var h="";
  res.slice(0,80).forEach(function(r){
    h+='<button class="qr" type="button" data-q="'+r.n+'" data-qf="'+r.f+'">'+esc(r.n)+
       '<i>'+(r.k==="hand"?"해설":(r.k==="auto"?"자동":"기본"))+(r.f&&r.f!==curFile?" · "+r.f.replace(".py",""):"")+'</i></button>';
  });
  box.innerHTML=h||'<div class="rl" style="padding:.3rem">없음</div>';
  box.querySelectorAll("[data-q]").forEach(function(b){
    b.addEventListener("click",function(){
      var n=b.getAttribute("data-q"), f=b.getAttribute("data-qf");
      if(f && f!==curFile) openFile(f, function(){ showSym(n); jumpToFirst(n); });
      else { showSym(n); jumpToFirst(n); }
    });
  });
}
function jumpToFirst(name){
  var re=new RegExp("\\b"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b");
  for(var i=0;i<curLines.length;i++){ if(re.test(curLines[i])){ gotoLine(i+1); hit(i+1); return; } }
}
function hit(n){
  codeEl.querySelectorAll(".L.hit").forEach(function(e){e.classList.remove("hit");});
  var el=codeEl.querySelector('[data-l="'+n+'"]'); if(el) el.classList.add("hit");
}

function buildOutline(fn){
  var ol=DB.outline[fn]||[], rs=DB.regions[fn]||[];
  var named={}; rs.forEach(function(r){ if(r.n) named[r.n]=1; });
  var h="";
  ol.forEach(function(o){
    var pad=(o.i>0?"&nbsp;&nbsp;":"");
    h+='<button class="ob'+(named[o.n]?" has":"")+'" type="button" data-a="'+o.a+'" data-b="'+o.b+'" data-n="'+o.n+'">'+
       pad+esc(o.n)+' <span class="ln">'+o.a+'</span></button>';
  });
  document.getElementById("outline").innerHTML=h||'<div class="rl" style="padding:.3rem">없음</div>';
  document.getElementById("outline").querySelectorAll("[data-a]").forEach(function(b){
    b.addEventListener("click",function(){
      var a=+b.getAttribute("data-a"), bb=+b.getAttribute("data-b"), n=b.getAttribute("data-n");
      gotoLine(a); markRange(a,bb);
      var r=look(n); if(r && r.d.hand) showSym(n); else showRegion(a,bb);
    });
  });
}

function openFile(fn, cb){
  curFile=fn;
  curLines=DB.code[fn].split("\n");
  var toks=tokenize(curLines, fn), cl=DB.conline[fn]||{};
  var buf=new Array(toks.length);
  for(var i=0;i<toks.length;i++){
    buf[i]='<div class="L'+(cl[i+1]?" cn":"")+'" data-l="'+(i+1)+'"><span class="N">'+(i+1)+
           '</span><span class="C">'+(toks[i]||" ")+'</span></div>';
  }
  codeEl.innerHTML=buf.join("");
  sideEl.querySelectorAll(".fb").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-f")===fn);
  });
  buildOutline(fn);
  wrapEl.scrollTop=0;
  codeEl.querySelectorAll("[data-s]").forEach(function(sp){
    sp.addEventListener("click",function(ev){ ev.stopPropagation(); showSym(sp.getAttribute("data-s")); });
  });
  codeEl.querySelectorAll(".L.cn .N").forEach(function(nn){
    nn.style.cursor="pointer";
    nn.addEventListener("click",function(){
      var ln=nn.parentNode.getAttribute("data-l");
      var ids=(DB.conline[curFile]||{})[ln]; if(ids&&ids.length) showCon(ids[0]);
    });
  });
  if(cb) cb(); else intro();
  document.getElementById("side").classList.remove("open");
}

function gotoLine(n){
  var el=codeEl.querySelector('[data-l="'+n+'"]');
  if(!el) return;
  wrapEl.scrollTop = el.offsetTop - 80;
}
function markRange(a,b){
  codeEl.querySelectorAll(".L.rg").forEach(function(e){e.classList.remove("rg");});
  for(var i=a;i<=b && i<=curLines.length;i++){
    var e=codeEl.querySelector('[data-l="'+i+'"]'); if(e) e.classList.add("rg");
  }
}

/* ── 패널 ── */
function P(kind,title,val,blocks,concept,star,foot,tags){
  var lbl = kind==="r"?"로직 구역":(kind==="g"?"안내":(kind==="c"?"모순":"용어"));
  var h='<span class="pk '+kind+'">'+lbl+'</span>';
  if(tags) h+='<div class="tags">'+tags+'</div>';
  h+='<h2>'+title+'</h2>';
  if(val) h+='<div class="val">'+val+'</div>';
  blocks.forEach(function(b){
    if(!b[1]) return;
    h+='<div class="blk"><div class="bh">'+b[0]+'</div><p>'+b[1]+'</p></div>';
  });
  if(concept) h+='<div class="cbox'+(star?" star":"")+'"><b>쉽게 말하면</b><br>'+concept+'</div>';
  if(foot) h+='<div class="rl">'+foot+'</div>';
  panEl.innerHTML=h;
  panEl.scrollTop=0;
  panEl.classList.add("open");
  panEl.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click",function(){
      var g=b.getAttribute("data-go").split(":");
      if(g[0] && g[0]!==curFile) openFile(g[0], function(){ gotoLine(+g[1]); hit(+g[1]); });
      else { gotoLine(+g[1]); hit(+g[1]); }
    });
  });
  panEl.querySelectorAll("[data-sym]").forEach(function(b){
    b.addEventListener("click",function(){ showSym(b.getAttribute("data-sym")); });
  });
}

function usesBlock(name){
  var re=new RegExp("\\b"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b"), out=[], n=0;
  for(var i=0;i<curLines.length;i++){
    if(re.test(curLines[i])){ n++; if(out.length<40) out.push(i+1); }
  }
  if(!n) return "";
  var h='<div class="uses">';
  out.forEach(function(l){ h+='<button type="button" data-go="'+curFile+':'+l+'">'+l+'</button>'; });
  h+='</div>';
  return "이 파일에서 <b>"+n+"곳</b>에 나옵니다. 줄 번호를 누르면 그 자리로 갑니다.<br>"+h;
}

function showSym(k){
  var r=look(k); if(!r) return;
  var d=r.d;
  if(r.t==="bi"){
    P("", esc(d.t), "", [["무엇인가", esc(d.w)],["어떻게 쓰이나", esc(d.h||"")],
      ["이 파일에서", usesBlock(k)]], d.c?esc(d.c):"", false, "분류 · "+esc(d.k),
      '<span class="tg a">파이썬 · ROS 기본</span>');
    return;
  }
  if(r.t==="hand"){
    var star=(d.c||"").indexOf("★")>=0;
    var val = d.v?esc(d.v):(d.src?esc(d.src):"");
    var loc = (d.ln? (curFile+" "+d.ln+"행") : "");
    P("", esc(d.t||k), val,
      [["무엇인가", esc(d.w||"")],
       ["이 값이 재는 오차", esc(d.e||"")],
       ["왜 필요한가", esc(d.y||"")],
       ["어떻게 쓰이나", esc(d.h||"")],
       ["이 파일에서", usesBlock(k)]],
      d.c?esc(d.c).replace(/★/g,"<b>★</b>"):"", star,
      "분류 · "+esc(d.k||"")+(loc?"  ·  "+loc:""),
      '<span class="tg h">직접 쓴 해설</span>');
    return;
  }
  /* 자동 분석 */
  var gl = (d.g||[]).length ? '<ul class="glist">'+d.g.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>' : "";
  if(d.u) gl += '<p style="margin:.3rem 0 0">'+esc(d.u)+'</p>';
  var what = esc(d.nt||"") + (d.sc? "<br>이 값은 <b>"+esc(d.sc)+"()</b> 안에서 만들어집니다." : "");
  P("", esc(k), curFile+" "+d.ln+"행",
    [["이름의 뜻", gl||"이름만으로는 뜻을 풀기 어렵습니다. 아래 정의 줄과 쓰이는 곳을 보세요."],
     ["어떤 종류의 값인가", what],
     ["정의된 줄", '<span class="evq">'+esc(d.src||"")+'</span>'],
     ["옆에 붙은 설명(코드 주석)", d.cm?esc(d.cm):""],
     ["이 파일에서", usesBlock(k)]],
    "", false, "분류 · "+esc(d.k||""),
    '<span class="tg a">코드에서 자동 분석</span>');
}

function showCon(i){
  var c=DB.cons[i];
  var ev='<span class="evq">'+esc(c.ev.join("\n"))+'</span>';
  var jumps='<div class="uses">'+c.locs.map(function(l){
      return '<button type="button" data-go="'+l[0]+':'+l[1]+'">'+l[0]+":"+l[1]+'</button>';
    }).join("")+'</div>';
  P("c", esc(c.t), esc(c.where),
    [["무슨 값인가", esc(c.what)],
     ["코드 근거", ev],
     ["왜 문제인가", esc(c.why)],
     ["고친다면", esc(c.fix)],
     ["코드에서 보기", jumps]],
    "", false, "모순 "+("0"+(i+1)).slice(-2)+" · "+SEVT[c.sev],
    '<span class="tg c">'+SEVT[c.sev]+' '+(c.sev==="crit"?"심각":(c.sev==="warn"?"주의":"기록"))+'</span>');
  if(c.locs.length){
    var l=c.locs[0];
    if(l[0]!==curFile) openFile(l[0], function(){ gotoLine(l[1]); hit(l[1]); });
    else { gotoLine(l[1]); hit(l[1]); }
  }
}

function showRegion(a,b){
  var rs=DB.regions[curFile]||[], best=null;
  rs.forEach(function(r){
    if(r.a<=b && r.b>=a){
      var size=r.b-r.a;
      if(!best || size<best.size) best={r:r,size:size};
    }
  });
  if(best){
    var r=best.r, star=(r.c||"").indexOf("★")>=0;
    P("r", esc(r.t), curFile+"  "+r.a+" – "+r.b+"행",
      [["무엇을 하나", r.w],["왜 필요한가", r.y],["어떻게 동작하나", r.h]],
      r.c?r.c.replace(/★/g,"<b>★</b>"):"", star, "선택: "+a+"–"+b+"행");
    markRange(r.a,r.b);
    return;
  }
  /* 설명 구역이 없는 범위 — 소속 함수와 등장하는 이름으로 채운다 */
  var ol=DB.outline[curFile]||[], own=null;
  ol.forEach(function(o){ if(o.a<=a && o.b>=b){ if(!own || (o.b-o.a)<(own.b-own.a)) own=o; } });
  var names={}, order=[];
  for(var i=a;i<=b && i<=curLines.length;i++){
    var s=curLines[i-1].replace(/#.*$/,"");
    var m=s.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[];
    m.forEach(function(w){ if(!names[w] && look(w)){ names[w]=1; order.push(w); } });
  }
  var chips=order.slice(0,40).map(function(w){
    var r=look(w);
    return '<button type="button" class="jump" data-sym="'+w+'" style="margin:.1rem">'+esc(w)+'</button>';
  }).join("");
  var ownTxt="";
  if(own){
    var od=look(own.n);
    ownTxt = "<b>"+esc(own.n)+"()</b> 함수의 일부입니다 ("+own.a+"–"+own.b+"행)."+
      (od? ' <button type="button" class="jump" data-sym="'+own.n+'">이 함수 설명 보기</button>':"");
  }
  P("g", "선택한 "+(b-a+1)+"줄", curFile+"  "+a+" – "+b+"행",
    [["여기는 어디인가", ownTxt||"파일의 바깥쪽(설정·상수 영역)입니다."],
     ["이 범위에 나오는 이름", chips? "누르면 각각의 설명이 열립니다.<br>"+chips : "설명이 붙은 이름이 없습니다."],
     ["더 큰 흐름이 궁금하면", "왼쪽 <b>함수 · 클래스</b> 목록에서 <b>●</b> 표시가 붙은 항목을 누르면 그 구역 전체의 역할이 나옵니다."]],
    "", false, "");
  markRange(a,b);
}

function intro(){
  var n=(DB.regions[curFile]||[]).length;
  var cn=Object.keys(DB.conline[curFile]||{}).length;
  var hand=0, auto=0, m=DB.symf[curFile]||{};
  for(var k in m){ if(m[k].hand) hand++; else auto++; }
  P("g", curFile, curLines.length+" 줄  ·  설명 구역 "+n+"개  ·  모순 표시 "+cn+"줄",
    [["사용법",
      "<b>① 이름을 클릭</b> — 그 값이 무엇이고, 무엇을 오차로 재고, 어떻게 쓰이는지 나옵니다.<br><br>"+
      "<b>② 코드를 드래그</b> — 그 범위가 어떤 로직인지, 어떤 이름들이 쓰였는지 알려 줍니다.<br><br>"+
      "<b>③ 왼쪽 이름 찾기</b> — 낱말로 검색해 바로 그 줄로 갑니다.<br><br>"+
      "<b>④ ◆ 표시된 줄</b> — 코드끼리 어긋나는 지점입니다. 줄 번호를 누르면 설명이 열립니다."],
     ["표시 규칙",
      "<span class='id'>파란 실선</span> = 직접 쓴 해설 &nbsp;·&nbsp; "+
      "<span class='ida'>회색 점선</span> = 자동 분석 &nbsp;·&nbsp; "+
      "<span class='idb'>초록 점선</span> = 파이썬·ROS 기본 이름<br>"+
      "<b>●</b> = 설명이 있는 함수 &nbsp;·&nbsp; <b>◆</b> = 모순 지점 &nbsp;·&nbsp; <b>★</b> = 꼭 알아둘 점"],
     ["이 파일에 준비된 설명",
      "해설 "+hand+"개 · 자동 분석 "+auto+"개 · 어느 파일에서나 통하는 공통 용어 "+
      Object.keys(DB.sym).length+"개"]],
    "", false, "");
}

/* ── 드래그 선택 ── */
function lineOf(node){
  while(node && node!==codeEl){
    if(node.nodeType===1 && node.hasAttribute && node.hasAttribute("data-l"))
      return +node.getAttribute("data-l");
    node=node.parentNode;
  }
  return null;
}
document.addEventListener("mouseup", function(){
  var sel=window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
  if(!codeEl.contains(sel.anchorNode) || !codeEl.contains(sel.focusNode)) return;
  var a=lineOf(sel.anchorNode), b=lineOf(sel.focusNode);
  if(a===null||b===null) return;
  if(a>b){var t=a;a=b;b=t;}
  showRegion(a,b);
});

document.getElementById("mside").addEventListener("click",function(){
  sideEl.classList.toggle("open");
});
document.getElementById("mpanel").addEventListener("click",function(){
  panEl.classList.toggle("open");
});

buildSide();
openFile("driving.py");
})();
</script>

</body>
