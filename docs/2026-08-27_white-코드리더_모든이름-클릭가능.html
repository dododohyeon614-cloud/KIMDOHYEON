t = self.get_parameter('port').value\n        self.serial_baud = int(self.get_parameter('baud').value)\n\n        # ─── 상태 변수 ───\n        self.cmd_vel_ms   = 0.0\n        self.cmd_steer    = 0.0\n        self.state_enable = False\n\n        self.ser          = None\n        self.ser_lock     = threading.Lock()\n        self.rx_thread    = None\n        self.rx_running   = False\n\n        self.last_rx_time   = time.time()\n        self.connect_time   = 0.0          # 마지막 연결 성공 시각\n        self.last_warn_time = 0.0          # PID 주기 경고 throttle\n        self.last_watchdog_warn_time = 0.0 # RX watchdog 경고 throttle\n        self.last_tx_ok_time = 0.0         # 마지막 TX 성공 시각\n        self.reconnect_in_progress = False # 중복 재연결 방지\n        # ★ /cmd_vel_raw 신선도 워치독. 0.0 = 아직 한 번도 못 받음 → 정지 상태로 시작.\n        self.last_cmd_time     = 0.0\n        self.cmd_stale         = False     # 현재 워치독 발동 중인가(엣지 로그용)\n\n        # ─── 퍼블리셔 ───\n        self.pub_encoder = self.create_publisher(Int32, '/encoder', 10)\n        # [속도 상한 검증] 아두이노 속도PID 의 실제 PWM 출력. 'P,pwm' 프레임으로 수신.\n        #   목적: \"속도가 안 나는 게 PWM 포화 때문인가\"를 로스백으로 직접 확인한다.\n        #   (E 프레임은 건드리지 않음 — 기존 파싱/dt 진단 규약 그대로 유지)\n        self.pub_pwm = self.create_publisher(Int32, '/motor_pwm', 10)\n        # [FIX-5, 2026-07-30] A15 포텐셔미터 실측 조향각. 'A,angle' 프레임으로 수신.\n        #   목적: driving.py 의 clamped_steer(명령, 같은 deg 단위)와 직접 대조해\n        #   명령→실현 지연·비율을 추정이 아니라 측정으로 구한다(LFD 상향 재시도 때\n        #   지연 추정이 로스백마다 0.70~1.25s로 갈려 설계가 실측과 안 맞았던 문제).\n        self.pub_steer_angle = self.create_publisher(Int32, '/steer_angle_measured', 10)\n        # [FIX-6, 2026-07-30] 조향 PID 의 실제 PWM 출력. 'D,pwm' 프레임으로 수신.\n        #   목적: /steer_angle_measured 가 정상속도 주행 중에도 몇 초씩 안 움직이는\n        #   구간을 발견했는데(로스백 18_36_42, 82%), 이게 PID 가 PWM 을 안 내는 건지\n        #   PWM 은 나가는데 기구적으로 안 움직이는 건지 이걸로 구분한다.\n        self.pub_steer_pwm = self.create_publisher(Int32, '/steer_pwm', 10)\n\n        # ─── 서브스크라이버 ───\n        self.create_subscription(Twist, '/cmd_vel_raw',\n                                 self.cb_cmd_vel, 10)\n        self.create_subscription(Bool, '/control_state',\n                                 self.cb_state, 10)\n\n        # ─── 초기 연결 ───\n        self._connect_serial(self.serial_port, reset_board=True)\n\n        # ─── 타이머 ───\n        self.create_timer(CMD_TX_PERIOD, self.tx_loop)\n        self.create_timer(1.0, self.watchdog_check)\n\n        # ─── 시작 배너 ───\n        max_tick = int(round(MAX_SPEED_MS * ENC_DT *\n                             TICKS_PER_REV / WHEEL_CIRC))\n        max_real = max_tick * WHEEL_CIRC / TICKS_PER_REV / ENC_DT\n        self.get_logger().info(\n            '╔══════════════════════════════════════════════════╗')\n        self.get_logger().info(\n            '║  Motor Node 시작 [IDE-style reset]                ║')\n        self.get_logger().info(\n            '║  /cmd_vel_raw=m/s → Arduino tick/10ms             ║')\n        self.get_logger().info(\n            f'║  MAX_SPEED={MAX_SPEED_MS:.2f}m/s → ±{max_tick}틱 '\n            f'(≈±{max_real:.2f}m/s)')\n        self.get_logger().info(\n            f'║  MAX_STEER=±{MAX_STEER_DEG:.1f}°')\n        self.get_logger().info(\n            '╚══════════════════════════════════════════════════╝')\n\n    # ═══════════════════════════════════════════════════════════\n    #  시리얼 연결 / 재연결 - Arduino IDE 시리얼 모니터 방식 재현\n    # ═══════════════════════════════════════════════════════════\n    def _connect_serial(self, port, reset_board=False):\n        \"\"\"\n        시리얼 포트를 연다.\n\n        reset_board=True:\n          - 런치 직후 최초 연결용. DTR/RTS 펄스로 아두이노를 깨끗하게 리셋한다.\n\n        reset_board=False:\n          - 주행/매핑 중 복구용. DTR/RTS를 리셋 펄스로 흔들지 않는다.\n          - Arduino Mega는 포트 open/close 또는 DTR 변화만으로도 리셋될 수 있으므로\n            watchdog에서 이 경로를 최대한 사용하지 않는 것이 핵심이다.\n        \"\"\"\n        # 이전 연결 정리\n        self._close_serial()\n\n        try:\n            ser = serial.Serial()\n            ser.port     = port\n            ser.baudrate = self.serial_baud\n            ser.timeout  = SERIAL_TIMEOUT\n            # [2026-07-30] 이전 launch 가 완전히 안 죽고 남아 있으면(background 스레드가\n            #   blocking read 중이면 SIGINT 만으로는 안 죽는다) pyserial 은 기본적으로\n            #   같은 포트를 여러 프로세스가 동시에 여는 것을 막지 않는다. 그 상태로 두면\n            #   두 프로세스가 같은 UART 바이트를 나눠 받아 서로 다른 값을 파싱하고,\n            #   TX 도 두 프로세스가 동시에 쓸 수 있어 아두이노 쪽 명령 프레임이 깨질 수 있다.\n            #   (오늘 로스백에서 /motor_pwm 이 /encoder 의 2.83배로 찍힌 원인 — 아두이노\n            #   코드는 E/P 를 항상 1:1로 보내므로 수신측 중복이 확실했다.)\n            #   exclusive=True 로 열면 이미 열려 있는 포트는 open() 이 SerialException 을\n            #   던져 아래 except 절에서 바로 로그로 드러난다(조용히 중복되는 대신 실패).\n            ser.exclusive = True\n\n            if reset_board:\n                # 최초 실행 때만 IDE 시리얼 모니터 방식 리셋을 수행한다.\n                ser.dtr = True\n                ser.rts = True\n                ser.open()\n\n                ser.dtr = False\n                ser.rts = False\n                time.sleep(0.05)\n\n                ser.dtr = True\n                ser.rts = True\n\n                self.get_logger().info('⏳ Arduino 부팅 대기 중... (3.0s)')\n                time.sleep(3.0)\n            else:\n                # 주행 중 복구용 soft-open: 의도적인 LOW 펄스를 주지 않는다.\n                ser.dtr = True\n                ser.rts = True\n                ser.open()\n                time.sleep(0.2)\n\n            try:\n                ser.reset_input_buffer()\n                ser.reset_output_buffer()\n            except Exception:\n                pass\n\n            self.ser = ser\n            self.connect_time   = time.time()\n            self.last_rx_time   = time.time()\n\n            # RX 스레드 시작\n            self.rx_running = True\n            self.rx_thread = threading.Thread(\n                target=self.read_serial, daemon=True)\n            self.rx_thread.start()\n\n            self.get_logger().info(\n                f'✅ Arduino 연결: {port} @ {self.serial_baud}bps '\n                f'({\"hard-reset\" if reset_board else \"soft-open\"})')\n            return True\n\n        except serial.SerialException as e:\n            self.get_logger().error(\n                f'❌ Arduino 연결 실패: {e}')\n            self.ser = None\n            return False\n\n    def _close_serial(self):\n        \"\"\"기존 시리얼 자원 정리.\"\"\"\n        self.rx_running = False\n        if self.rx_thread is not None:\n            try:\n                self.rx_thread.join(timeout=0.5)\n            except Exception:\n                pass\n            self.rx_thread = None\n\n        if self.ser is not None:\n            try:\n                self.ser.close()\n            except Exception:\n                pass\n            self.ser = None\n\n    # ═══════════════════════════════════════════════════════════\n    #  RX 스레드 - 아두이노 → ROS\n    # ═══════════════════════════════════════════════════════════\n    def read_serial(self):\n        \"\"\"\n        아두이노로부터 \"E,d_val\\n\" 또는 \"E,d_val,dt_us\\n\" 수신.\n        d_val : 부호 있는 틱/10ms\n        dt_us : (선택) 실제 PID 주기 µs (DIAG_DT=1일 때만)\n        \"\"\"\n        buf = b''\n        while self.rx_running and self.ser is not None:\n            try:\n                data = self.ser.read(64)\n                if not data:\n                    continue\n                buf += data\n\n                # 줄 단위 처리\n                while b'\\n' in buf:\n                    line, buf = buf.split(b'\\n', 1)\n                    line = line.strip().decode('ascii', errors='ignore')\n                    if not line:\n                        continue\n\n                    parts = line.split(',')\n                    if len(parts) < 2:\n                        continue\n\n                    # [속도 상한 검증] 'P,pwm' — 아두이노 속도PID 의 실제 PWM 출력.\n                    #   E 프레임과 독립된 별도 프레임이라 기존 규약에 영향 없다.\n                    #   펌웨어가 아직 P 를 안 보내면 이 분기는 그냥 안 타므로 하위호환.\n                    if parts[0] == 'P':\n                        try:\n                            pwm_msg = Int32()\n                            pwm_msg.data = int(float(parts[1]))\n                            self.pub_pwm.publish(pwm_msg)\n                        except ValueError:\n                            pass\n                        continue\n\n                    # [FIX-5] 'A,angle' — A15 포텐셔미터 실측 조향각(deg).\n                    #   P 와 같은 독립 프레임 방식. 펌웨어가 아직 A 를 안 보내면\n                    #   이 분기는 안 타므로 하위호환.\n                    if parts[0] == 'A':\n                        try:\n                            angle_msg = Int32()\n                            angle_msg.data = int(float(parts[1]))\n                            self.pub_steer_angle.publish(angle_msg)\n                        except ValueError:\n                            pass\n                        continue\n\n                    # [FIX-6] 'D,pwm' — 조향PID 의 실제 PWM 출력. A 와 짝지어 보면\n                    #   기구 고착(D 큼·각도 안 변함) vs 전원/PID 미출력(D≈0) 을 가른다.\n                    if parts[0] == 'D':\n                        try:\n                            spwm_msg = Int32()\n                            spwm_msg.data = int(float(parts[1]))\n                            self.pub_steer_pwm.publish(spwm_msg)\n                        except ValueError:\n                            pass\n                        continue\n\n                    if parts[0] != 'E':\n                        continue\n\n                    # d_val 파싱\n                    try:\n                        d_val = int(float(parts[1]))\n                    except ValueError:\n                        continue\n\n                    # /encoder 퍼블리시\n                    msg = Int32()\n                    msg.data = d_val\n                    self.pub_encoder.publish(msg)\n                    self.last_rx_time = time.time()\n\n                    # dt_us 모니터링 (선택)\n                    if len(parts) >= 3:\n                        try:\n                            dt_us = int(float(parts[2]))\n                            self._check_arduino_dt(dt_us)\n                        except ValueError:\n                            pass\n\n            except (serial.SerialException, OSError) as e:\n                # 🔧 [복구 수정] 포트 자체가 죽은 하드 에러(USB 분리 등)일 때는\n                #   self.ser를 None으로 떨궈서 watchdog의 'ser is None → soft 재연결'\n                #   경로가 동작하게 한다. (단순 RX 침묵은 여기로 안 옴 → 기존 무리셋 정책 유지)\n                self.get_logger().warn(f'시리얼 RX 오류(포트 단절 추정): {e} → 재연결 대기')\n                self.ser = None\n                break\n            except Exception as e:\n                # 종료 경합(rx_thread 가 join 타임아웃 중 blocking read 에서 막 깨어나\n                # publish 하는 순간 메인스레드가 이미 rclpy.shutdown() 한 경우) 시엔\n                # get_logger().warn() 도 rosout publish 라 똑같이 실패해 줄이 배로\n                # 찍힌다. context 가 이미 죽었으면 로깅도 생략한다.\n                if rclpy.ok():\n                    self.get_logger().warn(f'RX 처리 예외: {e}')\n                continue\n\n    def _check_arduino_dt(self, dt_us):\n        \"\"\"아두이노 PID 주기가 기준에서 벗어나면 경고 (1Hz throttle).\"\"\"\n        diff = abs(dt_us - ARDUINO_PID_PERIOD_US)\n        if diff > ARDUINO_PID_TOLERANCE_US:\n            now = time.time()\n            if now - self.last_warn_time >= 1.0:\n                self.last_warn_time = now\n                self.get_logger().warn(\n                    f'⚠️ Arduino PID 주기 이상: {dt_us}µs '\n                    f'(기준 {ARDUINO_PID_PERIOD_US}µs '\n                    f'±{ARDUINO_PID_TOLERANCE_US}µs, 편차 {diff}µs)')\n\n    # ═══════════════════════════════════════════════════════════\n    #  ROS 콜백\n    # ═══════════════════════════════════════════════════════════\n    def cb_cmd_vel(self, msg: Twist):\n        # linear.x = m/s, angular.z = deg (driving.py 송신 규약)\n        v  = max(-MAX_SPEED_MS, min(MAX_SPEED_MS, msg.linear.x))\n        st = max(-MAX_STEER_DEG, min(MAX_STEER_DEG, msg.angular.z))\n        self.cmd_vel_ms = v\n        self.cmd_steer  = st\n        self.last_cmd_time = time.time()\n        if self.cmd_stale:\n            self.cmd_stale = False\n            self.get_logger().info('✅ /cmd_vel_raw 수신 재개 → 속도명령 복구')\n\n    def cb_state(self, msg: Bool):\n        new_state = bool(msg.data)\n        if new_state != self.state_enable:\n            self.state_enable = new_state\n            self._tx_state()\n\n    # ═══════════════════════════════════════════════════════════\n    #  TX 루프 - ROS → 아두이노\n    # ═══════════════════════════════════════════════════════════\n    def tx_loop(self):\n        if self.ser is None:\n            return\n\n        # ★ [2026-07-31] 명령 신선도 워치독 — 상류(driving)가 죽었는데 마지막 속도로\n        #   계속 달리는 것을 막는다. 래치를 비워 복귀 시에도 옛 값이 안 살아나게 한다.\n        #   조향은 그대로 둔다(주행 중 갑자기 직진으로 트는 게 더 위험).\n        if (time.time() - self.last_cmd_time) > CMD_TIMEOUT:\n            if not self.cmd_stale:\n                self.cmd_stale = True\n                self.get_logger().error(\n                    f'🚨 /cmd_vel_raw {CMD_TIMEOUT:.1f}s 이상 두절 → 속도 0 강제. '\n                    f'driving 노드 생존 확인 필요(조향은 마지막 값 유지)')\n            self.cmd_vel_ms = 0.0\n\n        # m/s → tick/10ms 변환\n        # tick = v * DT * TICKS_PER_REV / WHEEL_CIRC\n        v = self.cmd_vel_ms\n        tick_f = v * ENC_DT * TICKS_PER_REV / WHEEL_CIRC\n        if v > 0 and tick_f < 1.0:\n            tick = 1\n        elif v < 0 and tick_f > -1.0:\n            tick = -1\n        else:\n            tick = int(round(tick_f))\n\n        steer = int(round(self.cmd_steer))\n        steer = max(-int(MAX_STEER_DEG), min(int(MAX_STEER_DEG), steer))\n\n        line = f'C,{tick},{steer}\\n'\n        try:\n            with self.ser_lock:\n                self.ser.write(line.encode('ascii'))\n                self.last_tx_ok_time = time.time()\n        except (serial.SerialException, OSError) as e:\n            self.get_logger().warn(f'시리얼 TX 오류: {e}')\n\n    def _tx_state(self):\n        if self.ser is None:\n            return\n        line = f'S,{1 if self.state_enable else 0}\\n'\n        try:\n            with self.ser_lock:\n                self.ser.write(line.encode('ascii'))\n            self.last_tx_ok_time = time.time()\n            self.get_logger().info(\n                f'📡 아두이노 State: S,{1 if self.state_enable else 0}  '\n                f'cmd={self.cmd_vel_ms:.2f}m/s')\n        except (serial.SerialException, OSError) as e:\n            self.get_logger().warn(f'State TX 오류: {e}')\n\n    # ═══════════════════════════════════════════════════════════\n    #  Watchdog - 통신 단절 감지 & 자동 재연결\n    # ═══════════════════════════════════════════════════════════\n    def watchdog_check(self):\n        \"\"\"\n        RX watchdog.\n\n        기존 문제:\n          - Arduino가 E,d_val을 보내지 않거나 Python이 E 라인을 못 받으면\n            last_rx_time이 갱신되지 않는다.\n          - 기존 코드는 silence > 3초가 되면 _connect_serial()을 호출했다.\n          - BOOT_GRACE_PERIOD 8초 뒤 첫 watchdog에서 silence 약 8.8초가 되어\n            DTR 리셋 → Arduino 재부팅 → 차량 순간 정지가 반복됐다.\n\n        수정:\n          - RX가 조용하다는 이유만으로 주행 중 포트를 리셋하지 않는다.\n          - 3초 초과는 경고 + 현재 state 재전송만 한다.\n          - 실제 포트 객체가 없거나, 매우 장시간 RX가 없고 RESET_ON_RX_TIMEOUT=True일 때만 재연결한다.\n        \"\"\"\n        now = time.time()\n\n        if now - self.connect_time < BOOT_GRACE_PERIOD:\n            return\n\n        if self.ser is None:\n            if self.reconnect_in_progress:\n                return\n            self.get_logger().warn('🔄 시리얼 객체 없음 → soft 재연결 시도')\n            self.reconnect_in_progress = True\n            try:\n                self._connect_serial(self.serial_port, reset_board=False)\n            finally:\n                self.reconnect_in_progress = False\n            return\n\n        silence = now - self.last_rx_time\n        if silence <= WATCHDOG_TIMEOUT:\n            return\n\n        if now - self.last_watchdog_warn_time >= WATCHDOG_WARN_PERIOD:\n            self.last_watchdog_warn_time = now\n            self.get_logger().warn(\n                f'⚠️ Arduino RX 무응답 {silence:.1f}s: 포트 리셋 안 함 '\n                f'(매핑/컨트롤러 주행 중 DTR 리셋 방지)')\n            self.get_logger().warn(\n                '   확인 필요: Arduino가 Serial.println(\"E,...\")를 계속 보내는지, '\n                'USB 케이블/전원/공통 GND/Serial Monitor 중복 연결 여부')\n\n            try:\n                self._tx_state()\n            except Exception:\n                pass\n\n        if RESET_ON_RX_TIMEOUT and silence > HARD_RECONNECT_TIMEOUT:\n            if self.reconnect_in_progress:\n                return\n            self.get_logger().error(\n                f'⚠️ Arduino RX 장시간 무응답 {silence:.1f}s → soft 재연결 시도')\n            self.reconnect_in_progress = True\n            try:\n                self._connect_serial(self.serial_port, reset_board=False)\n            finally:\n                self.reconnect_in_progress = False\n\n    # ═══════════════════════════════════════════════════════════\n    #  종료 처리\n    # ═══════════════════════════════════════════════════════════\n    def destroy_node(self):\n        try:\n            # 안전 정지 명령 전송\n            if self.ser is not None:\n                with self.ser_lock:\n                    self.ser.write(b'C,0,0\\n')\n                    self.ser.write(b'S,0\\n')\n                    time.sleep(0.05)\n        except Exception:\n            pass\n        self._close_serial()\n        super().destroy_node()\n\n\n# ═══════════════════════════════════════════════════════════════\n#  main\n# ═══════════════════════════════════════════════════════════════\ndef main(args=None):\n    rclpy.init(args=args)\n    node = MotorNode()\n    try:\n        rclpy.spin(node)\n    except KeyboardInterrupt:\n        pass\n    finally:\n        node.destroy_node()\n        if rclpy.ok():\n            rclpy.shutdown()\n\n\nif __name__ == '__main__':\n    main()", "iahrs.py": "#!/usr/bin/env python3\nimport rclpy\nfrom rclpy.node import Node\n\nfrom sensor_msgs.msg import Imu\nfrom geometry_msgs.msg import TransformStamped\n\nimport tf2_ros\nimport serial\nimport time\nimport math\n\n# 🌟 외부 라이브러리(transforms3d) 의존성 제거! 자체 수학 연산 적용\ndef euler_to_quaternion(roll, pitch, yaw):\n    cy = math.cos(yaw * 0.5)\n    sy = math.sin(yaw * 0.5)\n    cp = math.cos(pitch * 0.5)\n    sp = math.sin(pitch * 0.5)\n    cr = math.cos(roll * 0.5)\n    sr = math.sin(roll * 0.5)\n\n    w = cr * cp * cy + sr * sp * sy\n    x = sr * cp * cy - cr * sp * sy\n    y = cr * sp * cy + sr * cp * sy\n    z = cr * cp * sy - sr * sp * cy\n    return w, x, y, z\n\nclass IahrsDriver(Node):\n    CONF_SYNC_LIN_ACC = 0x0004\n    CONF_SYNC_ANG_VEL = 0x0008\n    CONF_SYNC_EULER = 0x0040\n\n    def __init__(self):\n        super().__init__(\"iahrs_driver_node\")\n\n        # 🔧 BUG1 수정: get_parameter_or()는 rclpy에 없음 → declare_parameter + .value 사용\n        self.declare_parameter(\"tf_prefix\", \"\")\n        self.declare_parameter(\"send_tf\", True)\n        # 🔧 BUG5 수정: 포트 하드코딩 제거 → 런치파일에서 주입 가능\n        self.declare_parameter(\"port\", \"/dev/ttyUSB0\")\n        self.declare_parameter(\"baud\", 115200)\n        # [v6.7 연동] IMU 출력주기[ms]. 기본 50ms=20Hz(기존과 동일).\n        #   driving.py의 지연보상 예측 정밀도를 높이려면 20ms(50Hz) 권장:\n        #   런치/CLI: --ros-args -p sync_period_ms:=20\n        self.declare_parameter(\"sync_period_ms\", 50)\n\n        self._tf_prefix   = self.get_parameter(\"tf_prefix\").value\n        self._is_send_tf  = self.get_parameter(\"send_tf\").value\n        self.sync_period_ms = int(self.get_parameter(\"sync_period_ms\").value)\n\n        self._br = tf2_ros.TransformBroadcaster(self)\n\n        self.port_name = self.get_parameter(\"port\").value\n        self.baud_rate = self.get_parameter(\"baud\").value\n\n        self._msg = Imu()\n\n        # 공분산 설정\n        self._msg.linear_acceleration_covariance[0] = 0.0064\n        self._msg.linear_acceleration_covariance[4] = 0.0063\n        self._msg.linear_acceleration_covariance[8] = 0.0064\n\n        self._msg.angular_velocity_covariance[0] = 0.032 * (math.pi / 180.0)\n        self._msg.angular_velocity_covariance[4] = 0.028 * (math.pi / 180.0)\n        self._msg.angular_velocity_covariance[8] = 0.006 * (math.pi / 180.0)\n\n        self._msg.orientation_covariance[0] = 0.013 * (math.pi / 180.0)\n        self._msg.orientation_covariance[4] = 0.011 * (math.pi / 180.0)\n        self._msg.orientation_covariance[8] = 0.006 * (math.pi / 180.0)\n\n        self._imu_pub_handler = self.create_publisher(Imu, \"imu/data\", 10)\n\n        # 🔧 [크래시 방지] 포트를 못 열어도 노드가 죽지 않게 try로 감싸고,\n        #   실패 시 2초마다 재연결을 시도한다. (IMU가 늦게 인식되거나 잠깐 빠져도 복구)\n        self._ser = None\n        self._reconnect_timer = None\n        if not self._try_open_port():\n            self._reconnect_timer = self.create_timer(2.0, self._reconnect_cb)\n\n        self.timer = self.create_timer(0.01, self._serial_timer)\n\n    def _try_open_port(self):\n        try:\n            # 🌟 타임아웃(0.05초)을 설정하여 노드 무한 프리징 방지!\n            ser = serial.Serial(self.port_name, self.baud_rate, timeout=0.05)\n            ser.flushInput()\n            ser.reset_input_buffer()\n            ser.reset_output_buffer()\n            self._ser = ser\n            self._reset_sensor()\n            self.get_logger().info(f\"✅ iAHRS 포트 연결: {self.port_name} @ {self.baud_rate}\")\n            return True\n        except Exception as e:\n            self._ser = None\n            self.get_logger().error(\n                f\"⚠️ iAHRS 포트 열기 실패({self.port_name}): {e} → 2초 후 재시도\")\n            return False\n\n    def _reconnect_cb(self):\n        if self._ser is not None and self._ser.is_open:\n            # 이미 연결됨 → 재연결 타이머 정리\n            self._reconnect_timer.cancel()\n            self._reconnect_timer = None\n            return\n        if self._try_open_port():\n            self._reconnect_timer.cancel()\n            self._reconnect_timer = None\n\n    def _set_sync_port(self):\n        self._write_port_timeout(\"so=1\")\n\n    def _set_sync_period(self, period):\n        self._write_port_timeout(\"sp={0}\".format(period))\n\n    def _set_sync_data(self, sync_data_type):\n        sync_conf = \"{:X}\".format(sync_data_type)\n        self._write_port_timeout(\"sd=0x\" + sync_conf)\n\n    def _is_port_available(self):\n        # 🌟 에러를 뿜던 isOpen() 대신 최신 규격인 is_open 사용\n        # 🔧 포트 미연결(None) 시에도 안전하게 False 반환\n        return self._ser is not None and self._ser.is_open\n\n    def _serial_timer(self):\n        if self._is_port_available():\n            try:\n                line = self._ser.readline()\n                if not line:\n                    return # 타임아웃 시 안전하게 리턴\n                \n                # errors='ignore'를 추가하여 깨진 바이트가 들어와도 죽지 않게 보호\n                sync_data = line.split(b\"\\r\\n\")[0].decode(\"utf-8\", errors='ignore').strip()\n                \n                if sync_data and len(sync_data.split(\"=\")) == 1:\n                    sync_data_splitted = sync_data.split(\",\")\n\n                    if len(sync_data_splitted) == 9:\n                        data = list(map(float, sync_data_splitted))\n\n                        self._msg.linear_acceleration.x = data[0] * 9.80665\n                        self._msg.linear_acceleration.y = data[1] * 9.80665\n                        self._msg.linear_acceleration.z = data[2] * 9.80665\n\n                        self._msg.angular_velocity.x = data[3] * (math.pi / 180.0)\n                        self._msg.angular_velocity.y = data[4] * (math.pi / 180.0)\n                        self._msg.angular_velocity.z = data[5] * (math.pi / 180.0)\n\n                        # 자체 함수로 안전하게 쿼터니언 변환\n                        w, x, y, z = euler_to_quaternion(\n                            data[6] * (math.pi / 180.0), \n                            data[7] * (math.pi / 180.0), \n                            data[8] * (math.pi / 180.0)\n                        )\n                        \n                        self._msg.orientation.w = w\n                        self._msg.orientation.x = x\n                        self._msg.orientation.y = y\n                        self._msg.orientation.z = z\n\n                        self._msg.header.stamp = self.get_clock().now().to_msg()\n                        self._msg.header.frame_id = (self._tf_prefix + \"/imu_link\").lstrip(\"/\")\n\n                        self._imu_pub_handler.publish(self._msg)\n                        if self._is_send_tf:\n                            self._send_tf()\n                            \n            except (serial.SerialException, OSError) as e:\n                # 🔧 [복구] 포트 자체가 죽은 경우: 포트를 닫고 재연결 타이머를 다시 띄운다.\n                self.get_logger().error(f\"⚠️ iAHRS 포트 단절: {e} → 재연결 시도\")\n                try:\n                    if self._ser is not None:\n                        self._ser.close()\n                except Exception:\n                    pass\n                self._ser = None\n                if self._reconnect_timer is None:\n                    self._reconnect_timer = self.create_timer(2.0, self._reconnect_cb)\n            except Exception as e:\n                # 데이터 파싱/디코드 노이즈는 기존처럼 무시 (포트는 정상)\n                self.get_logger().warn(f\"데이터 파싱 무시됨 (정상적인 노이즈): {e}\")\n\n    def _write_port(self, buffer):\n        if self._is_port_available():\n            self._ser.write((buffer + \"\\n\").encode())\n\n    def _write_port_timeout(self, buffer, timeout=0.5):\n        self._write_port(buffer)\n        started_time = time.time()\n        while True:\n            if self._is_port_available():\n                line = self._ser.readline()\n                if line:\n                    data = line.split(b\"\\r\\n\")[0].decode(\"utf-8\", errors='ignore').strip()\n                    if data and data == buffer:\n                        break\n            else:\n                raise Exception(\"USB_NOT_CONNECTED\")\n            \n            if time.time() - started_time >= timeout:\n                break\n        return True\n\n    def _send_tf(self):\n        t = TransformStamped()\n        t.header.stamp = self.get_clock().now().to_msg()\n        t.header.frame_id = (self._tf_prefix + \"/base_link\").lstrip(\"/\")\n        t.child_frame_id = (self._tf_prefix + \"/imu_link\").lstrip(\"/\")\n\n        t.transform.rotation.x = self._msg.orientation.x\n        t.transform.rotation.y = self._msg.orientation.y\n        t.transform.rotation.z = self._msg.orientation.z\n        t.transform.rotation.w = self._msg.orientation.w\n\n        self._br.sendTransform(t)\n\n    def _reset_sensor(self):\n        self.get_logger().info(\"Initializing iAHRS in Relative 6-DOF Mode for RViz2...\")\n        self._set_sync_port()\n        self._set_sync_period(self.sync_period_ms)   # [v6.7 연동] 기본 50ms=20Hz, 권장 20ms=50Hz\n        self._set_sync_data(\n            self.CONF_SYNC_LIN_ACC | self.CONF_SYNC_ANG_VEL | self.CONF_SYNC_EULER\n        )\n\ndef main(args=None):\n    rclpy.init(args=args)\n    iahrs_driver_node = IahrsDriver()\n    try:\n        rclpy.spin(iahrs_driver_node)\n    except KeyboardInterrupt:\n        pass\n    finally:\n        iahrs_driver_node.destroy_node()\n        if rclpy.ok():\n            rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()", "mapping.py": "#!/usr/bin/env python3\n\"\"\"\nmapping.py ― 경로 매핑 노드 [자동 리모델링 포함]\n\n기능\n1. /ego_state를 5Hz로 CSV 저장\n2. direction 컬럼 유지 (+1 전진 / -1 후진)\n3. 매핑 종료 시 원본 route_YYYYMMDD_HHMMSS.csv 저장\n4. 곧바로 route_YYYYMMDD_HHMMSS_remodeled.csv 자동 생성\n\n주의\n- route_remodeler.py를 같은 white 패키지 폴더에 같이 넣어야 자동 리모델링 import가 됩니다.\n- 자동 리모델링 실패 시에도 원본 CSV는 그대로 남습니다.\n\"\"\"\n\nimport os\nimport csv\nimport threading\nfrom datetime import datetime\n\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float64MultiArray, Bool\nfrom geometry_msgs.msg import Twist\n\n# 패키지 설치 후 실행 / 로컬 단독 실행 둘 다 대응\ntry:\n    from white.route_remodeler import remodel_route\nexcept Exception:\n    try:\n        from route_remodeler import remodel_route\n    except Exception:\n        remodel_route = None\n\n\nclass MappingNode(Node):\n    def __init__(self):\n        super().__init__(\"mapping_node\")\n        # ★ driving.py / prompt.py / route_remodeler.py / tool의 분석툴과 반드시\n        #   같은 폴더를 가리킬 것. 예전 워크스페이스 경로(~/white_ws0709b)가 남아\n        #   있었는데, 아래 makedirs가 이미 없어진 그 폴더를 조용히 다시 만들어서\n        #   매핑한 route가 유령 폴더로 들어가고 분석툴에선 안 보였다(2026-07-15).\n        self.data_dir = os.path.expanduser(\"~/white_ws/white_ws/gps_data\")\n        os.makedirs(self.data_dir, exist_ok=True)\n\n        self.is_mapping = False\n        self.csv_file = None\n        self.csv_writer = None\n        self.current_csv_path = None\n        self._flush_counter = 0          # 🔧 BUG8: 주기적 flush 카운터\n        self._remodel_thread = None      # 🔧 BUG9: 비동기 리모델링 스레드\n\n        # 자동 리모델링 기본값\n        self.auto_remodel_enabled = True\n        self.remodel_spacing = 0.25      # waypoint 간격 [m]\n        self.remodel_epsilon = 0.08      # 직선 smoothing 최대 이동 [m]\n        self.remodel_smooth_iter = 1     # 직선 smoothing 반복 횟수\n\n        # ego_state\n        self.lat = None\n        self.lon = None\n        self.heading = 0.0\n        self.speed = 0.0\n        self.steer = 0.0\n        self.pitch = 0.0\n        self.terrain = 0.0\n\n        # cmd_vel_raw.linear.x 부호 기반 주행 방향\n        self.direction = 1\n\n        self._total_rows = 0     # 전체 기록 행 수\n\n        self.create_subscription(Float64MultiArray, \"/ego_state\", self.cb_ego, 10)\n        self.create_subscription(Bool, \"/mapping_cmd\", self.cb_mapping_cmd, 10)\n        self.create_subscription(Twist, \"/cmd_vel_raw\", self.cb_cmd_vel, 10)\n\n        self.create_timer(0.2, self.record_loop)  # 5Hz 기록\n        self.get_logger().info(\n            f\"🗺️ Mapping node 시작 | auto_remodel={self.auto_remodel_enabled} | \"\n            f\"spacing={self.remodel_spacing}m epsilon={self.remodel_epsilon}m smooth={self.remodel_smooth_iter}\"\n        )\n\n    def cb_cmd_vel(self, msg: Twist):\n        \"\"\"[보조] cmd_vel_raw.linear.x 부호. 자율주행 중 매핑 시에만 발행됨.\n        리모컨 매핑 때는 발행되지 않으므로 cb_ego의 속도 부호가 주 신호다.\"\"\"\n        v = msg.linear.x\n        if v > 0.05:\n            self.direction = 1\n        elif v < -0.05:\n            self.direction = -1\n        # 0 부근이면 이전 방향 유지\n\n    def cb_ego(self, msg: Float64MultiArray):\n        d = msg.data\n        if len(d) >= 7:\n            self.lat = d[0]\n            self.lon = d[1]\n            self.heading = d[4]\n            self.speed = d[5]\n            self.steer = d[6]\n            # 🔧 [v2] 주행방향을 ego 속도(엔코더 부호 반영) 기준으로 직접 추적.\n            #   리모컨 수동 매핑 때는 /cmd_vel_raw가 없으므로 이 신호가 주(主) 신호.\n            #   gps_imu가 발행하는 d[5]는 후진 시 음수가 된다(current_speed_dir 반영).\n            if self.speed > 0.05:\n                self.direction = 1\n            elif self.speed < -0.05:\n                self.direction = -1\n            # 0 부근이면 이전 방향 유지(정지·미세속도 구간)\n        if len(d) >= 9:\n            self.pitch = d[7]\n            self.terrain = d[8]\n\n    def cb_mapping_cmd(self, msg: Bool):\n        if msg.data and not self.is_mapping:\n            self.start_mapping()\n        elif not msg.data and self.is_mapping:\n            self.stop_mapping()\n\n    def start_mapping(self):\n        fname = os.path.join(\n            self.data_dir,\n            f\"route_{datetime.now().strftime('%Y%m%d_%H%M%S')}.csv\",\n        )\n        self.current_csv_path = fname\n        self.csv_file = open(fname, \"w\", newline=\"\", encoding=\"utf-8\")\n        self.csv_writer = csv.writer(self.csv_file)\n        self.csv_writer.writerow([\n            \"latitude\", \"longitude\", \"heading\", \"speed\", \"steer\",\n            \"direction\", \"pitch\", \"terrain\",\n        ])\n        self.is_mapping = True\n        self._total_rows = 0\n        self.get_logger().info(f\"🗺️ 매핑 시작: {fname}\")\n\n    def stop_mapping(self):\n        self.is_mapping = False\n        saved_path = self.current_csv_path\n\n        if self.csv_file:\n            self.csv_file.flush()\n            self.csv_file.close()\n            self.csv_file = None\n            self.csv_writer = None\n\n        self.get_logger().info(\n            f\"✅ 매핑 종료 및 원본 저장 완료: {saved_path} ({self._total_rows}행)\")\n\n        if self.auto_remodel_enabled and saved_path:\n            self.run_auto_remodel(saved_path)\n\n    def run_auto_remodel(self, input_csv: str):\n        if remodel_route is None:\n            self.get_logger().error(\n                \"❌ route_remodeler.py를 import하지 못했습니다. \"\n                \"white/route_remodeler.py 파일이 같은 패키지에 있는지 확인하세요.\"\n            )\n            return\n\n        # 🔧 BUG9: 리모델링을 백그라운드 스레드에서 실행 → ROS2 콜백 블로킹 방지\n        def _worker():\n            try:\n                self.get_logger().info(\"🔧 매핑 경로 자동 리모델링 시작 (백그라운드)...\")\n                out_csv = remodel_route(\n                    input_csv=input_csv,\n                    output_csv=None,\n                    spacing=self.remodel_spacing,\n                    epsilon=self.remodel_epsilon,\n                    smooth_iter=self.remodel_smooth_iter,\n                )\n                self.get_logger().info(f\"✅ 리모델링 경로 저장 완료: {out_csv}\")\n                self.get_logger().info(\"🚗 자율주행에서는 *_remodeled.csv 파일을 선택하면 됩니다.\")\n            except Exception as e:\n                self.get_logger().error(f\"❌ 자동 리모델링 실패: {e}\")\n                self.get_logger().warn(\"원본 매핑 CSV는 정상 저장되어 있으므로 원본으로 주행하거나 수동 리모델링하세요.\")\n\n        self._remodel_thread = threading.Thread(target=_worker, daemon=True)\n        self._remodel_thread.start()\n\n    def record_loop(self):\n        if self.is_mapping and self.lat is not None and self.csv_writer is not None:\n            self._total_rows += 1\n            self.csv_writer.writerow([\n                f\"{self.lat:.8f}\",\n                f\"{self.lon:.8f}\",\n                f\"{self.heading:.2f}\",\n                f\"{self.speed:.4f}\",\n                f\"{self.steer:.2f}\",\n                str(self.direction),\n                f\"{self.pitch:.2f}\",\n                f\"{self.terrain:.1f}\",\n            ])\n            # 🔧 BUG8: 매 10행(2초)마다 flush → 크래시 시 데이터 유실 방지\n            self._flush_counter += 1\n            if self._flush_counter >= 10:\n                self.csv_file.flush()\n                self._flush_counter = 0\n\n\ndef main(args=None):\n    rclpy.init(args=args)\n    node = MappingNode()\n    try:\n        rclpy.spin(node)\n    except KeyboardInterrupt:\n        pass\n    finally:\n        if node.is_mapping:\n            node.stop_mapping()\n        node.destroy_node()\n        if rclpy.ok():\n            rclpy.shutdown()\n\n\nif __name__ == \"__main__\":\n    main()", "route_remodeler.py": "#!/usr/bin/env python3\n\"\"\"\nroute_remodeler.py - smart line/corner remodeling version\n\n매핑 CSV 경로를 자율주행용으로 자동 리모델링한다.\n\n핵심 변경점\n1. 원본 GPS 지그재그를 그대로 등간격화하지 않고, RDP로 경로의 큰 골격을 먼저 추출한다.\n2. 직선으로 판단되는 구간은 waypoint를 회귀선/골격선 위에 정확히 정렬한다.\n3. 코너는 직선과 직선 사이를 cubic Bezier 필렛으로 둥글게 연결한다.\n4. 마지막에는 driving.py가 읽는 CSV 컬럼 그대로 저장한다.\n\n주의\n- 너무 좁은 코스에서 코너를 과하게 깎지 않도록 코너 반경은 보수적으로 제한한다.\n- 기존 mapping.py의 remodel_route(input_csv, output_csv, spacing, epsilon, smooth_iter) 호출 방식과 호환된다.\n\"\"\"\n\nimport argparse\nimport csv\nimport glob\nimport math\nimport os\nfrom typing import Dict, List, Tuple, Optional\n\nEARTH_R = 6378137.0\nPoint = Tuple[float, float]\n\n\n# ═══════════════════════════════════════════════════════════════════════\n# 기본 유틸\n# ═══════════════════════════════════════════════════════════════════════\ndef find_latest_route(data_dir: str) -> Optional[str]:\n    pattern = os.path.join(os.path.expanduser(data_dir), \"route_*.csv\")\n    candidates = [\n        p for p in glob.glob(pattern)\n        if os.path.isfile(p) and not os.path.basename(p).endswith(\"_remodeled.csv\")\n    ]\n    if not candidates:\n        return None\n    candidates.sort(key=os.path.getmtime, reverse=True)\n    return candidates[0]\n\n\ndef latlon_to_xy(lat: float, lon: float, lat0: float, lon0: float) -> Point:\n    x = EARTH_R * math.radians(lon - lon0) * math.cos(math.radians(lat0))\n    y = EARTH_R * math.radians(lat - lat0)\n    return x, y\n\n\ndef xy_to_latlon(x: float, y: float, lat0: float, lon0: float) -> Tuple[float, float]:\n    lat = lat0 + math.degrees(y / EARTH_R)\n    lon = lon0 + math.degrees(x / (EARTH_R * math.cos(math.radians(lat0))))\n    return lat, lon\n\n\ndef dist(a: Point, b: Point) -> float:\n    return math.hypot(a[0] - b[0], a[1] - b[1])\n\n\ndef add(a: Point, b: Point) -> Point:\n    return (a[0] + b[0], a[1] + b[1])\n\n\ndef sub(a: Point, b: Point) -> Point:\n    return (a[0] - b[0], a[1] - b[1])\n\n\ndef mul(a: Point, k: float) -> Point:\n    return (a[0] * k, a[1] * k)\n\n\ndef dot(a: Point, b: Point) -> float:\n    return a[0] * b[0] + a[1] * b[1]\n\n\ndef norm(a: Point) -> float:\n    return math.hypot(a[0], a[1])\n\n\ndef unit(a: Point) -> Point:\n    n = norm(a)\n    if n < 1e-9:\n        return (0.0, 0.0)\n    return (a[0] / n, a[1] / n)\n\n\ndef normalize_angle(deg: float) -> float:\n    while deg > 180.0:\n        deg -= 360.0\n    while deg < -180.0:\n        deg += 360.0\n    return deg\n\n\ndef cumulative_distance(points: List[Point]) -> List[float]:\n    if not points:\n        return []\n    s = [0.0]\n    for i in range(1, len(points)):\n        s.append(s[-1] + dist(points[i - 1], points[i]))\n    return s\n\n\ndef heading_deg(points: List[Point], i: int) -> float:\n    if len(points) <= 1:\n        return 0.0\n    # 최종 경로의 heading은 너무 짧은 이웃이 아니라 2~3포인트 앞뒤 평균으로 계산한다.\n    j0 = max(0, i - 2)\n    j1 = min(len(points) - 1, i + 2)\n    if j0 == j1:\n        j0 = max(0, i - 1)\n        j1 = min(len(points) - 1, i + 1)\n    p0, p1 = points[j0], points[j1]\n    return normalize_angle(math.degrees(math.atan2(p1[1] - p0[1], p1[0] - p0[0])))\n\n\ndef point_line_distance(p: Point, a: Point, b: Point) -> float:\n    vx, vy = b[0] - a[0], b[1] - a[1]\n    den = math.hypot(vx, vy)\n    if den < 1e-9:\n        return dist(p, a)\n    return abs(vx * (a[1] - p[1]) - (a[0] - p[0]) * vy) / den\n\n\ndef project_point_to_line(p: Point, a: Point, b: Point) -> Point:\n    ab = sub(b, a)\n    den = dot(ab, ab)\n    if den < 1e-9:\n        return a\n    t = dot(sub(p, a), ab) / den\n    return add(a, mul(ab, t))\n\n\n# ═══════════════════════════════════════════════════════════════════════\n# CSV 읽기 / 중복 제거\n# ═══════════════════════════════════════════════════════════════════════\ndef read_route_csv(path: str) -> List[Dict[str, str]]:\n    with open(os.path.expanduser(path), \"r\", newline=\"\", encoding=\"utf-8\") as f:\n        reader = csv.DictReader(f)\n        rows = list(reader)\n        fieldnames = reader.fieldnames or []\n    if not rows:\n        raise ValueError(\"CSV에 waypoint가 없습니다.\")\n    if \"latitude\" not in fieldnames or \"longitude\" not in fieldnames:\n        raise ValueError(\"CSV에 latitude, longitude 컬럼이 필요합니다.\")\n    return rows\n\n\ndef remove_duplicate_points_with_rows(rows: List[Dict[str, str]], points: List[Point], min_dist_m: float = 0.05):\n    if not points:\n        return [], []\n    out_rows = [rows[0]]\n    out_pts = [points[0]]\n    last = points[0]\n    for r, p in zip(rows[1:], points[1:]):\n        if dist(last, p) >= min_dist_m:\n            out_rows.append(r)\n            out_pts.append(p)\n            last = p\n    if dist(out_pts[-1], points[-1]) > 1e-6:\n        out_rows.append(rows[-1])\n        out_pts.append(points[-1])\n    return out_rows, out_pts\n\n\n# ═══════════════════════════════════════════════════════════════════════\n# 리샘플링 / 보간\n# ═══════════════════════════════════════════════════════════════════════\ndef resample_by_spacing(points: List[Point], spacing: float) -> List[Point]:\n    if len(points) <= 1:\n        return points[:]\n    spacing = max(0.05, float(spacing))\n    s = cumulative_distance(points)\n    total = s[-1]\n    if total <= 1e-9:\n        return [points[0]]\n\n    targets = [0.0]\n    x = spacing\n    while x < total:\n        targets.append(x)\n        x += spacing\n    if total - targets[-1] > spacing * 0.35:\n        targets.append(total)\n    else:\n        targets[-1] = total\n\n    out: List[Point] = []\n    seg = 0\n    for ts in targets:\n        while seg < len(s) - 2 and s[seg + 1] < ts:\n            seg += 1\n        s0, s1 = s[seg], s[seg + 1]\n        p0, p1 = points[seg], points[seg + 1]\n        if s1 - s0 <= 1e-9:\n            out.append(p0)\n        else:\n            u = (ts - s0) / (s1 - s0)\n            out.append((p0[0] + u * (p1[0] - p0[0]), p0[1] + u * (p1[1] - p0[1])))\n    return out\n\n\ndef interp_numeric(rows: List[Dict[str, str]], original_s: List[float], target_s: float, key: str, default: float = 0.0) -> float:\n    if not rows or not original_s:\n        return default\n    total = original_s[-1]\n    if total <= 1e-9:\n        try:\n            return float(rows[0].get(key, default))\n        except ValueError:\n            return default\n    target_s = max(0.0, min(total, target_s))\n    idx = 0\n    while idx < len(original_s) - 2 and original_s[idx + 1] < target_s:\n        idx += 1\n    try:\n        v0 = float(rows[idx].get(key, default))\n        v1 = float(rows[idx + 1].get(key, default))\n    except (ValueError, IndexError):\n        return default\n    s0, s1 = original_s[idx], original_s[min(idx + 1, len(original_s) - 1)]\n    if s1 - s0 <= 1e-9:\n        return v0\n    u = (target_s - s0) / (s1 - s0)\n    return v0 + u * (v1 - v0)\n\n\ndef nearest_direction(rows: List[Dict[str, str]], original_s: List[float], target_s: float) -> int:\n    if not rows or not original_s:\n        return 1\n    idx = min(range(len(original_s)), key=lambda i: abs(original_s[i] - target_s))\n    try:\n        return int(float(rows[idx].get(\"direction\", 1)))\n    except (ValueError, IndexError):\n        return 1\n\n\n# ═══════════════════════════════════════════════════════════════════════\n# 경로 골격 추출: RDP\n# ═══════════════════════════════════════════════════════════════════════\ndef rdp_indices(points: List[Point], epsilon: float) -> List[int]:\n    \"\"\"Ramer-Douglas-Peucker. 직선 구간은 양끝점만 남기고, 코너 골격점은 보존한다.\"\"\"\n    n = len(points)\n    if n <= 2:\n        return list(range(n))\n\n    keep = {0, n - 1}\n\n    def _rdp(start: int, end: int):\n        if end <= start + 1:\n            return\n        a, b = points[start], points[end]\n        max_d = -1.0\n        max_i = start\n        for i in range(start + 1, end):\n            d = point_line_distance(points[i], a, b)\n            if d > max_d:\n                max_d = d\n                max_i = i\n        if max_d > epsilon:\n            keep.add(max_i)\n            _rdp(start, max_i)\n            _rdp(max_i, end)\n\n    _rdp(0, n - 1)\n    return sorted(keep)\n\n\ndef remove_near_collinear_keypoints(points: List[Point], angle_thresh_deg: float = 5.0, min_seg_len: float = 0.30) -> List[Point]:\n    if len(points) <= 2:\n        return points[:]\n    out = [points[0]]\n    for i in range(1, len(points) - 1):\n        a, b, c = out[-1], points[i], points[i + 1]\n        v1 = unit(sub(b, a))\n        v2 = unit(sub(c, b))\n        if norm(v1) < 1e-9 or norm(v2) < 1e-9:\n            continue\n        ang = math.degrees(math.acos(max(-1.0, min(1.0, dot(v1, v2)))))\n        if ang < angle_thresh_deg and dist(a, b) < min_seg_len:\n            continue\n        if ang < angle_thresh_deg:\n            # 거의 직선이면 중간 골격점을 제거해서 긴 직선 한 줄로 만든다.\n            continue\n        out.append(b)\n    out.append(points[-1])\n    return out\n\n\n# ═══════════════════════════════════════════════════════════════════════\n# 직선화 / 코너 라운딩\n# ═══════════════════════════════════════════════════════════════════════\ndef bezier_point(p0: Point, p1: Point, p2: Point, p3: Point, t: float) -> Point:\n    u = 1.0 - t\n    return (\n        u ** 3 * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t ** 3 * p3[0],\n        u ** 3 * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t ** 3 * p3[1],\n    )\n\n\ndef sample_line(a: Point, b: Point, spacing: float) -> List[Point]:\n    length = dist(a, b)\n    if length < 1e-9:\n        return [a]\n    n = max(1, int(math.ceil(length / max(0.05, spacing))))\n    return [(a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n) for i in range(n)]\n\n\ndef sample_bezier(p0: Point, p1: Point, p2: Point, p3: Point, spacing: float) -> List[Point]:\n    chord = dist(p0, p3)\n    ctrl = dist(p0, p1) + dist(p1, p2) + dist(p2, p3)\n    approx_len = max(chord, 0.5 * (chord + ctrl))\n    n = max(3, int(math.ceil(approx_len / max(0.05, spacing))))\n    return [bezier_point(p0, p1, p2, p3, i / n) for i in range(n)]\n\n\ndef build_smart_path(\n    original_xy: List[Point],\n    spacing: float = 0.25,\n    epsilon: float = 0.08,\n    smooth_iter: int = 1,\n    straight_angle_deg: float = 7.0,\n    corner_start_angle_deg: float = 9.0,\n    vehicle_min_radius_m: float = 1.90,   # 차량 물리 최소 선회반경 = L/tan(21°) (L=0.73). 경로는 이보다 더 조이면 추종 불가.\n    corner_radius_margin: float = 1.30,   # 위 한계에 곱하는 안전 여유 → 목표 호반경(약 2.47m).\n    max_corner_radius_m: float = 6.0,     # 완만한 코너를 과도하게 부풀리지 않도록 호반경 상한.\n    vehicle_width_m: float = 0.775,       # [0713] 실측 차폭. 경로(=뒷차축 중심선) 안쪽으로\n                                           #   차체가 반폭만큼 파고들므로, 코너 목표반경의\n                                           #   물리적 하한(=vehicle_min_radius_m + width/2)으로 사용.\n) -> Tuple[List[Point], Dict[str, float]]:\n    \"\"\"\n    1) 등간격 예비 샘플링\n    2) RDP로 큰 골격 추출\n    3) 골격 직선은 정확한 선분으로, 코너는 Bezier 필렛으로 연결\n    \"\"\"\n    if len(original_xy) <= 2:\n        return original_xy[:], {\"skeleton_points\": len(original_xy), \"corners\": 0, \"straight_segments\": max(0, len(original_xy) - 1)}\n\n    spacing = max(0.08, spacing)\n\n    # 예비 샘플링으로 입력 점 간격을 안정화한다.\n    pre_spacing = max(0.12, min(spacing, 0.20))\n    pre = resample_by_spacing(original_xy, pre_spacing)\n\n    # RDP 허용오차: mapping.py에서 epsilon=0.08을 줘도 긴 직선이 한 줄로 잡히도록 내부 기준을 살짝 키운다.\n    # 너무 크게 잡으면 코너를 깎으므로 0.12~0.35m 범위로 제한한다.\n    rdp_eps = max(0.12, min(0.35, epsilon * 2.2))\n    idxs = rdp_indices(pre, rdp_eps)\n    skeleton = [pre[i] for i in idxs]\n    skeleton = remove_near_collinear_keypoints(skeleton, angle_thresh_deg=straight_angle_deg, min_seg_len=spacing * 2.0)\n\n    if len(skeleton) <= 2:\n        final_line = resample_by_spacing([skeleton[0], skeleton[-1]], spacing)\n        return final_line, {\"skeleton_points\": len(skeleton), \"corners\": 0, \"straight_segments\": 1}\n\n    # corner fillet를 생성한다. 직선 구간은 골격 선분 그대로 사용된다.\n    rounded: List[Point] = []\n    last_anchor = skeleton[0]\n    corner_count = 0\n    straight_count = 0\n\n    for i in range(1, len(skeleton) - 1):\n        a, b, c = skeleton[i - 1], skeleton[i], skeleton[i + 1]\n        len_in = dist(a, b)\n        len_out = dist(b, c)\n        if len_in < 1e-6 or len_out < 1e-6:\n            continue\n\n        u_in = unit(sub(b, a))     # a -> b\n        u_out = unit(sub(c, b))    # b -> c\n        turn_angle = math.degrees(math.acos(max(-1.0, min(1.0, dot(u_in, u_out)))))\n\n        if turn_angle < corner_start_angle_deg:\n            # 거의 직선이면 b를 무시하고 다음 골격점까지 직선으로 이어지게 둔다.\n            continue\n\n        # ── 코너 반경 결정 (차량 선회한계 기반, 기하학적으로 올바른 방식) ───────────\n        # 여기서 변수 radius는 '코너 꼭짓점 b에서 각 다리를 따라 뒤로 물린 셋백 거리'다.\n        # 셋백 t 와 실제 필렛 호반경 R 의 관계:  t = R · tan(θ/2)   (θ=편향각, 직선=0)\n        #   → R = t / tan(θ/2).  같은 셋백이면 코너가 급할수록(θ↑) 호반경이 더 작아진다.\n        # 따라서 \"급한 코너일수록 셋백을 더 크게\" 줘야 호반경이 차량 최소반경 위로 유지된다.\n        # (기존 로직은 급할수록 반경을 줄여서, 차가 못 도는 0.35~0.66m 코너를 만들고 있었음.)\n        # [0713] 차폭 반영: 차체는 경로(뒷차축 중심선) 안쪽으로 반폭(width/2)만큼 파고드므로,\n        #   목표호반경이 '차량 최소선회반경+반폭'보다 작아지면 코너 안쪽에서 차체 여유가 없어진다.\n        #   기존 margin(1.30배)이 이미 이 하한보다 크면(현재 2.47m > 2.29m) 동작 변화 없음 —\n        #   margin을 나중에 줄이더라도 이 물리적 하한 아래로는 절대 안 좁아지게 하는 안전장치.\n        min_radius_with_width = vehicle_min_radius_m + vehicle_width_m / 2.0\n        target_radius = max(vehicle_min_radius_m * corner_radius_margin, min_radius_with_width)\n        target_radius = min(target_radius, max_corner_radius_m)\n        half = 0.5 * math.radians(turn_angle)\n        tan_half = math.tan(min(half, math.radians(80.0)))             # 과도한 급각에서 폭주 방지\n        setback_needed = target_radius * tan_half                       # 목표 호반경을 내려면 필요한 셋백\n        # 세그먼트가 허용하는 셋백 상한. 셋백은 인접 코너와 다리를 나눠 쓰므로 0.45배로 제한.\n        geom_cap = min(len_in, len_out) * 0.45\n        radius = min(setback_needed, geom_cap)\n        # 차량 최소반경(여유 없이) 자체를 못 내는 셋백으로는 깎지 않는다. 단 세그먼트가 그조차\n        # 허용 못 하면(=골격이 물리적으로 너무 빡빡) 줄 수 있는 최대(geom_cap)까지만 best-effort.\n        radius = max(radius, min(vehicle_min_radius_m * tan_half, geom_cap))\n\n        if radius < spacing * 1.2:\n            # 너무 짧은 코너는 필렛을 넣지 않고 골격점만 통과한다.\n            line_pts = sample_line(last_anchor, b, spacing)\n            if rounded and line_pts and dist(rounded[-1], line_pts[0]) < 1e-6:\n                line_pts = line_pts[1:]\n            rounded.extend(line_pts)\n            last_anchor = b\n            continue\n\n        p_in = sub(b, mul(u_in, radius))\n        p_out = add(b, mul(u_out, radius))\n\n        # 직선부 추가\n        line_pts = sample_line(last_anchor, p_in, spacing)\n        if rounded and line_pts and dist(rounded[-1], line_pts[0]) < 1e-6:\n            line_pts = line_pts[1:]\n        rounded.extend(line_pts)\n        straight_count += 1\n\n        # Bezier 코너 추가. k가 너무 크면 overshoot, 너무 작으면 각짐.\n        k = 0.55\n        c1 = add(p_in, mul(u_in, radius * k))\n        c2 = sub(p_out, mul(u_out, radius * k))\n        curve_pts = sample_bezier(p_in, c1, c2, p_out, spacing)\n        if rounded and curve_pts and dist(rounded[-1], curve_pts[0]) < 1e-6:\n            curve_pts = curve_pts[1:]\n        rounded.extend(curve_pts)\n        last_anchor = p_out\n        corner_count += 1\n\n    # 마지막 직선부 추가\n    tail_pts = sample_line(last_anchor, skeleton[-1], spacing)\n    if rounded and tail_pts and dist(rounded[-1], tail_pts[0]) < 1e-6:\n        tail_pts = tail_pts[1:]\n    rounded.extend(tail_pts)\n\n    if not rounded or dist(rounded[-1], skeleton[-1]) > 1e-6:\n        rounded.append(skeleton[-1])\n\n    # 최종 등간격화. 이 단계에서는 형태를 다시 평균내지 않는다.\n    remodeled = resample_by_spacing(rounded, spacing)\n\n    # 옵션 smooth_iter는 코너를 깎는 이동평균이 아니라, 최종 heading 급변만 줄이는 아주 약한 Laplacian으로 사용한다.\n    # 직선은 이미 완전 직선이고, 코너는 Bezier라서 기본값 1~2면 충분하다.\n    if smooth_iter > 0 and len(remodeled) > 5:\n        max_shift = max(0.02, min(0.06, epsilon * 0.6))\n        for _ in range(min(2, smooth_iter)):\n            new_pts = remodeled[:]\n            for j in range(2, len(remodeled) - 2):\n                # 골격 직선성을 해치지 않도록 아주 약하게만 적용\n                avg = (\n                    (remodeled[j - 1][0] + remodeled[j][0] + remodeled[j + 1][0]) / 3.0,\n                    (remodeled[j - 1][1] + remodeled[j][1] + remodeled[j + 1][1]) / 3.0,\n                )\n                nx = remodeled[j][0] * 0.82 + avg[0] * 0.18\n                ny = remodeled[j][1] * 0.82 + avg[1] * 0.18\n                shift = math.hypot(nx - remodeled[j][0], ny - remodeled[j][1])\n                if shift > max_shift:\n                    sc = max_shift / shift\n                    nx = remodeled[j][0] + (nx - remodeled[j][0]) * sc\n                    ny = remodeled[j][1] + (ny - remodeled[j][1]) * sc\n                new_pts[j] = (nx, ny)\n            remodeled = new_pts\n\n    stats = {\n        \"skeleton_points\": float(len(skeleton)),\n        \"corners\": float(corner_count),\n        \"straight_segments\": float(max(1, straight_count + 1)),\n        \"rdp_epsilon_m\": float(rdp_eps),\n        \"vehicle_width_m\": float(vehicle_width_m),\n        \"min_radius_with_width_m\": float(vehicle_min_radius_m + vehicle_width_m / 2.0),\n    }\n    return remodeled, stats\n\n\n# ═══════════════════════════════════════════════════════════════════════\n# 메인 리모델링 함수: mapping.py와 호환\n# ═══════════════════════════════════════════════════════════════════════\ndef _route_directions(rows_raw: List[Dict[str, str]]) -> List[int]:\n    dirs = []\n    for r in rows_raw:\n        try:\n            dirs.append(1 if int(float(r.get(\"direction\", 1))) >= 0 else -1)\n        except (ValueError, TypeError):\n            dirs.append(1)\n    return dirs\n\n\ndef remodel_route(\n    input_csv: str,\n    output_csv: Optional[str] = None,\n    spacing: float = 0.25,\n    epsilon: float = 0.08,\n    smooth_iter: int = 1,\n) -> str:\n    \"\"\"방향 게이트 디스패처.\n\n    - 단일 방향(전진 전용 등) 경로: 기존 로직(_remodel_route_single)을 그대로 사용 →\n      출력이 기존과 100% 동일하다(현재 잘 되는 주행 경로는 변화 없음).\n    - 전진/후진이 섞인 경로: 방향이 같은 구간(run)별로 따로 리모델링한 뒤 이어붙인다.\n      이렇게 하면 전진↔후진 반전점(cusp)을 U턴으로 둥글게 깎지 않고 보존하며,\n      direction 라벨도 구간별로 정확히 유지된다.\n    \"\"\"\n    rows_raw = read_route_csv(input_csv)\n    dirs = _route_directions(rows_raw)\n    mixed = any(d >= 0 for d in dirs) and any(d < 0 for d in dirs)\n\n    if not mixed:\n        return _remodel_route_single(input_csv, rows_raw, output_csv, spacing, epsilon, smooth_iter)\n    return _remodel_route_segmented(input_csv, rows_raw, dirs, output_csv, spacing, epsilon, smooth_iter)\n\n\ndef _remodel_route_single(\n    input_csv: str,\n    rows_raw: List[Dict[str, str]],\n    output_csv: Optional[str],\n    spacing: float,\n    epsilon: float,\n    smooth_iter: int,\n) -> str:\n    # ── (기존 remodel_route 본문 그대로) ────────────────────────────────────\n    lat0 = float(rows_raw[0][\"latitude\"])\n    lon0 = float(rows_raw[0][\"longitude\"])\n    xy_raw = [latlon_to_xy(float(r[\"latitude\"]), float(r[\"longitude\"]), lat0, lon0) for r in rows_raw]\n\n    rows, original_xy = remove_duplicate_points_with_rows(rows_raw, xy_raw, min_dist_m=0.05)\n    original_s = cumulative_distance(original_xy)\n    original_len = original_s[-1] if original_s else 0.0\n\n    remodeled_xy, stats = build_smart_path(\n        original_xy,\n        spacing=spacing,\n        epsilon=epsilon,\n        smooth_iter=smooth_iter,\n    )\n    remodeled_s = cumulative_distance(remodeled_xy)\n    remodeled_len = remodeled_s[-1] if remodeled_s else 0.0\n\n    if output_csv is None:\n        root, _ = os.path.splitext(os.path.expanduser(input_csv))\n        output_csv = root + \"_remodeled.csv\"\n\n    fieldnames = [\"latitude\", \"longitude\", \"heading\", \"speed\", \"steer\", \"direction\", \"pitch\", \"terrain\"]\n\n    out_rows = []\n    for i, p in enumerate(remodeled_xy):\n        progress = 0.0 if remodeled_len <= 1e-9 else remodeled_s[i] / remodeled_len\n        src_s = progress * original_len\n        lat, lon = xy_to_latlon(p[0], p[1], lat0, lon0)\n        h = heading_deg(remodeled_xy, i)\n        row_out = {\n            \"latitude\":  f\"{lat:.8f}\",\n            \"longitude\": f\"{lon:.8f}\",\n            \"heading\":   f\"{h:.2f}\",\n            \"speed\":     f\"{interp_numeric(rows, original_s, src_s, 'speed',  0.0):.4f}\",\n            \"steer\":     f\"{interp_numeric(rows, original_s, src_s, 'steer',  0.0):.2f}\",\n            \"direction\": str(nearest_direction(rows, original_s, src_s)),\n            \"pitch\":     f\"{interp_numeric(rows, original_s, src_s, 'pitch',  0.0):.2f}\",\n            \"terrain\":   f\"{interp_numeric(rows, original_s, src_s, 'terrain',0.0):.1f}\",\n        }\n        out_rows.append(row_out)\n\n    os.makedirs(os.path.dirname(os.path.abspath(output_csv)), exist_ok=True)\n    with open(output_csv, \"w\", newline=\"\", encoding=\"utf-8\") as f:\n        writer = csv.DictWriter(f, fieldnames=fieldnames)\n        writer.writeheader()\n        writer.writerows(out_rows)\n\n    report_path = os.path.splitext(output_csv)[0] + \"_report.txt\"\n    with open(report_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"Smart route remodel report\\n\")\n        f.write(\"==========================\\n\")\n        f.write(f\"input_csv: {os.path.abspath(os.path.expanduser(input_csv))}\\n\")\n        f.write(f\"output_csv: {os.path.abspath(output_csv)}\\n\")\n        f.write(f\"original_points: {len(rows_raw)}\\n\")\n        f.write(f\"dedup_points: {len(rows)}\\n\")\n        f.write(f\"remodeled_points: {len(remodeled_xy)}\\n\")\n        f.write(f\"original_length_m: {original_len:.3f}\\n\")\n        f.write(f\"remodeled_length_m: {remodeled_len:.3f}\\n\")\n        f.write(f\"spacing_m: {spacing:.3f}\\n\")\n        f.write(f\"input_epsilon_m: {epsilon:.3f}\\n\")\n        f.write(f\"rdp_epsilon_m: {stats.get('rdp_epsilon_m', 0.0):.3f}\\n\")\n        f.write(f\"skeleton_points: {int(stats.get('skeleton_points', 0))}\\n\")\n        f.write(f\"straight_segments: {int(stats.get('straight_segments', 0))}\\n\")\n        f.write(f\"rounded_corners: {int(stats.get('corners', 0))}\\n\")\n        f.write(f\"vehicle_width_m: {stats.get('vehicle_width_m', 0.0):.3f}\\n\")\n        f.write(f\"min_corner_radius_with_width_m: {stats.get('min_radius_with_width_m', 0.0):.3f}\\n\")\n        f.write(\"straight_model: exact skeleton line\\n\")\n        f.write(\"corner_model: cubic Bezier fillet\\n\")\n        f.write(\"corner_cutting: limited conservative fillet\\n\")\n\n    print(\"✅ 스마트 경로 리모델링 완료\")\n    print(f\"입력 파일: {os.path.abspath(os.path.expanduser(input_csv))}\")\n    print(f\"출력 파일: {os.path.abspath(output_csv)}\")\n    print(f\"리포트: {os.path.abspath(report_path)}\")\n    print(f\"포인트 수: {len(rows_raw)} → {len(remodeled_xy)}\")\n    print(f\"경로 길이: {original_len:.2f}m → {remodeled_len:.2f}m\")\n    print(f\"골격점: {int(stats.get('skeleton_points', 0))}, 직선: {int(stats.get('straight_segments', 0))}, 코너: {int(stats.get('corners', 0))}\")\n    print(f\"간격: {spacing:.2f}m, RDP eps: {stats.get('rdp_epsilon_m', 0.0):.2f}m\")\n    return output_csv\n\n\ndef _remodel_route_segmented(\n    input_csv: str,\n    rows_raw: List[Dict[str, str]],\n    dirs: List[int],\n    output_csv: Optional[str],\n    spacing: float,\n    epsilon: float,\n    smooth_iter: int,\n) -> str:\n    \"\"\"전진/후진이 섞인 경로: 방향이 같은 연속 구간(run)별로 리모델링 후 이어붙임.\n\n    반전점(cusp)을 필렛으로 깎지 않고 보존한다. 각 출력점의 direction은 해당 run의\n    방향으로 강제하며, heading은 마지막에 전체 경로 기준으로 다시 계산한다.\n    \"\"\"\n    lat0 = float(rows_raw[0][\"latitude\"])\n    lon0 = float(rows_raw[0][\"longitude\"])\n\n    # 방향이 같은 연속 구간으로 분할\n    runs = []  # (run_rows, run_dir)\n    start = 0\n    for i in range(1, len(rows_raw) + 1):\n        if i == len(rows_raw) or dirs[i] != dirs[start]:\n            runs.append((rows_raw[start:i], dirs[start]))\n            start = i\n\n    out_rows: List[Dict[str, str]] = []\n    remodeled_all: List[Point] = []\n    total_corners = 0\n    total_straight = 0\n    total_skeleton = 0\n    rdp_eps_used = 0.0\n    original_len_sum = 0.0\n    stats: Dict[str, float] = {}   # run이 전부 <3점이면 루프에서 안 채워질 수 있어 기본값 필요\n\n    for run_rows, run_dir in runs:\n        # 너무 짧은 run(1~2점)은 깎지 않고 원본 점을 그대로 통과시킨다.\n        if len(run_rows) < 3:\n            for r in run_rows:\n                x, y = latlon_to_xy(float(r[\"latitude\"]), float(r[\"longitude\"]), lat0, lon0)\n                remodeled_all.append((x, y))\n                row_out = {\n                    \"latitude\":  f\"{xy_to_latlon(x, y, lat0, lon0)[0]:.8f}\",\n                    \"longitude\": f\"{xy_to_latlon(x, y, lat0, lon0)[1]:.8f}\",\n                    \"heading\":   \"0.00\",\n                    \"speed\":     f\"{float(r.get('speed', 0.0) or 0.0):.4f}\" if _is_num(r.get('speed')) else \"0.0000\",\n                    \"steer\":     f\"{float(r.get('steer', 0.0) or 0.0):.2f}\" if _is_num(r.get('steer')) else \"0.00\",\n                    \"direction\": str(run_dir),\n                    \"pitch\":     f\"{float(r.get('pitch', 0.0) or 0.0):.2f}\" if _is_num(r.get('pitch')) else \"0.00\",\n                    \"terrain\":   f\"{float(r.get('terrain', 0.0) or 0.0):.1f}\" if _is_num(r.get('terrain')) else \"0.0\",\n                }\n                out_rows.append(row_out)\n            continue\n\n        xy_raw = [latlon_to_xy(float(r[\"latitude\"]), float(r[\"longitude\"]), lat0, lon0) for r in run_rows]\n        rows_d, orig_xy = remove_duplicate_points_with_rows(run_rows, xy_raw, min_dist_m=0.05)\n        orig_s = cumulative_distance(orig_xy)\n        orig_len = orig_s[-1] if orig_s else 0.0\n        original_len_sum += orig_len\n\n        rem_xy, stats = build_smart_path(orig_xy, spacing=spacing, epsilon=epsilon, smooth_iter=smooth_iter)\n        rem_s = cumulative_distance(rem_xy)\n        rem_len = rem_s[-1] if rem_s else 0.0\n\n        total_corners += int(stats.get(\"corners\", 0))\n        total_straight += int(stats.get(\"straight_segments\", 0))\n        total_skeleton += int(stats.get(\"skeleton_points\", 0))\n        rdp_eps_used = stats.get(\"rdp_epsilon_m\", rdp_eps_used)\n\n        for j, p in enumerate(rem_xy):\n            progress = 0.0 if rem_len <= 1e-9 else rem_s[j] / rem_len\n            src_s = progress * orig_len\n            lat, lon = xy_to_latlon(p[0], p[1], lat0, lon0)\n            remodeled_all.append(p)\n            row_out = {\n                \"latitude\":  f\"{lat:.8f}\",\n                \"longitude\": f\"{lon:.8f}\",\n                \"heading\":   \"0.00\",  # 아래에서 전체 경로 기준으로 채움\n                \"speed\":     f\"{interp_numeric(rows_d, orig_s, src_s, 'speed',  0.0):.4f}\",\n                \"steer\":     f\"{interp_numeric(rows_d, orig_s, src_s, 'steer',  0.0):.2f}\",\n                \"direction\": str(run_dir),  # ★ run 방향 강제(라벨 뭉개짐 방지)\n                \"pitch\":     f\"{interp_numeric(rows_d, orig_s, src_s, 'pitch',  0.0):.2f}\",\n                \"terrain\":   f\"{interp_numeric(rows_d, orig_s, src_s, 'terrain',0.0):.1f}\",\n            }\n            out_rows.append(row_out)\n\n    # heading은 이어붙인 전체 경로 기준으로 계산(기존과 동일한 방식)\n    for i in range(len(out_rows)):\n        out_rows[i][\"heading\"] = f\"{heading_deg(remodeled_all, i):.2f}\"\n\n    remodeled_s = cumulative_distance(remodeled_all)\n    remodeled_len = remodeled_s[-1] if remodeled_s else 0.0\n\n    if output_csv is None:\n        root, _ = os.path.splitext(os.path.expanduser(input_csv))\n        output_csv = root + \"_remodeled.csv\"\n\n    fieldnames = [\"latitude\", \"longitude\", \"heading\", \"speed\", \"steer\", \"direction\", \"pitch\", \"terrain\"]\n    os.makedirs(os.path.dirname(os.path.abspath(output_csv)), exist_ok=True)\n    with open(output_csv, \"w\", newline=\"\", encoding=\"utf-8\") as f:\n        writer = csv.DictWriter(f, fieldnames=fieldnames)\n        writer.writeheader()\n        writer.writerows(out_rows)\n\n    report_path = os.path.splitext(output_csv)[0] + \"_report.txt\"\n    with open(report_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"Smart route remodel report [segmented by direction]\\n\")\n        f.write(\"===================================================\\n\")\n        f.write(f\"input_csv: {os.path.abspath(os.path.expanduser(input_csv))}\\n\")\n        f.write(f\"output_csv: {os.path.abspath(output_csv)}\\n\")\n        f.write(f\"original_points: {len(rows_raw)}\\n\")\n        f.write(f\"direction_runs: {len(runs)}\\n\")\n        f.write(f\"remodeled_points: {len(remodeled_all)}\\n\")\n        f.write(f\"original_length_m(sum): {original_len_sum:.3f}\\n\")\n        f.write(f\"remodeled_length_m: {remodeled_len:.3f}\\n\")\n        f.write(f\"spacing_m: {spacing:.3f}\\n\")\n        f.write(f\"input_epsilon_m: {epsilon:.3f}\\n\")\n        f.write(f\"rdp_epsilon_m: {rdp_eps_used:.3f}\\n\")\n        f.write(f\"skeleton_points(sum): {total_skeleton}\\n\")\n        f.write(f\"straight_segments(sum): {total_straight}\\n\")\n        f.write(f\"rounded_corners(sum): {total_corners}\\n\")\n        f.write(f\"vehicle_width_m: {stats.get('vehicle_width_m', 0.0):.3f}\\n\")\n        f.write(f\"min_corner_radius_with_width_m: {stats.get('min_radius_with_width_m', 0.0):.3f}\\n\")\n        f.write(\"straight_model: exact skeleton line\\n\")\n        f.write(\"corner_model: cubic Bezier fillet (per direction-run)\\n\")\n        f.write(\"cusp_handling: forward<->reverse reversal preserved (not filleted)\\n\")\n\n    print(\"✅ 스마트 경로 리모델링 완료 [방향 구간 분리]\")\n    print(f\"입력 파일: {os.path.abspath(os.path.expanduser(input_csv))}\")\n    print(f\"출력 파일: {os.path.abspath(output_csv)}\")\n    print(f\"리포트: {os.path.abspath(report_path)}\")\n    print(f\"방향 구간(run): {len(runs)}개\")\n    print(f\"포인트 수: {len(rows_raw)} → {len(remodeled_all)}\")\n    print(f\"경로 길이(합): {original_len_sum:.2f}m → {remodeled_len:.2f}m\")\n    print(f\"골격점합: {total_skeleton}, 직선합: {total_straight}, 코너합: {total_corners}\")\n    return output_csv\n\n\ndef _is_num(v) -> bool:\n    try:\n        float(v)\n        return True\n    except (TypeError, ValueError):\n        return False\n\n\n# ═══════════════════════════════════════════════════════════════════════\n# CLI\n# ═══════════════════════════════════════════════════════════════════════\ndef main():\n    parser = argparse.ArgumentParser(description=\"GPS waypoint CSV 스마트 리모델링 도구\")\n    parser.add_argument(\"--input\", \"-i\", help=\"입력 route CSV 경로\")\n    parser.add_argument(\"--output\", \"-o\", help=\"출력 CSV 경로\")\n    parser.add_argument(\"--latest\", action=\"store_true\", help=\"~/white_ws/white_ws/gps_data 안의 최신 route_*.csv 자동 선택\")\n    parser.add_argument(\"--data-dir\", default=\"~/white_ws/white_ws/gps_data\", help=\"route CSV 폴더\")\n    parser.add_argument(\"--spacing\", type=float, default=0.25, help=\"출력 waypoint 간격[m]\")\n    parser.add_argument(\"--epsilon\", type=float, default=0.10, help=\"직선/코너 골격 추출 허용오차[m]\")\n    parser.add_argument(\"--smooth\", type=int, default=1, help=\"최종 heading 완화 반복 횟수\")\n    args = parser.parse_args()\n\n    input_csv = args.input\n    if args.latest or not input_csv:\n        input_csv = find_latest_route(args.data_dir)\n        if input_csv is None:\n            raise FileNotFoundError(f\"{os.path.expanduser(args.data_dir)} 안에 route_*.csv 파일이 없습니다.\")\n\n    remodel_route(input_csv, output_csv=args.output, spacing=args.spacing, epsilon=args.epsilon, smooth_iter=args.smooth)\n\n\nif __name__ == \"__main__\":\n    main()", "prompt.py": "#!/usr/bin/env python3\n\"\"\"\nprompt.py - 사용자 명령 인터페이스 노드\n기능: 매핑, 주행, 저장된 맵 목록 확인, 프로그램 종료\n\n[2026-07-31] 융합 비교주행 노브(GPS 단독 / IMU 단독) 제거 — gps_imu 의 fusion_mode\n  프리셋 자체가 없어져 전환할 대상이 없다.\n[2026-08-05] LFD-PID 스케줄 검증 실험 노브(메뉴 5) 제거 — 데이터 수집이 끝나\n  더 이상 필요 없다. driving_node 의 exp_mode 파라미터도 함께 삭제됐다.\n\"\"\"\n\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import String, Bool\nimport threading\nimport time\nimport os\nimport sys\n\n\nclass PromptNode(Node):\n    def __init__(self):\n        super().__init__('prompt_node')\n        self.map_pub = self.create_publisher(Bool, '/mapping_cmd', 10)\n        self.drive_pub = self.create_publisher(String, '/drive_cmd', 10)\n        self.state_pub = self.create_publisher(Bool, '/control_state', 10)\n        # mapping.py가 저장하는 폴더와 동일해야 한다(주석 참조).\n        self.data_dir = os.path.expanduser(\"~/white_ws/white_ws/gps_data\")\n        # 🔧 BUG7 수정: 워커스레드에서 메인루프 종료 신호를 전달하는 이벤트\n        self._shutdown_event = threading.Event()\n\n    def get_input(self):\n        print(\"\\n=============================\")\n        print(\" 1. 매핑 시작 (Enter로 종료/저장)\")\n        print(\" 2. 경로 주행 시작 (Enter로 정지)\")\n        print(\" 3. 저장된 경로 목록 확인\")\n        print(\" 4. 터미널 종료 (Exit)\")\n        print(\"=============================\")\n        return input(\"메뉴 선택 (1/2/3/4): \").strip()\n\n    def list_routes(self):\n        if not os.path.exists(self.data_dir):\n            print(f\"⚠️ {self.data_dir} 폴더가 없습니다.\")\n            return []\n        \n        files = sorted([f for f in os.listdir(self.data_dir) if f.endswith('.csv')])\n        if not files:\n            print(\"⚠️ 저장된 경로(.csv) 파일이 없습니다.\")\n            return []\n        \n        print(\"\\n📂 [저장된 경로 파일 목록]\")\n        for i, f in enumerate(files):\n            print(f\" {i+1}. {f}\")\n        return files\n\n    # ── 경로 주행 흐름 (메뉴 '2') ────────────────────────────────────────\n    def _drive_flow(self):\n        files = self.list_routes()\n        if not files:\n            return\n\n        try:\n            f_idx = int(input(\"\\n주행할 파일 번호: \")) - 1\n            if 0 <= f_idx < len(files):\n                target_file = files[f_idx]\n\n                # 🌟 [수정 포인트 2] 주행 시작 시 모터 제어 권한(True) 부여\n                self.state_pub.publish(Bool(data=True))\n                self.drive_pub.publish(String(data=target_file))\n                print(f\"\\n🚀 자율주행 시작: {target_file}\")\n\n                input(\"🛑 주행을 긴급 정지하려면 [Enter] 키를 누르세요...\\n\")\n\n                # 🌟 [수정 포인트 3] 긴급 정지 시 모터 제어 권한(False) 즉각 박탈\n                self.state_pub.publish(Bool(data=False))\n                self.drive_pub.publish(String(data=\"STOP\"))\n                print(\"🛑 긴급 정지 명령 및 모터 차단 완료!\")\n            else:\n                print(\"⚠️ 잘못된 번호입니다.\")\n        except ValueError:\n            print(\"⚠️ 숫자를 입력하세요.\")\n\n    def run(self):\n        while rclpy.ok():\n            choice = self.get_input()\n\n            if choice == '1':\n                print(\"\\n🗺️ 매핑을 시작합니다...\")\n                self.map_pub.publish(Bool(data=True))\n                input(\"🛑 매핑을 종료하고 저장하려면 [Enter] 키를 누르세요...\\n\")\n                self.map_pub.publish(Bool(data=False))\n                print(\"✅ 매핑 종료 및 저장 완료!\")\n\n            elif choice == '2':\n                self._drive_flow()\n\n            elif choice == '3':\n                self.list_routes()\n\n            elif choice == '4':\n                print(\"\\n👋 터미널을 종료합니다.\")\n                # 🔧 BUG7 수정: 워커스레드에서 직접 rclpy.shutdown()+sys.exit() 호출하면\n                # spin() 중인 메인스레드와 충돌 → 이벤트로 신호만 보내고 메인이 처리\n                self._shutdown_event.set()\n                return\n\n            else:\n                print(\"⚠️ 1~5 사이의 숫자를 입력해주세요.\")\n\ndef main(args=None):\n    rclpy.init(args=args)\n    node = PromptNode()\n    \n    thread = threading.Thread(target=node.run, daemon=True)\n    thread.start()\n\n    try:\n        # 🔧 BUG7 수정: spin 대신 주기적으로 shutdown_event를 확인하며 spin_once\n        while rclpy.ok() and not node._shutdown_event.is_set():\n            rclpy.spin_once(node, timeout_sec=0.1)\n    except KeyboardInterrupt:\n        pass\n    finally:\n        node.state_pub.publish(Bool(data=False))\n        node.destroy_node()\n        if rclpy.ok():\n            rclpy.shutdown()\n\nif __name__ == '__main__':\n    main()", "sensor_monitor.py": "#!/usr/bin/env python3\n\"\"\"\nsensor_monitor.py - 센서 상태 통합 모니터링 노드 [300틱 속도표시 정합]\nROS2 터미널에서 GPS / IMU / 엔코더 / 주행 상태를 실시간으로 확인합니다.\n실행: ros2 run white sensor_monitor\n\"\"\"\n\nimport rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg import Float64MultiArray, Int32, String\nfrom sensor_msgs.msg import NavSatFix, Imu\nimport math\nimport time\n\n\nclass SensorMonitorNode(Node):\n    def __init__(self):\n        super().__init__(\"sensor_monitor_node\")\n\n        # ── 상태 변수 ──────────────────────────────────\n        self.gps_status_raw   = -1       # NavSatFix status.status\n        self.gps_last_time    = None\n        self.gps_lat          = 0.0\n        self.gps_lon          = 0.0\n        self.gps_recv_count   = 0        # 수신 카운터 (Hz 계산용)\n        self.gps_hz_buf       = []       # 최근 수신 시각 버퍼\n\n        self.imu_roll         = 0.0\n        self.imu_pitch        = 0.0\n        self.imu_yaw          = 0.0\n        self.imu_last_time    = None\n        self.imu_hz_buf       = []\n\n        self.encoder_val      = 0\n        self.encoder_speed_ms = 0.0\n        self.encoder_last_time= None\n        self.encoder_hz_buf   = []\n\n        self.ego_heading      = 0.0\n        self.ego_speed        = 0.0\n        self.ego_fused_lat    = 0.0\n        self.ego_fused_lon    = 0.0\n        self.ego_last_time    = None\n\n        self.gps_status_str   = \"수신 대기 중...\"\n\n        # ── 구독 ───────────────────────────────────────\n        self.create_subscription(NavSatFix,         \"/fix\",        self.cb_fix,     10)\n        self.create_subscription(Imu,               \"/imu/data\",   self.cb_imu,     10)\n        self.create_subscription(Int32,             \"/encoder\",    self.cb_encoder, 10)\n        self.create_subscription(Float64MultiArray, \"/ego_state\",  self.cb_ego,     10)\n        self.create_subscription(String,            \"/gps_status\", self.cb_gps_status, 10)\n\n        # 1초마다 터미널에 상태 출력\n        self.create_timer(1.0, self.print_status)\n\n        self.get_logger().info(\"🖥️  센서 모니터 시작 (1초 주기 상태 출력)\")\n\n    # ── 콜백 ───────────────────────────────────────────\n    def cb_fix(self, msg):\n        now = time.time()\n        self.gps_status_raw = msg.status.status\n        self.gps_lat        = msg.latitude\n        self.gps_lon        = msg.longitude\n        self.gps_last_time  = now\n        self.gps_hz_buf.append(now)\n        self.gps_hz_buf     = [t for t in self.gps_hz_buf if now - t <= 5.0]\n\n    def cb_imu(self, msg):\n        now = time.time()\n        # 쿼터니언 → 오일러 변환\n        x, y, z, w = (msg.orientation.x, msg.orientation.y,\n                      msg.orientation.z, msg.orientation.w)\n        sinr_cosp = 2.0 * (w * x + y * z)\n        cosr_cosp = 1.0 - 2.0 * (x * x + y * y)\n        self.imu_roll  = math.degrees(math.atan2(sinr_cosp, cosr_cosp))\n\n        sinp = 2.0 * (w * y - z * x)\n        sinp = max(-1.0, min(1.0, sinp))\n        self.imu_pitch = math.degrees(math.asin(sinp))\n\n        siny_cosp = 2.0 * (w * z + x * y)\n        cosy_cosp = 1.0 - 2.0 * (y * y + z * z)\n        self.imu_yaw   = math.degrees(math.atan2(siny_cosp, cosy_cosp))\n\n        self.imu_last_time = now\n        self.imu_hz_buf.append(now)\n        self.imu_hz_buf = [t for t in self.imu_hz_buf if now - t <= 5.0]\n\n    def cb_encoder(self, msg):\n        now = time.time()\n        self.encoder_val = msg.data\n        WHEEL_CIRCUMFERENCE = 0.27 * math.pi\n        TICKS_PER_REV = 300.0   # 실제 확인된 바퀴 1회전 전체 틱 수\n        DT = 0.01              # Arduino v6 속도 PID / d_val 갱신 기준 10ms\n        self.encoder_speed_ms = (float(msg.data) / TICKS_PER_REV) * WHEEL_CIRCUMFERENCE / DT\n        self.encoder_last_time = now\n        self.encoder_hz_buf.append(now)\n        self.encoder_hz_buf = [t for t in self.encoder_hz_buf if now - t <= 5.0]\n\n    def cb_ego(self, msg):\n        if len(msg.data) >= 7:\n            self.ego_fused_lat = msg.data[0]\n            self.ego_fused_lon = msg.data[1]\n            self.ego_heading   = msg.data[4]\n            self.ego_speed     = msg.data[5]\n            self.ego_last_time = time.time()\n\n    def cb_gps_status(self, msg):\n        self.gps_status_str = msg.data\n\n    # ── 유틸 ───────────────────────────────────────────\n    def calc_hz(self, buf):\n        if len(buf) < 2:\n            return 0.0\n        return (len(buf) - 1) / (buf[-1] - buf[0]) if (buf[-1] - buf[0]) > 0 else 0.0\n\n    def age_str(self, last_time):\n        if last_time is None:\n            return \"수신 없음\"\n        age = time.time() - last_time\n        if age > 10.0:\n            return f\"⛔ {age:.0f}초 전 (단절)\"\n        if age > 2.0:\n            return f\"⚠️  {age:.1f}초 전\"\n        return f\"✅ {age*1000:.0f}ms 전\"\n\n    def gps_status_label(self, status):\n        labels = {\n            -1: \"⛔ NO FIX   (위성 신호 없음)\",\n             0: \"🟡 GPS FIX  (일반, 오차 ~2-5m)\",\n             1: \"🟠 SBAS FIX (보정, 오차 ~1m)\",\n             2: \"🟢 RTK FIX  (고정밀, 오차 ~2cm)\",\n        }\n        return labels.get(status, f\"❓ UNKNOWN ({status})\")\n\n    # ── 상태 출력 (1초 주기) ────────────────────────────\n    def print_status(self):\n        now = time.time()\n        sep = \"═\" * 50\n\n        print(f\"\\n{sep}\")\n        print(f\"  🖥️  센서 상태 모니터  [{time.strftime('%H:%M:%S')}]\")\n        print(sep)\n\n        # ── GPS ─────────────────────────────────────────\n        gps_age = (now - self.gps_last_time) if self.gps_last_time else None\n        gps_hz  = self.calc_hz(self.gps_hz_buf)\n        print(f\"  📡 [GPS / RTK]\")\n        print(f\"     상태    : {self.gps_status_label(self.gps_status_raw)}\")\n        print(f\"     수신    : {self.age_str(self.gps_last_time)}  ({gps_hz:.1f} Hz)\")\n        if self.gps_last_time:\n            print(f\"     좌표    : {self.gps_lat:.8f}, {self.gps_lon:.8f}\")\n        if gps_age and gps_age > 2.0:\n            print(f\"     ⚠️  GPS 수신 지연 {gps_age:.1f}초 — 위치 정확도 저하!\")\n        if self.gps_status_raw < 2 and self.gps_last_time:\n            print(f\"     ⚠️  RTK FIX 아님 — 주행 정확도가 낮을 수 있습니다.\")\n\n        print()\n\n        # ── IMU ─────────────────────────────────────────\n        imu_hz = self.calc_hz(self.imu_hz_buf)\n        print(f\"  🧭 [IMU]\")\n        print(f\"     수신    : {self.age_str(self.imu_last_time)}  ({imu_hz:.1f} Hz)\")\n        if self.imu_last_time:\n            print(f\"     Roll    : {self.imu_roll:+.2f}°   Pitch: {self.imu_pitch:+.2f}°   Yaw: {self.imu_yaw:+.2f}°\")\n        if self.imu_last_time is None or (now - self.imu_last_time) > 1.0:\n            print(f\"     ⛔ IMU 데이터 없음 — /dev/ttyUSB0 연결 확인 필요!\")\n\n        print()\n\n        # ── 엔코더 ──────────────────────────────────────\n        enc_hz = self.calc_hz(self.encoder_hz_buf)\n        print(f\"  🔢 [엔코더 / 속도]\")\n        print(f\"     수신    : {self.age_str(self.encoder_last_time)}  ({enc_hz:.1f} Hz)\")\n        if self.encoder_last_time:\n            direction = \"전진 ▶\" if self.encoder_speed_ms >= 0 else \"후진 ◀\"\n            print(f\"     틱값    : {self.encoder_val}  →  {abs(self.encoder_speed_ms):.3f} m/s  [{direction}]\")\n        if self.encoder_last_time is None or (now - self.encoder_last_time) > 1.0:\n            print(f\"     ⛔ 엔코더 없음 — Arduino 연결 확인 필요!\")\n\n        print()\n\n        # ── 융합 상태 (ego_state) ────────────────────────\n        print(f\"  🚗 [융합 상태 (ego_state)]\")\n        print(f\"     수신    : {self.age_str(self.ego_last_time)}\")\n        if self.ego_last_time:\n            print(f\"     헤딩    : {self.ego_heading:.1f}°\")\n            print(f\"     속도    : {self.ego_speed:.3f} m/s\")\n            print(f\"     융합위치: {self.ego_fused_lat:.8f}, {self.ego_fused_lon:.8f}\")\n        else:\n            print(f\"     ⚠️  ego_state 없음 — gps_imu 노드 헤딩 미확정 상태일 수 있음\")\n\n        print(sep)\n\n\ndef main(args=None):\n    rclpy.init(args=args)\n    node = SensorMonitorNode()\n    try:\n        rclpy.spin(node)\n    except KeyboardInterrupt:\n        pass\n    finally:\n        node.destroy_node()\n        if rclpy.ok():\n            rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()"}, "outline": {"driving.py": [{"n": "DrivingNode", "k": "class", "a": 381, "b": 1923, "i": 0}, {"n": "ticks_to_speed_ms", "k": "def", "a": 394, "b": 396, "i": 4}, {"n": "speed_ms_to_ticks_float", "k": "def", "a": 397, "b": 399, "i": 4}, {"n": "__init__", "k": "def", "a": 400, "b": 807, "i": 4}, {"n": "publish_event", "k": "def", "a": 808, "b": 816, "i": 4}, {"n": "_apply_speed_scaling", "k": "def", "a": 817, "b": 832, "i": 4}, {"n": "cb_encoder", "k": "def", "a": 833, "b": 847, "i": 4}, {"n": "_on_set_parameters", "k": "def", "a": 848, "b": 865, "i": 4}, {"n": "_dist_to_cusp", "k": "def", "a": 866, "b": 882, "i": 4}, {"n": "cb_imu", "k": "def", "a": 883, "b": 891, "i": 4}, {"n": "cb_ego", "k": "def", "a": 892, "b": 923, "i": 4}, {"n": "cb_terrain", "k": "def", "a": 924, "b": 930, "i": 4}, {"n": "cb_gps_status", "k": "def", "a": 931, "b": 943, "i": 4}, {"n": "cb_drive_cmd", "k": "def", "a": 944, "b": 954, "i": 4}, {"n": "load_waypoints", "k": "def", "a": 955, "b": 1062, "i": 4}, {"n": "_dist", "k": "def", "a": 975, "b": 1062, "i": 8}, {"n": "request_stop", "k": "def", "a": 1063, "b": 1066, "i": 4}, {"n": "publish_cmd", "k": "def", "a": 1067, "b": 1082, "i": 4}, {"n": "instant_stop", "k": "def", "a": 1083, "b": 1097, "i": 4}, {"n": "scan_curve_demand", "k": "def", "a": 1098, "b": 1182, "i": 4}, {"n": "idx_at", "k": "def", "a": 1122, "b": 1127, "i": 8}, {"n": "heading_between", "k": "def", "a": 1128, "b": 1182, "i": 8}, {"n": "compute_segment_cte", "k": "def", "a": 1183, "b": 1215, "i": 4}, {"n": "_norm_deg", "k": "def", "a": 1216, "b": 1220, "i": 4}, {"n": "get_final_path_heading_deg", "k": "def", "a": 1221, "b": 1238, "i": 4}, {"n": "get_final_heading_error_deg", "k": "def", "a": 1239, "b": 1241, "i": 4}, {"n": "final_line_target_latlon", "k": "def", "a": 1242, "b": 1257, "i": 4}, {"n": "lookup_gains", "k": "def", "a": 1258, "b": 1273, "i":
